<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V43 Final</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .rain-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%); backdrop-filter: blur(8px); }
        .fog-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(100,116,139,0.9) 100%); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- AUTOCORRECCIÓN DE MEMORIA GEMINI ---
        if (localStorage.getItem('gemini_model') === 'gemini-1.5-pro' || localStorage.getItem('gemini_model') === 'gemini-1.5-flash') {
            localStorage.setItem('gemini_model', 'gemini-3.6-flash');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            // ESTADOS PRINCIPALES
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [adminOpen, setAdminOpen] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            // CONFIGURACIONES
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_model') || 'gemini-3.6-flash');
            const [pilotName, setPilotName] = useState(localStorage.getItem('pilot_name') || 'Piloto en Turno');
            
            // OPERACIÓN
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const totalFlightsTarget = 16; 
            
            // CLIMA Y PROTOCOLOS
            const [isRaining, setIsRaining] = useState(false);
            const [isFoggy, setIsFoggy] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});
            const [rainProbMap, setRainProbMap] = useState({});

            // AUDIO
            const [audioUnlocked, setAudioUnlocked] = useState(false);
            
            // REFERENCIAS
            const audioUnlockedRef = useRef(false);
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const isFoggyRef = useRef(false);
            const windDataMapRef = useRef({});

            useEffect(() => {
                let unsubscribe = () => {};
                firebase.auth().signInAnonymously().then(() => {
                    unsubscribe = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            }
                            if (data.loggedFlightsCount !== undefined) setLoggedFlightsCount(data.loggedFlightsCount);
                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            if (data.isFoggy !== undefined) {
                                setIsFoggy(data.isFoggy);
                                isFoggyRef.current = data.isFoggy;
                            }
                            if (data.windDataMap) {
                                setWindDataMap(data.windDataMap);
                                windDataMapRef.current = data.windDataMap;
                            }
                            if (data.rainProbMap) setRainProbMap(data.rainProbMap);
                            if (data.pilotName) {
                                setPilotName(data.pilotName);
                                localStorage.setItem('pilot_name', data.pilotName);
                            }
                        }
                    }, (err) => console.error("Error leyendo datos:", err));
                }).catch((error) => console.error("Error Auth:", error));
                return () => unsubscribe();
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema de voz en línea.");
                    u.lang = 'es-MX'; u.volume = 0.3;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                    setShiftName((h >= 7 && h < 19) ? 'Turno Diurno' : 'Turno Nocturno');
                    
                    if (s === 0) { 
                        // 1. Alarmas Estáticas de Operación
                        if (h === 7 && m === 50) {
                            speak("Atención. Inicio de junta operativa shop floor.");
                            setModal({ isOpen: true, title: '⏰ JUNTA OPERATIVA', message: 'Reunión de Shopfloor en curso (07:50 - 08:15). Vuelos bloqueados.', type: 'error' });
                        }
                        else if (h === 12 && m === 0) {
                            speak("Atención comandante. Es hora de elaborar los reportes K P I y actualizar el clima.");
                            setModal({ isOpen: true, title: '📊 KPIs y CLIMA', message: 'Elaboración de KPIs y escaneo de captura meteorológica requeridos.', type: 'error' });
                        }
                        else if (h === 0 && m === 5) {
                            speak("Atención. Actualización de captura del clima requerida. Confirme ou kei to flai.");
                            setModal({ isOpen: true, title: '🌙 ACTUALIZAR CLIMA', message: 'Es obligatorio actualizar la captura del clima y validar condiciones para la madrugada.', type: 'error' });
                        }

                        // 2. Alarma de Evidencia Fotográfica (Cada hora en punto)
                        if (m === 0 && (isRainingRef.current || isFoggyRef.current || (windDataMapRef.current[h] >= 40))) {
                            speak("Atención piloto. Es hora de tomar evidencia fotográfica de las condiciones meteorológicas.");
                        }

                        // 3. Alarmas Prevuelo (10 y 5 min) y Recálculo por Retraso
                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current && !isFoggyRef.current) {
                            flightsRef.current.forEach(flight => {
                                if (flight.wind < 42) {
                                    let flightDate = new Date();
                                    flightDate.setHours(flight.hour24, flight.min, 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    
                                    let w10Str = `${String(warn10.getHours()).padStart(2, '0')}:${String(warn10.getMinutes()).padStart(2, '0')}`;
                                    let w5Str = `${String(warn5.getHours()).padStart(2, '0')}:${String(warn5.getMinutes()).padStart(2, '0')}`;
                                    
                                    if (timeStr === w10Str) speak(`Atención piloto. Faltan 10 minutos para el vuelo programado a las ${flight.time}. Inicie protocolo.`);
                                    if (timeStr === w5Str) speak(`Atención piloto. Faltan 5 minutos para el despegue de las ${flight.time}. Prepárese.`);
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleZohoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                speak("Procesando documento de Zojo.");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        let foundName = null;
                        for (let row of json) {
                            if (row.length > 0) {
                                const rowStr = row.join(" ").toLowerCase();
                                if (rowStr.includes("omar") || rowStr.includes("antonio") || rowStr.includes("eduardo") || rowStr.includes("piloto")) {
                                    foundName = row.find(cell => typeof cell === 'string' && cell.trim() !== '');
                                    break;
                                }
                            }
                        }
                        
                        if (foundName) {
                            setPilotName(foundName);
                            db.collection('operaciones').doc('turno_actual').set({ pilotName: foundName }, { merge: true });
                            speak(`Piloto identificado como ${foundName}`);
                        } else {
                            speak("No se pudo extraer el nombre. Archivo no reconocido.");
                        }
                    } catch(err) {
                        console.error(err);
                        speak("Error al leer el archivo de excel.");
                    }
                };
                reader.readAsBinaryString(file);
                setAdminOpen(false);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    setModal({ isOpen: true, title: 'Falta la Llave', message: 'Abre los ajustes (⚙️) y pega tu llave API.' });
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima avanzado. Detectando vientos y lluvia.");
                
                try {
                    const key = geminiKey.trim();
                    const model = geminiModel.trim() || 'gemini-3.6-flash';
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLAS: Si solo dice 'UV' ES APTO PARA VOLAR, viento es 0. Si dice 'Apto para volar', viento es 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. EXTRAE LA PROBABILIDAD DE PRECIPITACIÓN/LLUVIA (ej 60%, 100%). Devuelve JSON ESTRICTO con 'hourlyData' teniendo 'time' (ej. '11:00am'), 'wind' numérico y 'rainProb' numérico (0 a 100)." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(`Error de IA. Detalle: ${errData.error?.message || response.statusText}`);
                    }

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) {
                         aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    }
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario cuántico generado exitosamente.");
                    } else {
                         throw new Error("La IA devolvió un formato incorrecto.");
                    }
                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al procesar. Intentando modo seguro.");
                    setModal({ isOpen: true, title: 'Error de Análisis IA', message: error.message });
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {};
                let rainMap = {};
                for(let i=0; i<24; i++) { windMap[i] = 0; rainMap[i] = 0; }

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dataPoint => {
                          let hourMatch = dataPoint.time.match(/(\d+):00([ap]m)/i);
                          if (hourMatch) {
                               let hour = parseInt(hourMatch[1]);
                               let ampm = hourMatch[2].toLowerCase();
                               if (ampm === 'pm' && hour < 12) hour += 12;
                               if (ampm === 'am' && hour === 12) hour = 0;
                               windMap[hour] = dataPoint.wind || 0;
                               rainMap[hour] = dataPoint.rainProb || 0;
                          }
                     });
                }

                setWindDataMap(windMap);
                setRainProbMap(rainMap);
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap, rainProbMap: rainMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    
                    // Sumar entre 10 y 25 minutos al azar (Factor Sorpresa)
                    let variance = Math.floor(Math.random() * 16) + 10; 
                    let date = new Date(2026, 0, 1, h, m + variance);
                    let newH = date.getHours();
                    let newM = date.getMinutes();
                    
                    let timeInMins = newH * 60 + newM;

                    // ZONAS PROHIBIDAS (Handovers y Junta)
                    const blocks = [
                        { start: 6*60 + 45, end: 7*60 + 15 },   // 06:45 a 07:15
                        { start: 7*60 + 50, end: 8*60 + 15 },   // 07:50 a 08:15
                        { start: 18*60 + 45, end: 19*60 + 15 }  // 18:45 a 19:15
                    ];

                    for (let b of blocks) {
                        if (timeInMins >= b.start && timeInMins <= b.end) {
                            timeInMins = b.end + 15; // Empujar fuera del bloqueo
                        }
                    }

                    newH = Math.floor(timeInMins / 60) % 24;
                    newM = timeInMins % 60;
                    return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
                };

                // HORARIO BASE (16 VUELOS, Cada 1.5h Aprox)
                let baseSchedule = [
                    { time: applyVariance("00:30"), type: "DINÁMICO", hour24: 0 },
                    { time: applyVariance("02:00"), type: "DINÁMICO", hour24: 2 },
                    { time: applyVariance("03:30"), type: "DINÁMICO", hour24: 3 },
                    { time: applyVariance("05:00"), type: "DINÁMICO", hour24: 5 },
                    { time: applyVariance("06:00", true), type: "FORZOSO", hour24: 6 },
                    { time: applyVariance("07:20", true), type: "FORZOSO", hour24: 7 }, 
                    { time: applyVariance("08:45"), type: "DINÁMICO", hour24: 8 },
                    { time: applyVariance("10:15"), type: "DINÁMICO", hour24: 10 },
                    { time: applyVariance("11:45"), type: "DINÁMICO", hour24: 11 },
                    { time: applyVariance("14:00", true), type: "FORZOSO", hour24: 14 }, 
                    { time: applyVariance("15:30"), type: "DINÁMICO", hour24: 15 },
                    { time: applyVariance("17:00", true), type: "FORZOSO", hour24: 17 }, 
                    { time: applyVariance("19:25", true), type: "FORZOSO", hour24: 19 },
                    { time: applyVariance("20:15"), type: "DINÁMICO", hour24: 20 },
                    { time: applyVariance("21:30", true), type: "FORZOSO", hour24: 21 }, 
                    { time: applyVariance("23:00"), type: "DINÁMICO", hour24: 23 }
                ];

                // REGLAS DE COMPRESIÓN (Si hay viento > 40 a las 11 o 12)
                const isSuspendedAt11 = windMap[11] >= 40;
                const isSuspendedAt12 = windMap[12] >= 40 && !isSuspendedAt11;

                if (isSuspendedAt11) {
                    baseSchedule[6] = { time: applyVariance("08:20"), type: "DINÁMICO", hour24: 8 };
                    baseSchedule[7] = { time: applyVariance("09:20"), type: "DINÁMICO", hour24: 9 };
                    baseSchedule[8] = { time: applyVariance("10:15"), type: "DINÁMICO", hour24: 10 };
                } else if (isSuspendedAt12) {
                    baseSchedule[6] = { time: applyVariance("08:20"), type: "DINÁMICO", hour24: 8 };
                    baseSchedule[7] = { time: applyVariance("09:20"), type: "DINÁMICO", hour24: 9 };
                    baseSchedule[8] = { time: applyVariance("10:20"), type: "DINÁMICO", hour24: 10 };
                    baseSchedule.splice(9, 0, { time: applyVariance("11:20"), type: "DINÁMICO", hour24: 11 });
                }

                // Aplicar Clima Final
                const finalSchedule = baseSchedule.map(f => {
                    let h24 = parseInt(f.time.split(':')[0]);
                    return {
                        ...f,
                        min: parseInt(f.time.split(':')[1]),
                        hour24: h24,
                        wind: windMap[h24] >= 40 ? 45 : (windMap[h24] || 0),
                        rainProb: rainMap[h24] || 0
                    };
                });

                setFlights(finalSchedule);
                flightsRef.current = finalSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const toggleRainProtocol = () => {
                const newState = !isRaining;
                setIsRaining(newState);
                isRainingRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isRaining: newState }, { merge: true });

                if (newState) {
                    speak("Alerta. Operaciones suspendidas por lluvia local.");
                } else {
                    speak("Lluvia finalizada.");
                }
            };

            const toggleFogProtocol = () => {
                const newState = !isFoggy;
                setIsFoggy(newState);
                isFoggyRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isFoggy: newState }, { merge: true });

                if (newState) {
                    speak("Alerta. Operaciones suspendidas por visibilidad nula. Banco de neblina detectado.");
                } else {
                    speak("Visibilidad restaurada.");
                }
            };

            const handleLogManualFlight = () => {
                 if (isRaining || isFoggy) {
                     setModal({ isOpen: true, title: 'Bloqueo Meteorológico', message: 'No puedes registrar despegues durante suspensiones (Lluvia/Neblina).', type: 'error' });
                     return;
                 }
                 if (loggedFlightsCount < totalFlightsTarget) {
                      const newCount = loggedFlightsCount + 1;
                      setLoggedFlightsCount(newCount);
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                      speak(`Vuelo registrado exitosamente. Total del día, ${newCount} de ${totalFlightsTarget}.`);
                 } else {
                      speak("Meta diaria de vuelos completada.");
                 }
            };

            const undoLastFlight = () => {
                if (loggedFlightsCount > 0) {
                    const newCount = loggedFlightsCount - 1;
                    setLoggedFlightsCount(newCount);
                    db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                    speak("Registro cancelado.");
                }
            };

            // FILTRO: Mostrar solo los vuelos desde -15 min del tiempo actual en adelante
            const currentMins = currentTime.getHours() * 60 + currentTime.getMinutes();
            const futureFlights = flights.filter(f => (f.hour24 * 60 + f.min) >= currentMins - 15);

            return (
                <div className="min-h-screen p-4 w-full max-w-[400px] mx-auto pb-32" onClick={unlockAudio}>
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-indigo-400 mt-1 tracking-widest uppercase">V43 FINAL • COMPACTO</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700 transition">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700 transition">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse shadow-md">
                            🔇 Toca la pantalla para activar Voz
                        </div>
                    )}

                    {/* Stats & Scan */}
                    <div className="glass-card p-4 rounded-2xl mb-4 relative overflow-hidden">
                        
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-2xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-2 inline-block bg-indigo-900/50 border border-indigo-700 text-indigo-300 text-[9px] font-black px-2 py-1 rounded uppercase tracking-widest max-w-[150px] truncate">
                                    👨‍✈️ {pilotName}
                                </div>
                            </div>

                            <div className="text-right flex flex-col items-end">
                                <div className={`mb-2 px-3 py-1.5 rounded-xl border shadow-lg ${shiftName === 'Turno Diurno' ? 'bg-amber-500/20 border-amber-500/50' : 'bg-fuchsia-600/20 border-fuchsia-500/50'}`}>
                                    <p className={`text-[9px] font-black uppercase tracking-widest ${shiftName === 'Turno Diurno' ? 'text-amber-400' : 'text-fuchsia-400'}`}>Faltan</p>
                                    <div className="text-xl font-black text-white drop-shadow-md text-right">
                                        {Math.max(0, totalFlightsTarget - loggedFlightsCount)}
                                    </div>
                                </div>
                                <div className="flex items-baseline gap-1 bg-[#0f172a] px-3 py-2 rounded-xl border border-indigo-500/30 shadow-[0_0_15px_rgba(79,70,229,0.3)]">
                                    <span className="text-4xl font-black text-white tracking-tighter drop-shadow-lg">{loggedFlightsCount}</span>
                                    <span className="text-lg font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                            </div>
                        </div>
                        
                        {/* Botones de Operación (Compactos) */}
                        <div className="flex flex-col gap-2 mt-4 border-t border-slate-800 pt-4">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            
                            <button onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }} disabled={isScanning || isRaining || isFoggy} className={`w-full py-3 rounded-xl font-bold text-xs transition flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : (isRaining||isFoggy) ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}>
                                {isScanning ? '⏳ Analizando...' : '📸 CLIMA'}
                            </button>
                            
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={(e) => { e.stopPropagation(); toggleRainProtocol(); }} className={`w-full py-3 rounded-xl font-bold text-xs transition flex justify-center items-center gap-1 ${isRaining ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-rose-900/40 hover:bg-rose-900/60 text-rose-400 border border-rose-900'}`}>
                                    {isRaining ? '☀️ REANUDAR' : '🌧️ LLUVIA'}
                                </button>

                                <button onClick={(e) => { e.stopPropagation(); toggleFogProtocol(); }} className={`w-full py-3 rounded-xl font-bold text-xs transition flex justify-center items-center gap-1 ${isFoggy ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-slate-700 hover:bg-slate-600 text-slate-300 border border-slate-500'}`}>
                                    {isFoggy ? '☀️ DESPEJADO' : '🌫️ NEBLINA'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {isRaining && (
                        <div className="bg-rose-600 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase tracking-wider text-xs shadow-[0_0_20px_rgba(225,29,72,0.5)] animate-pulse">⚠️ SUSPENDIDO POR LLUVIA</div>
                    )}
                    {isFoggy && !isRaining && (
                        <div className="bg-slate-500 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase tracking-wider text-xs shadow-[0_0_20px_rgba(100,116,139,0.5)] animate-pulse">🌫️ VISIBILIDAD NULA</div>
                    )}

                    {/* Lista Restante */}
                    <div className={`glass-card p-4 rounded-2xl mb-6 relative ${(isRaining || isFoggy) ? 'opacity-50 pointer-events-none' : ''}`}>
                        {isRaining && <div className="absolute inset-0 rain-overlay rounded-2xl z-10"></div>}
                        {isFoggy && !isRaining && <div className="absolute inset-0 fog-overlay rounded-2xl z-10"></div>}

                        <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-3">🗓️ Plan Restante ({futureFlights.length} Vuelos)</p>
                        
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">Sube captura para generar.</div>
                        ) : futureFlights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-emerald-500">✅ Vuelos concluidos.</div>
                        ) : (
                            <div className="space-y-2">
                                {futureFlights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-2.5 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50 opacity-75' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-base font-black text-white tracking-wide">{f.time}</div>
                                            <div className="flex gap-2 items-center mt-0.5">
                                                <div className={`text-[9px] font-bold uppercase tracking-wider ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                    {f.wind >= 42 ? `🚫 Susp. (${f.wind}k)` : `✅ Libre (${f.wind}k)`}
                                                </div>
                                                {f.rainProb > 0 && (
                                                    <div className="text-[9px] font-bold uppercase tracking-wider text-cyan-400">
                                                        ☔ {f.rainProb}% Lluvia
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Botonera Flotante Inferior */}
                    <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[#0B0F19] via-[#0B0F19] to-transparent flex justify-center items-center gap-2 z-40 pointer-events-none">
                        <div className="w-full max-w-[400px] mx-auto flex gap-2">
                             <button onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }} disabled={isRaining || isFoggy} className={`pointer-events-auto flex-1 font-black py-4 rounded-xl text-sm transition transform hover:scale-105 ${isRaining || isFoggy ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]'}`}>
                                 ✈️ REGISTRAR
                             </button>
                             <button onClick={(e) => { e.stopPropagation(); undoLastFlight(); }} className="pointer-events-auto bg-rose-900/50 hover:bg-rose-900 text-rose-300 font-black py-4 px-4 rounded-xl border border-rose-800 transition shadow-lg text-sm" title="Deshacer">
                                 -1
                             </button>
                        </div>
                    </div>

                    {/* Modales */}
                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] shadow-2xl p-5">
                                <h2 className="text-base font-black text-white mb-4">⚙️ Ajustes</h2>
                                <div className="mb-4">
                                    <label className="block text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">Modelo IA</label>
                                    <input type="text" value={geminiModel} onChange={e => setGeminiModel(e.target.value)} className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white font-mono text-xs outline-none" />
                                </div>
                                <div className="mb-5">
                                    <label className="block text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">Llave API</label>
                                    <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white font-mono text-xs outline-none" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 rounded-lg text-xs">Cerrar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); localStorage.setItem('gemini_model', geminiModel); setSettingsOpen(false); speak("Ajustes guardados."); }} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] shadow-2xl p-5">
                                <h2 className="text-base font-black text-indigo-400 mb-2">👨‍💼 Admin</h2>
                                <p className="text-slate-400 text-[10px] mb-5">Sube el archivo Excel Zoho para actualizar piloto.</p>
                                <input type="file" id="zohoUpload" accept=".csv, .xlsx" className="hidden" onChange={handleZohoUpload} />
                                <button onClick={() => document.getElementById('zohoUpload').click()} className="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-xs mb-2 border border-emerald-500 shadow-[0_0_15px_rgba(4,120,87,0.3)]">📗 SUBIR ZOHO</button>
                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg text-xs">Cancelar</button>
                            </div>
                        </div>
                    )}
                    
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] shadow-2xl p-5 border-l-4 border-l-indigo-500">
                                <h2 className="text-base font-black text-white mb-2">{modal.title}</h2>
                                <p className="text-slate-300 text-xs mb-5">{modal.message}</p>
                                <button onClick={() => setModal({ ...modal, isOpen: false })} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-xs">Entendido</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
