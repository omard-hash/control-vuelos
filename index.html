<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V43 Final</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .rain-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%); backdrop-filter: blur(8px); }
        .fog-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(100,116,139,0.9) 100%); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        if (localStorage.getItem('gemini_model') === 'gemini-1.5-pro' || localStorage.getItem('gemini_model') === 'gemini-1.5-flash') {
            localStorage.setItem('gemini_model', 'gemini-3.6-flash');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [adminOpen, setAdminOpen] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_model') || 'gemini-3.6-flash');
            const [pilotName, setPilotName] = useState(localStorage.getItem('pilot_name') || 'Piloto en Turno');
            
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const [lastResetDate, setLastResetDate] = useState('');
            const totalFlightsTarget = 16; 
            
            const [isRaining, setIsRaining] = useState(false);
            const [isFoggy, setIsFoggy] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});
            const [rainProbMap, setRainProbMap] = useState({});

            const [audioUnlocked, setAudioUnlocked] = useState(false);
            
            const audioUnlockedRef = useRef(false);
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const isFoggyRef = useRef(false);
            const windDataMapRef = useRef({});
            const lastResetDateRef = useRef('');

            useEffect(() => {
                let unsubscribe = () => {};
                firebase.auth().signInAnonymously().then(() => {
                    unsubscribe = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            }
                            if (data.loggedFlightsCount !== undefined) setLoggedFlightsCount(data.loggedFlightsCount);
                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            if (data.isFoggy !== undefined) {
                                setIsFoggy(data.isFoggy);
                                isFoggyRef.current = data.isFoggy;
                            }
                            if (data.windDataMap) {
                                setWindDataMap(data.windDataMap);
                                windDataMapRef.current = data.windDataMap;
                            }
                            if (data.rainProbMap) setRainProbMap(data.rainProbMap);
                            if (data.pilotName) {
                                setPilotName(data.pilotName);
                                localStorage.setItem('pilot_name', data.pilotName);
                            }
                            // Lógica de memoria para el cambio de día
                            if (data.lastResetDate) {
                                setLastResetDate(data.lastResetDate);
                                lastResetDateRef.current = data.lastResetDate;
                            } else {
                                const today = new Date().toDateString();
                                db.collection('operaciones').doc('turno_actual').set({ lastResetDate: today }, { merge: true });
                                lastResetDateRef.current = today;
                            }
                        }
                    }, (err) => console.error("Error leyendo datos:", err));
                }).catch((error) => console.error("Error Auth:", error));
                return () => unsubscribe();
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    utterance.volume = 1.0; // VOLUMEN AL 100%
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema de voz en línea y calibrado.");
                    u.lang = 'es-MX'; 
                    u.volume = 1.0; // VOLUMEN AL 100%
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                    // REINICIO DE CONTADOR (Corte de media noche)
                    const todayStr = now.toDateString();
                    if (lastResetDateRef.current && lastResetDateRef.current !== todayStr) {
                        lastResetDateRef.current = todayStr; // Actualiza ref
                        db.collection('operaciones').doc('turno_actual').set({ 
                            loggedFlightsCount: 0,
                            lastResetDate: todayStr
                        }, { merge: true });
                        speak("Corte de media noche. El contador de vuelos ha sido reiniciado a cero para el nuevo día.");
                    }

                    setShiftName((h >= 7 && h < 19) ? 'Turno Diurno' : 'Turno Nocturno');
                    
                    if (s === 0) { 
                        // Autocambio de piloto con Zoho Scanner a las 7 AM y 7 PM
                        if ((h === 7 && m === 0) || (h === 19 && m === 0)) {
                            autoAssignPilot();
                            speak("Cambio de turno. Asignando nuevo piloto automáticamente de la matriz.");
                        }

                        // Alarmas Estáticas Administrativas
                        if (h === 7 && m === 50) {
                            speak("Atención. Inicio de junta operativa shop floor. Ventana de vuelo bloqueada.");
                            setModal({ isOpen: true, title: '⏰ JUNTA OPERATIVA', message: 'Reunión de Shopfloor en curso (07:50 - 08:15). Vuelos bloqueados.', type: 'error' });
                        }
                        else if (h === 12 && m === 0) {
                            speak("Atención comandante. Es hora de elaborar los reportes de capé i y actualizar el clima.");
                            setModal({ isOpen: true, title: '📊 KPIs y CLIMA', message: 'Elaboración de KPIs y escaneo de captura meteorológica requeridos.', type: 'error' });
                        }
                        else if (h === 0 && m === 5) {
                            speak("Atención. Actualización de captura del clima requerida. Valide condiciones para la madrugada.");
                            setModal({ isOpen: true, title: '🌙 ACTUALIZAR CLIMA', message: 'Es obligatorio actualizar la captura del clima y validar condiciones para la madrugada.', type: 'error' });
                        }

                        // Evidencias (Vientos o lluvia)
                        if (m === 0 && (isRainingRef.current || isFoggyRef.current || (windDataMapRef.current[h] >= 40))) {
                            speak("Atención piloto. Es hora de tomar evidencia fotográfica de las condiciones meteorológicas.");
                        }

                        // Prevuelos y Demoras
                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current && !isFoggyRef.current) {
                            flightsRef.current.forEach(flight => {
                                if (flight.wind < 42) {
                                    let flightDate = new Date();
                                    flightDate.setHours(flight.hour24, flight.min, 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    let overdue = new Date(flightDate.getTime() + 16 * 60000); // 16 min después (Demora)
                                    
                                    let w10Str = `${String(warn10.getHours()).padStart(2, '0')}:${String(warn10.getMinutes()).padStart(2, '0')}`;
                                    let w5Str = `${String(warn5.getHours()).padStart(2, '0')}:${String(warn5.getMinutes()).padStart(2, '0')}`;
                                    let overdueStr = `${String(overdue.getHours()).padStart(2, '0')}:${String(overdue.getMinutes()).padStart(2, '0')}`;
                                    
                                    if (timeStr === w10Str) speak(`Atención piloto. Faltan 10 minutos para el vuelo programado a las ${flight.time}.`);
                                    if (timeStr === w5Str) speak(`Faltan 5 minutos para el despegue de las ${flight.time}. Prepárese.`);
                                    if (timeStr === overdueStr && flight.type !== 'FORZOSO') {
                                        speak(`Se ha detectado un retraso operativo en el vuelo de las ${flight.time}. Re-calculando itinerario restante...`);
                                    }
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const autoAssignPilot = (jsonData = null) => {
                try {
                    const rawData = jsonData || localStorage.getItem('zoho_schedule');
                    if (!rawData) return;
                    
                    const json = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                    const now = new Date();
                    const h = now.getHours();
                    
                    // LÓGICA DE MADRUGADA: Si son menos de las 7am (Ej. 2 AM), estamos operando el turno que empezó AYER.
                    let targetDate = new Date();
                    if (h < 7) {
                        targetDate.setDate(targetDate.getDate() - 1);
                    }

                    // Determinar qué letra buscar en base al horario
                    const isDayShift = h >= 7 && h < 19;
                    const shiftCodeToFind = isDayShift ? "d" : "n"; // Buscamos "D" o "N"
                    const d = String(targetDate.getDate()); // Día numérico del mes en texto (ej. "27")
                    
                    let foundName = null;
                    let dateColumnIndex = -1;
                    
                    // PASO 1: ESCANER HORIZONTAL (Buscar la columna con el día de hoy)
                    for (let r = 0; r < Math.min(json.length, 5); r++) {
                        if (!json[r]) continue;
                        for (let c = 0; c < json[r].length; c++) {
                            const cell = String(json[r][c]).toLowerCase().trim();
                            // Buscar el número "27" suelto o "27/07" o "27-jul"
                            if (cell === d || cell === `0${d}` || cell.startsWith(`${d}/`) || cell.startsWith(`${d}-`)) {
                                dateColumnIndex = c;
                                break;
                            }
                        }
                        if (dateColumnIndex !== -1) break;
                    }

                    // PASO 2: ESCANER VERTICAL (Bajar por la columna de hoy buscando "D" o "N")
                    if (dateColumnIndex !== -1) {
                        for (let r = 0; r < json.length; r++) {
                            if (!json[r] || !json[r][dateColumnIndex]) continue;
                            const shiftValue = String(json[r][dateColumnIndex]).toLowerCase().trim();
                            
                            // ¿Es el turno que buscamos? (Día o Noche)
                            if (shiftValue === shiftCodeToFind || shiftValue === shiftCodeToFind.toUpperCase() || shiftValue.includes(shiftCodeToFind === "d" ? "dia" : "noche")) {
                                
                                // PASO 3: EXTRACCIÓN (Mirar a la izquierda, a la columna de Nombres)
                                // Generalmente los nombres están en la columna 0, 1 o 2.
                                for (let colNames = 0; colNames < 3; colNames++) {
                                    if (typeof json[r][colNames] === 'string' && json[r][colNames].length > 3) {
                                        foundName = json[r][colNames];
                                        break;
                                    }
                                }
                                break; // Detiene la búsqueda vertical porque ya lo encontramos
                            }
                        }
                    }

                    if (foundName) {
                        // Formatear Nombre (Primera letra Mayúscula)
                        foundName = foundName.replace(/\b\w/g, l => l.toUpperCase()).trim();
                        setPilotName(foundName);
                        db.collection('operaciones').doc('turno_actual').set({ pilotName: foundName }, { merge: true });
                        localStorage.setItem('pilot_name', foundName);
                    }
                } catch (err) {
                    console.error("Error en Zoho 3D Scanner:", err);
                }
            };

            const handleZohoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                speak("Procesando matriz de turnos. Sincronizando personal operativo.");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                        
                        localStorage.setItem('zoho_schedule', JSON.stringify(json));
                        autoAssignPilot(json);
                        
                    } catch(err) {
                        console.error(err);
                        speak("Error al leer el archivo de excel.");
                    }
                };
                reader.readAsBinaryString(file);
                setAdminOpen(false);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    setModal({ isOpen: true, title: 'Falta la Llave', message: 'Abre los ajustes (⚙️) y pega tu llave API.' });
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima avanzado. Detectando vientos y precipitación.");
                
                try {
                    const key = geminiKey.trim();
                    const model = geminiModel.trim() || 'gemini-3.6-flash';
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLAS: Si solo dice 'UV' ES APTO PARA VOLAR, viento es 0. Si dice 'Apto para volar', viento es 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. EXTRAE LA PROBABILIDAD DE PRECIPITACIÓN/LLUVIA (ej 60%, 100%). Devuelve JSON ESTRICTO con 'hourlyData' teniendo 'time' (ej. '11:00am'), 'wind' numérico y 'rainProb' numérico (0 a 100)." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`Error de IA. Detalle: ${response.statusText}`);
                    }

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) {
                         aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    }
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario cuántico generado exitosamente.");
                    } else {
                         throw new Error("Formato incorrecto.");
                    }
                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al procesar. Intentando modo seguro.");
                    setModal({ isOpen: true, title: 'Error de Análisis IA', message: error.message });
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {};
                let rainMap = {};
                for(let i=0; i<24; i++) { windMap[i] = 0; rainMap[i] = 0; }

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dataPoint => {
                          let hourMatch = dataPoint.time.match(/(\d+):00([ap]m)/i);
                          if (hourMatch) {
                               let hour = parseInt(hourMatch[1]);
                               let ampm = hourMatch[2].toLowerCase();
                               if (ampm === 'pm' && hour < 12) hour += 12;
                               if (ampm === 'am' && hour === 12) hour = 0;
                               windMap[hour] = dataPoint.wind || 0;
                               rainMap[hour] = dataPoint.rainProb || 0;
                          }
                     });
                }

                setWindDataMap(windMap);
                setRainProbMap(rainMap);
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap, rainProbMap: rainMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    
                    // Factor Aleatorio (10 a 25 min)
                    let variance = Math.floor(Math.random() * 16) + 10; 
                    let date = new Date(2026, 0, 1, h, m + variance);
                    let newH = date.getHours();
                    let newM = date.getMinutes();
                    
                    let timeInMins = newH * 60 + newM;

                    // ZONAS PROHIBIDAS (Handovers y Junta Shopfloor)
                    const blocks = [
                        { start: 6*60 + 45, end: 7*60 + 15 },   // 06:45 a 07:15 (Cambio Turno AM)
                        { start: 7*60 + 50, end: 8*60 + 15 },   // 07:50 a 08:15 (Shopfloor)
                        { start: 18*60 + 45, end: 19*60 + 15 }  // 18:45 a 19:15 (Cambio Turno PM)
                    ];

                    for (let b of blocks) {
                        if (timeInMins >= b.start && timeInMins <= b.end) {
                            timeInMins = b.end + 15; // Rebota el vuelo
                        }
                    }

                    newH = Math.floor(timeInMins / 60) % 24;
                    newM = timeInMins % 60;
                    return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
                };

                // HORARIO DIARIO: 16 VUELOS (Forzosos Blindados)
                let baseSchedule = [
                    { time: applyVariance("00:30"), type: "DINÁMICO", hour24: 0 },
                    { time: applyVariance("02:00"), type: "DINÁMICO", hour24: 2 },
                    { time: applyVariance("03:30"), type: "DINÁMICO", hour24: 3 },
                    { time: applyVariance("05:00"), type: "DINÁMICO", hour24: 5 },
                    { time: applyVariance("06:00", true), type: "FORZOSO", hour24: 6 }, 
                    { time: applyVariance("07:20", true), type: "FORZOSO", hour24: 7 }, 
                    { time: applyVariance("08:45"), type: "DINÁMICO", hour24: 8 },
                    { time: applyVariance("10:15"), type: "DINÁMICO", hour24: 10 },
                    { time: applyVariance("11:45"), type: "DINÁMICO", hour24: 11 },
                    { time: applyVariance("14:00", true), type: "FORZOSO", hour24: 14 },
                    { time: applyVariance("15:30"), type: "DINÁMICO", hour24: 15 },
                    { time: applyVariance("17:00", true), type: "FORZOSO", hour24: 17 }, 
                    { time: applyVariance("19:25", true), type: "FORZOSO", hour24: 19 }, 
                    { time: applyVariance("20:15"), type: "DINÁMICO", hour24: 20 },
                    { time: applyVariance("21:30", true), type: "FORZOSO", hour24: 21 },
                    { time: applyVariance("23:00"), type: "DINÁMICO", hour24: 23 }
                ];

                const finalSchedule = baseSchedule.map(f => {
                    let h24 = parseInt(f.time.split(':')[0]);
                    return {
                        ...f,
                        min: parseInt(f.time.split(':')[1]),
                        hour24: h24,
                        wind: windMap[h24] >= 40 ? 45 : (windMap[h24] || 0),
                        rainProb: rainMap[h24] || 0
                    };
                });

                setFlights(finalSchedule);
                flightsRef.current = finalSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const toggleRainProtocol = () => {
                const newState = !isRaining;
                setIsRaining(newState);
                isRainingRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isRaining: newState }, { merge: true });
                if (newState) speak("Alerta. Operaciones suspendidas por lluvia local.");
                else speak("Lluvia finalizada.");
            };

            const toggleFogProtocol = () => {
                const newState = !isFoggy;
                setIsFoggy(newState);
                isFoggyRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isFoggy: newState }, { merge: true });
                if (newState) speak("Alerta. Operaciones suspendidas por neblina.");
                else speak("Visibilidad restaurada.");
            };

            const handleLogManualFlight = () => {
                 if (isRaining || isFoggy) {
                     setModal({ isOpen: true, title: 'Bloqueo', message: 'No puedes registrar despegues durante suspensiones.', type: 'error' });
                     return;
                 }
                 if (loggedFlightsCount < totalFlightsTarget) {
                      const newCount = loggedFlightsCount + 1;
                      setLoggedFlightsCount(newCount);
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                      speak(`Vuelo registrado. Total del día, ${newCount} de ${totalFlightsTarget}.`);
                 }
            };

            const undoLastFlight = () => {
                if (loggedFlightsCount > 0) {
                    const newCount = loggedFlightsCount - 1;
                    setLoggedFlightsCount(newCount);
                    db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                    speak("Registro deshecho.");
                }
            };

            const currentMins = currentTime.getHours() * 60 + currentTime.getMinutes();
            const futureFlights = flights.filter(f => (f.hour24 * 60 + f.min) >= currentMins - 15);

            return (
                <div className="min-h-screen p-4 w-full max-w-[400px] mx-auto pb-32" onClick={unlockAudio}>
                    
                    {/* Header */}
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-indigo-400 mt-1 tracking-widest uppercase">V43 FINAL • COMPACTO</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse">
                            🔇 Toca para activar Voz
                        </div>
                    )}

                    {/* Stats & Scan */}
                    <div className="glass-card p-4 rounded-2xl mb-4 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-2xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-2 inline-block bg-indigo-900/50 border border-indigo-700 text-indigo-300 text-[9px] font-black px-2 py-1 rounded uppercase tracking-widest max-w-[150px] truncate">
                                    👨‍✈️ {pilotName}
                                </div>
                            </div>
                            <div className="text-right flex flex-col items-end">
                                <div className="mb-2 px-3 py-1.5 rounded-xl border bg-[#0f172a] shadow-lg">
                                    <p className="text-[9px] font-black uppercase text-slate-400">Faltan</p>
                                    <div className="text-xl font-black text-white text-right">
                                        {Math.max(0, totalFlightsTarget - loggedFlightsCount)}
                                    </div>
                                </div>
                                <div className="flex items-baseline gap-1 bg-indigo-900/30 px-3 py-2 rounded-xl border border-indigo-500/30">
                                    <span className="text-4xl font-black text-white">{loggedFlightsCount}</span>
                                    <span className="text-lg font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex flex-col gap-2 mt-4 border-t border-slate-800 pt-4">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }} disabled={isScanning || isRaining || isFoggy} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}>
                                {isScanning ? '⏳ Analizando...' : '📸 CLIMA'}
                            </button>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={(e) => { e.stopPropagation(); toggleRainProtocol(); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isRaining ? 'bg-emerald-600 text-white' : 'bg-rose-900/40 text-rose-400 border border-rose-900'}`}>
                                    {isRaining ? '☀️ REANUDAR' : '🌧️ LLUVIA'}
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); toggleFogProtocol(); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isFoggy ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 border border-slate-500'}`}>
                                    {isFoggy ? '☀️ DESPEJADO' : '🌫️ NEBLINA'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {isRaining && <div className="bg-rose-600 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">⚠️ SUSPENDIDO POR LLUVIA</div>}
                    {isFoggy && !isRaining && <div className="bg-slate-500 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">🌫️ VISIBILIDAD NULA</div>}

                    {/* Vuelos Restantes */}
                    <div className={`glass-card p-4 rounded-2xl mb-6 relative ${(isRaining || isFoggy) ? 'opacity-50 pointer-events-none' : ''}`}>
                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-3">🗓️ Plan Restante ({futureFlights.length} Vuelos)</p>
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">Sube captura para generar.</div>
                        ) : futureFlights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-emerald-500">✅ Vuelos concluidos.</div>
                        ) : (
                            <div className="space-y-2">
                                {futureFlights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-2.5 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-base font-black text-white">{f.time}</div>
                                            <div className="flex gap-2 items-center mt-0.5">
                                                <div className={`text-[9px] font-bold uppercase ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                    {f.wind >= 42 ? `🚫 Susp. (${f.wind}k)` : `✅ Libre (${f.wind}k)`}
                                                </div>
                                                {f.rainProb > 0 && <div className="text-[9px] font-bold uppercase text-cyan-400">☔ {f.rainProb}% Lluvia</div>}
                                            </div>
                                        </div>
                                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-[#0B0F19] flex justify-center items-center gap-2 z-40 border-t border-slate-800">
                        <div className="w-full max-w-[400px] mx-auto flex gap-2">
                             <button onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }} disabled={isRaining || isFoggy} className={`flex-1 font-black py-4 rounded-xl text-sm ${isRaining || isFoggy ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                 ✈️ REGISTRAR
                             </button>
                             <button onClick={(e) => { e.stopPropagation(); undoLastFlight(); }} className="bg-rose-900/50 hover:bg-rose-900 text-rose-300 font-black py-4 px-5 rounded-xl border border-rose-800 text-sm">
                                 -1
                             </button>
                        </div>
                    </div>

                    {/* Modales */}
                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5">
                                <h2 className="text-base font-black text-white mb-4">⚙️ Ajustes</h2>
                                <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="API Key" className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white mb-4 text-xs" />
                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">Cerrar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); setSettingsOpen(false); }} className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5">
                                <h2 className="text-base font-black text-indigo-400 mb-2">👨‍💼 Admin (Pilotos)</h2>
                                <p className="text-[10px] text-slate-400 mb-4">Escaneo de Matriz 3D activo.</p>
                                <input type="file" id="zohoUpload" accept=".csv, .xlsx" className="hidden" onChange={handleZohoUpload} />
                                <button onClick={() => document.getElementById('zohoUpload').click()} className="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg text-xs mb-4">📗 SUBIR ZOHO (MATRIZ)</button>
                                
                                <div className="mb-4 pt-4 border-t border-slate-800">
                                    <label className="block text-[10px] text-slate-400 uppercase mb-1">Corrección Manual</label>
                                    <input type="text" value={pilotName} onChange={(e) => { setPilotName(e.target.value); db.collection('operaciones').doc('turno_actual').set({ pilotName: e.target.value }, { merge: true }); localStorage.setItem('pilot_name', e.target.value); }} className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white text-sm" />
                                </div>
                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs">Cerrar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
