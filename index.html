<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V42 Master</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- RESTAURADO A TU VERSIÓN ORIGINAL DE FIREBASE QUE SÍ TIENE PERMISOS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .rain-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%); backdrop-filter: blur(8px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useRef } = React;

        // Filtro Súper Inteligente de Fechas: Analiza el texto para encontrar el día y mes
        const isStringToday = (dateStr) => {
            if (!dateStr) return false;
            
            const today = new Date();
            const d = today.getDate(); // ej: 27
            const m = today.getMonth() + 1; // ej: 7
            
            const dPad = String(d).padStart(2, '0');
            const mPad = String(m).padStart(2, '0');
            const s = dateStr.toLowerCase();

            // 1. Busca formatos numéricos comunes (ej. 27/07, 27-07, 07/27)
            if (s.includes(`${dPad}/${mPad}`) || s.includes(`${dPad}-${mPad}`) || 
                s.includes(`${mPad}/${dPad}`) || s.includes(`${mPad}-${dPad}`) ||
                s.includes(`${d}/${m}/`) || s.includes(`${d}-${m}-`)) {
                return true;
            }

            // 2. Busca formatos de texto (ej. 27 jul, 27 de julio)
            const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            
            const mes = meses[today.getMonth()];
            const month = months[today.getMonth()];

            // Verifica que el número del día exista solo, y que tenga el mes
            const hasDay = new RegExp(`\\b0?${d}\\b`).test(s);
            const hasMonth = s.includes(mes) || s.includes(month);

            return (hasDay && hasMonth);
        };

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            // Estados para Operadores
            const [adminOpen, setAdminOpen] = useState(false);
            const [operators, setOperators] = useState([]);
            const [currentOperator, setCurrentOperator] = useState('Sin asignar');
            const [isScanningCSV, setIsScanningCSV] = useState(false);
            const operatorsRef = useRef([]);
            const currentOperatorRef = useRef('Sin asignar');

            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const totalFlightsTarget = 13;

            const [isRaining, setIsRaining] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});

            const [audioUnlocked, setAudioUnlocked] = useState(false);
            const audioUnlockedRef = useRef(false);
            
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const loggedFlightsCountRef = useRef(0);
            const authReady = useRef(false);

            useEffect(() => {
                let unsubscribe = () => {};

                auth.signInAnonymously().then(() => {
                    authReady.current = true;
                    
                    unsubscribe = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            } else {
                                setFlights([]);
                                flightsRef.current = [];
                            }
                            
                            if (data.loggedFlightsCount !== undefined) {
                                setLoggedFlightsCount(data.loggedFlightsCount);
                                loggedFlightsCountRef.current = data.loggedFlightsCount;
                            } else {
                                setLoggedFlightsCount(0);
                                loggedFlightsCountRef.current = 0;
                            }
                            
                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            
                            if (data.windDataMap) setWindDataMap(data.windDataMap);
                            
                            if (data.operators) {
                                setOperators(data.operators);
                                operatorsRef.current = data.operators;
                            } else {
                                setOperators([]);
                                operatorsRef.current = [];
                            }
                        }
                    }, (err) => {
                        console.error("Error sincronizando datos:", err);
                        setModal({ isOpen: true, title: 'Error de Conexión', message: 'No se pudo sincronizar con la base de datos.', type: 'error' });
                    });
                }).catch((error) => {
                    console.error("Error Auth Firebase:", error);
                });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                audioUnlockedRef.current = audioUnlocked;
            }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema activado.");
                    u.lang = 'es-MX';
                    u.volume = 0.3;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();

                    if (h >= 7 && h < 19) setShiftName('Turno Diurno');
                    else setShiftName('Turno Nocturno');
                    
                    // FILTRO DE OPERADORES
                    let foundOperator = 'Sin asignar';
                    const currentTotalMins = h * 60 + m;

                    if (operatorsRef.current && operatorsRef.current.length > 0) {
                        for (let op of operatorsRef.current) {
                            let isTodayShift = op.dateStr ? isStringToday(op.dateStr) : true;

                            if (isTodayShift) {
                                let startParts = op.start.split(':');
                                let endParts = op.end.split(':');
                                let startTotal = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                                let endTotal = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
                                
                                if (startTotal <= endTotal) {
                                    if (currentTotalMins >= startTotal && currentTotalMins < endTotal) foundOperator = op.name;
                                } else {
                                    if (currentTotalMins >= startTotal || currentTotalMins < endTotal) foundOperator = op.name;
                                }
                            }
                        }
                    }

                    if (currentOperatorRef.current !== foundOperator) {
                        setCurrentOperator(foundOperator);
                        currentOperatorRef.current = foundOperator;
                    }

                    // CORTE NOCTURNO ESTRICTO (12:00 AM)
                    if (h === 0 && m === 0 && s === 0 && authReady.current) {
                        speak("Iniciando nuevo día de operaciones. Borrando bitácora de vuelos e inicializando contadores a cero.");
                        db.collection('operaciones').doc('turno_actual').set({
                            flights: [],
                            loggedFlightsCount: 0,
                            isRaining: false,
                            windDataMap: {}
                        }, { merge: true });
                    }

                    // ALERTAS DE VOZ (Juntas, Clima, Vuelos)
                    if (s === 0) {
                        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        
                        if (h === 7 && m === 50) {
                            speak("Atención comandante. Es hora de la junta operativa de las siete cincuenta.");
                            setModal({ isOpen: true, title: '⏰ JUNTA OPERATIVA', message: 'Reunión de las 7:50 AM.', type: 'error' });
                        } else if (h === 12 && m === 0) {
                            speak("Atención comandante. Es hora de elaborar los reportes K P I.");
                            setModal({ isOpen: true, title: '📊 ELABORACIÓN DE KPIs', message: 'Hora de reportes.', type: 'error' });
                        } else if ((h === 12 && m === 5) || (h === 0 && m === 5)) {
                            speak("Atención. Actualización de captura del clima requerida.");
                            setModal({ isOpen: true, title: '🌤️ ACTUALIZAR CLIMA', message: 'Obligatorio actualizar clima.', type: 'error' });
                        }

                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current) {
                            flightsRef.current.forEach(flight => {
                                if (flight.wind < 42) {
                                    const parts = flight.time.split(':');
                                    let fh = parseInt(parts[0]);
                                    let fm = parseInt(parts[1]);
                                    let flightDate = new Date();
                                    flightDate.setHours(fh, fm, 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    
                                    if (timeStr === `${String(warn10.getHours()).padStart(2, '0')}:${String(warn10.getMinutes()).padStart(2, '0')}`) {
                                        speak(`Atención piloto. Faltan 10 minutos para el vuelo de las ${flight.time}.`);
                                    }
                                    if (timeStr === `${String(warn5.getHours()).padStart(2, '0')}:${String(warn5.getMinutes()).padStart(2, '0')}`) {
                                        speak(`Faltan 5 minutos para el despegue de las ${flight.time}. Salga a plataforma.`);
                                    }
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    setModal({ isOpen: true, title: 'Falta la Llave', message: 'Abre los ajustes (⚙️) y pega tu llave API.' });
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima y ráfagas de viento...");
                
                try {
                    const key = geminiKey.trim();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLA ESTRICTA 11:00am: Si dice 'UV' ES APTO. Regla general: Si dice 'Apto para volar' o indica 'Lluvia' (ej. Lluvia 64%), considéralo APTO PARA VOLAR y el viento es 0 (el sistema organizará el vuelo asumiendo que podría no llover). Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. Devuelve JSON con 'hourlyData' teniendo 'time' (ej. '11:00am') y 'wind' numérico." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error("Error de conexión. Verifica tu llave API en Ajustes.");

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) {
                         aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    }
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario calculado para lograr el objetivo de trece vuelos.");
                    } else {
                         throw new Error("La IA devolvió un formato incorrecto.");
                    }

                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al analizar el clima.");
                    setModal({ isOpen: true, title: 'Error de Análisis', message: error.message });
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {};
                for(let i=0; i<24; i++) windMap[i] = 0;

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dataPoint => {
                          let hourMatch = dataPoint.time.match(/(\d+):00([ap]m)/i);
                          if (hourMatch) {
                               let hour = parseInt(hourMatch[1]);
                               let ampm = hourMatch[2].toLowerCase();
                               if (ampm === 'pm' && hour < 12) hour += 12;
                               if (ampm === 'am' && hour === 12) hour = 0;
                               windMap[hour] = dataPoint.wind;
                          }
                     });
                }

                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    let variance = Math.floor(Math.random() * 31) - 15; 
                    let date = new Date(2026, 0, 1, h, m + variance);
                    let newH = String(date.getHours()).padStart(2, '0');
                    let newM = String(date.getMinutes()).padStart(2, '0');
                    return `${newH}:${newM}`;
                };

                // META ESTRICTA 13 VUELOS DIARIOS
                let baseTimes = [
                    "07:20", "08:35", "09:50", "11:05", "12:20", "13:35", 
                    "14:50", "16:05", "17:20", "18:35", "19:50", "21:05", "22:20"
                ];
                
                let newSchedule = baseTimes.map((timeStr, index) => {
                    let isForzoso = (index === 0 || index === 8 || index === 11);
                    let finalTime = applyVariance(timeStr, isForzoso);
                    let hour24 = parseInt(finalTime.split(':')[0]);
                    
                    return {
                        time: finalTime,
                        type: isForzoso ? "FORZOSO" : "DINÁMICO",
                        wind: windMap[hour24] >= 40 ? 45 : (windMap[hour24] || 0),
                        hour24: hour24
                    };
                });

                db.collection('operaciones').doc('turno_actual').set({ flights: newSchedule }, { merge: true });
            };

            const toggleRainProtocol = () => {
                const newState = !isRaining;
                db.collection('operaciones').doc('turno_actual').set({ isRaining: newState }, { merge: true });

                if (newState) {
                    speak("Alerta. Operaciones suspendidas por lluvia local.");
                } else {
                    speak("Lluvia finalizada. Calculando itinerario para recuperar vuelos perdidos.");
                    recalculateAfterRain();
                }
            };

            const recalculateAfterRain = () => {
                const currentHour = currentTime.getHours();
                const currentMinute = currentTime.getMinutes();
                const remaining = totalFlightsTarget - loggedFlightsCountRef.current;

                if (remaining <= 0) {
                    speak("Meta alcanzada. No se requieren vuelos adicionales hoy.");
                    return;
                }

                const endTime = 23 * 60 + 30; // 23:30 límite
                const currentTimeInMins = currentHour * 60 + currentMinute + 15; // 15 mins margen
                const timeWindow = endTime - currentTimeInMins;
                
                if (timeWindow <= 0) {
                    speak("Fuera de horario operativo. No es posible reprogramar.");
                    return;
                }

                const interval = Math.floor(timeWindow / remaining);
                let newSchedule = [];
                let currentSlot = currentTimeInMins;

                for (let i = 0; i < remaining; i++) {
                    let h = Math.floor(currentSlot / 60);
                    let m = Math.floor(currentSlot % 60);
                    let timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                    let windAtHour = windDataMap[h] || 0;

                    newSchedule.push({
                        time: timeStr,
                        type: "REPROGRAMADO",
                        wind: windAtHour >= 40 ? 45 : windAtHour,
                        hour24: h
                    });
                    currentSlot += interval;
                }
                
                db.collection('operaciones').doc('turno_actual').set({ flights: newSchedule }, { merge: true });
            };

            const handleLogManualFlight = () => {
                 if (isRaining) {
                     setModal({ isOpen: true, title: 'Bloqueo por Lluvia', message: 'No puedes registrar despegues durante lluvia.', type: 'error' });
                     return;
                 }
                 if (loggedFlightsCount < totalFlightsTarget) {
                      const newCount = loggedFlightsCount + 1;
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                      speak(`Vuelo registrado. Total del día, ${newCount} de 13.`);
                 } else {
                      speak("Meta diaria de vuelos completada.");
                 }
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanningCSV(true);
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const lines = text.split(/\r?\n/);
                        const newOperators = [];
                        
                        const firstLine = lines[0] || '';
                        const delimiter = firstLine.includes(';') ? ';' : (firstLine.includes('\t') ? '\t' : ',');
                        
                        // Expresión regular ultra flexible para atrapar CUALQUIER formato de fecha de Excel/Zoho
                        const anyDateRegex = /\b\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\b|\b\d{1,2}[\s\-\/]*(?:de\s*)?(?:ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic|jan|apr|aug|dec)[a-z]*[\.\s\-\/]*(?:\d{2,4})?\b/i;

                        for (let i = 0; i < lines.length; i++) {
                            let line = lines[i].trim();
                            if (!line) continue;
                            
                            const parts = line.split(delimiter).map(p => p.replace(/['"]/g, '').trim());
                            let rowDateStr = '';

                            parts.forEach(part => {
                                const lowerPart = part.toLowerCase();
                                if (anyDateRegex.test(lowerPart)) {
                                    rowDateStr = lowerPart;
                                }
                            });

                            if (!rowDateStr) continue; 
                            
                            const timeRegex = /([01]?[0-9]|2[0-3]):([0-5][0-9])/;
                            let times = [];
                            let possibleNames = [];

                            parts.forEach(part => {
                                const match = part.match(timeRegex);
                                if (match) {
                                    times.push(match[0]);
                                } else if (isNaN(part) && part.length > 2) {
                                    const lower = part.toLowerCase();
                                    const isRoleOrHeader = ['especialista', 'rpas', 'os', 'nombre', 'hora', 'fecha', 'puesto', 'cargo', 'rol', 'turno', 'supervisor'].some(word => lower.includes(word));
                                    
                                    if (!isRoleOrHeader && !anyDateRegex.test(lower)) {
                                        possibleNames.push(part);
                                    }
                                }
                            });
                            
                            let potentialName = possibleNames.length > 0 ? possibleNames[0] : '';

                            if (times.length >= 2 && potentialName) {
                                newOperators.push({ 
                                    name: potentialName, 
                                    start: times[0], 
                                    end: times[1],
                                    dateStr: rowDateStr 
                                });
                            }
                        }
                        
                        if (newOperators.length > 0) {
                            db.collection('operaciones').doc('turno_actual').set({ operators: newOperators }, { merge: true });
                            speak("Horarios del mes actualizados exitosamente en la base de datos.");
                            setModal({ isOpen: true, title: 'Carga Mensual Exitosa', message: `Se importaron ${newOperators.length} turnos en total. El sistema mostrará cada día solo a los que correspondan.`, type: 'success' });
                        } else {
                            throw new Error("No pude detectar fechas y horarios útiles. Revisa el archivo.");
                        }
                    } catch (error) {
                        speak("Error al procesar el archivo CSV.");
                        setModal({ isOpen: true, title: 'Error de Lectura', message: error.message, type: 'error' });
                    } finally {
                        setIsScanningCSV(false);
                        document.getElementById('csv-upload').value = '';
                    }
                };
                
                reader.readAsText(file);
            };

            const handleRemoveOperator = (index, isTodayList = false) => {
                let originalIndex = index;
                
                if (isTodayList) {
                    const todaysOps = operators.filter(op => !op.dateStr || isStringToday(op.dateStr));
                    const opToDelete = todaysOps[index];
                    originalIndex = operators.findIndex(op => op === opToDelete);
                }

                if (originalIndex >= 0) {
                    const updatedOps = operators.filter((_, i) => i !== originalIndex);
                    db.collection('operaciones').doc('turno_actual').set({ operators: updatedOps }, { merge: true });
                }
            };

            // Filtrar operadores del panel para mostrar SOLO LOS DE HOY
            const todaysOperators = operators.filter(op => {
                if(!op.dateStr) return true;
                return isStringToday(op.dateStr);
            });

            return (
                <div className="min-h-screen p-4 max-w-2xl mx-auto pb-24" onClick={unlockAudio}>
                    
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg md:text-xl font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-indigo-400 mt-1 tracking-widest uppercase">V42 MASTER • 🟢 NUBE COMPAT</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }}
                                className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition"
                                title="Panel de Administración"
                            >
                                👨‍💼
                            </button>
                            <button 
                                onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }}
                                className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition"
                            >
                                ⚙️
                            </button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse shadow-md">
                            🔇 Toca la pantalla para activar el Asistente de Voz y Alertas
                        </div>
                    )}

                    <div className="glass-card p-5 rounded-2xl mb-5 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-2xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-3xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-3 inline-flex items-center gap-1.5 bg-indigo-900/40 text-indigo-200 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs font-bold shadow-inner">
                                    <span className="text-indigo-400">👨‍✈️ OP:</span> {currentOperator}
                                </div>
                            </div>

                            <div className="text-right flex flex-col items-end">
                                <div className={`mb-3 px-4 py-2 rounded-xl border shadow-[0_0_20px_rgba(0,0,0,0.4)] transition-all ${shiftName === 'Turno Diurno' ? 'bg-amber-500/20 border-amber-500/50' : 'bg-fuchsia-600/20 border-fuchsia-500/50'}`}>
                                    <p className={`text-[10px] font-black uppercase tracking-widest ${shiftName === 'Turno Diurno' ? 'text-amber-400' : 'text-fuchsia-400'}`}>
                                        {shiftName === 'Turno Diurno' ? '🎯 Faltan (Diurno)' : '🔄 Heredados (Noct.)'}
                                    </p>
                                    <div className="text-2xl font-black text-white drop-shadow-md text-right mt-0.5">
                                        {shiftName === 'Turno Diurno' ? Math.max(0, 7 - loggedFlightsCount) : Math.max(0, 13 - loggedFlightsCount)}
                                        <span className="text-sm font-bold text-white/60 ml-1.5 uppercase tracking-wider">vuelos</span>
                                    </div>
                                </div>
                                
                                <div className="flex items-baseline gap-1 bg-[#0f172a] px-4 py-2.5 rounded-xl border border-indigo-500/30 shadow-[0_0_20px_rgba(79,70,229,0.3)] mt-1">
                                    <span className="text-5xl font-black text-white tracking-tighter drop-shadow-lg">{loggedFlightsCount}</span>
                                    <span className="text-2xl font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                                <p className="text-[11px] text-indigo-300 font-black uppercase tracking-widest mt-2">📍 Avance Global</p>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button 
                                onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }}
                                disabled={isScanning || isRaining}
                                className={`w-full py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : isRaining ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}
                            >
                                {isScanning ? '⏳ Analizando...' : '📸 ESCANEAR CLIMA'}
                            </button>
                            
                            <button 
                                onClick={(e) => { e.stopPropagation(); toggleRainProtocol(); }}
                                className={`w-full py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 ${isRaining ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-rose-900/40 hover:bg-rose-900/60 text-rose-400 border border-rose-900'}`}
                            >
                                {isRaining ? '☀️ REANUDAR' : '🌧️ DECLARAR LLUVIA'}
                            </button>
                        </div>
                    </div>

                    {isRaining && (
                        <div className="bg-rose-600 text-white text-center p-3 rounded-xl mb-5 font-black uppercase tracking-wider text-sm shadow-[0_0_20px_rgba(225,29,72,0.5)] animate-pulse">
                            ⚠️ OPERACIONES SUSPENDIDAS POR LLUVIA ⚠️
                        </div>
                    )}

                    {}
                    <div className={`glass-card p-5 rounded-2xl mb-6 relative ${isRaining ? 'opacity-50 pointer-events-none' : ''}`}>
                        {isRaining && <div className="absolute inset-0 rain-overlay rounded-2xl z-10 flex items-center justify-center text-center p-4">
                            <span className="text-white font-bold text-lg">Esperando que mejore el clima para calcular itinerario de {totalFlightsTarget - loggedFlightsCount} vuelos faltantes...</span>
                        </div>}

                        <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-3">🗓️ Plan Restante (Calculado)</p>
                        
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">
                                Sube una captura para generar el itinerario de vuelos.
                            </div>
                        ) : (
                            <div className="space-y-2.5">
                                {flights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-3 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50 opacity-75' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-lg font-black text-white tracking-wide">{f.time}</div>
                                            <div className={`text-[10px] font-bold mt-0.5 uppercase tracking-wider flex items-center gap-1 ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                {f.wind >= 42 ? `🚫 Suspendido (${f.wind} km/h)` : `✅ Libre (${f.wind} km/h)`}
                                            </div>
                                        </div>
                                        <span className={`text-[9px] font-black uppercase px-2.5 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : f.type === 'REPROGRAMADO' ? 'bg-amber-950 text-amber-500 border-amber-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[#0B0F19] via-[#0B0F19] to-transparent flex justify-center z-40 pointer-events-none">
                         <button 
                             onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }}
                             disabled={isRaining}
                             className={`pointer-events-auto w-full max-w-xs font-black py-3.5 rounded-xl transition transform hover:scale-105 ${isRaining ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]'}`}
                         >
                             ✈️ REGISTRAR DESPEGUE AHORA
                         </button>
                    </div>

                    {}
                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6">
                                <h2 className="text-lg font-black text-white mb-4">⚙️ Ajustes</h2>
                                
                                <div className="mb-5">
                                    <label className="block text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">
                                        Llave Gemini API
                                    </label>
                                    <input 
                                        type="password" 
                                        value={geminiKey} 
                                        onChange={e => setGeminiKey(e.target.value)}
                                        placeholder="AQ. o AIzaSy..."
                                        className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 outline-none transition font-mono text-xs"
                                    />
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs border border-slate-700">Cerrar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); setSettingsOpen(false); speak("Llave guardada exitosamente."); }} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6 max-h-[90vh] flex flex-col">
                                <div>
                                    <h2 className="text-lg font-black text-white mb-1 flex items-center gap-2">👨‍💼 Administración</h2>
                                    <p className="text-xs text-slate-400 mb-5">Gestión de Horarios de Operadores</p>
                                    
                                    <div className="bg-[#0f172a] p-4 rounded-xl border border-indigo-500/40 mb-4 shadow-[0_0_15px_rgba(79,70,229,0.1)]">
                                        <h3 className="text-xs font-bold text-indigo-300 uppercase tracking-widest mb-3 flex items-center gap-2">
                                            📊 Carga del Mes Completo (CSV)
                                        </h3>
                                        <input type="file" id="csv-upload" accept=".csv" className="hidden" onChange={handleCSVUpload} />
                                        <button 
                                            onClick={() => document.getElementById('csv-upload').click()}
                                            disabled={isScanningCSV}
                                            className={`w-full py-2.5 rounded-lg text-sm font-bold transition flex justify-center items-center gap-2 ${isScanningCSV ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'}`}
                                        >
                                            {isScanningCSV ? '⏳ Procesando...' : '📄 Subir Horario (.CSV)'}
                                        </button>
                                        <p className="text-[9px] text-slate-400 mt-2 text-center">Sube el mes entero. El sistema guardará todo<br/>pero solo mostrará los turnos del día actual.</p>
                                    </div>

                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-widest">Turnos filtrados (Solo de hoy)</h3>
                                        <span className="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">Total en BD: {operators.length}</span>
                                    </div>
                                </div>

                                <div className="overflow-y-auto flex-1 mb-4 bg-[#0f172a] p-3 rounded-xl border border-slate-800 min-h-[150px]">
                                    {todaysOperators.length === 0 ? (
                                        <p className="text-xs text-slate-500 text-center py-6">No hay turnos programados para el día de hoy.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {todaysOperators.map((op, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-[#1e293b] p-3 rounded-lg border border-slate-700">
                                                    <div>
                                                        <p className="font-bold text-sm text-white">{op.name}</p>
                                                        <p className="text-[10px] text-slate-400">{op.start} hrs - {op.end} hrs</p>
                                                    </div>
                                                    <button onClick={() => handleRemoveOperator(idx, true)} className="bg-rose-900/50 hover:bg-rose-900 text-rose-400 px-3 py-1.5 rounded-lg transition text-xs font-bold">
                                                        Eliminar
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg text-sm transition mt-auto">
                                    Cerrar Panel
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6">
                                <h2 className="text-lg font-black text-white mb-2">{modal.title}</h2>
                                <p className="text-slate-300 text-sm mb-6">{modal.message}</p>
                                <button onClick={() => setModal({ ...modal, isOpen: false })} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-xs">
                                    Entendido
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
