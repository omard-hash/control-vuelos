<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V42 Master</title>
    
    <!-- Librerías de React y Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lector de Excel / CSV (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- FIREBASE COMPAT (Conexión Original V10 para mantener permisos) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .rain-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%); backdrop-filter: blur(8px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useRef } = React;

        function App() {
            // Estados principales de la UI
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            // Estados Operativos
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const totalFlightsTarget = 13;
            const [isRaining, setIsRaining] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});

            // Estados de Audio
            const [audioUnlocked, setAudioUnlocked] = useState(false);
            const audioUnlockedRef = useRef(false);
            
            // Estados para Administración del Mes
            const [adminOpen, setAdminOpen] = useState(false);
            const [allMonthShifts, setAllMonthShifts] = useState([]);
            const [currentOperator, setCurrentOperator] = useState('Sin asignar');
            const [isUploading, setIsUploading] = useState(false);
            
            // Referencias
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const allMonthShiftsRef = useRef([]);
            const loggedFlightsCountRef = useRef(0);
            const authReady = useRef(false);

            useEffect(() => {
                let unsubscribeTurno = () => {};
                let unsubscribeMes = () => {};

                auth.signInAnonymously().then(() => {
                    authReady.current = true;
                    
                    // 1. Escuchar turno actual
                    unsubscribeTurno = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            }
                            if (data.loggedFlightsCount !== undefined) {
                                setLoggedFlightsCount(data.loggedFlightsCount);
                                loggedFlightsCountRef.current = data.loggedFlightsCount;
                            }
                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            if (data.windDataMap) setWindDataMap(data.windDataMap);
                        }
                    }, (err) => console.error("Error leyendo turno:", err));

                    // 2. Escuchar TODO el mes de la nube
                    unsubscribeMes = db.collection('operaciones').doc('turnos_mes').onSnapshot((doc) => {
                        if (doc.exists && doc.data().turnos) {
                            setAllMonthShifts(doc.data().turnos);
                            allMonthShiftsRef.current = doc.data().turnos;
                        } else {
                            setAllMonthShifts([]);
                            allMonthShiftsRef.current = [];
                        }
                    }, (err) => console.error("Error leyendo mes:", err));

                }).catch((error) => console.error("Error Auth:", error));

                return () => { unsubscribeTurno(); unsubscribeMes(); };
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema activado.");
                    u.lang = 'es-MX';
                    u.volume = 0.1;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();

                    if (h >= 7 && h < 19) setShiftName('Turno Diurno');
                    else setShiftName('Turno Nocturno');

                    // ==========================================
                    // MOTOR INTELIGENTE: ASIGNAR OPERADOR ACTUAL
                    // ==========================================
                    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                    const currentMins = h * 60 + m;
                    
                    const shiftsToday = allMonthShiftsRef.current.filter(shift => shift.date === todayStr);
                    let foundOp = 'Sin asignar';

                    if (shiftsToday.length > 0) {
                        for (let shift of shiftsToday) {
                            let startParts = shift.start.split(':');
                            let endParts = shift.end.split(':');
                            let startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                            let endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

                            if (startMins <= endMins) {
                                // Turno normal de día
                                if (currentMins >= startMins && currentMins < endMins) foundOp = shift.name;
                            } else {
                                // Turno cruzado (ej. 18:50 a 07:00 del día siguiente)
                                if (currentMins >= startMins || currentMins < endMins) foundOp = shift.name;
                            }
                        }
                    }
                    
                    setCurrentOperator(prevOp => prevOp !== foundOp ? foundOp : prevOp);

                    // ==========================================
                    // CORTE DE CAJA (12:00 AM)
                    // ==========================================
                    if (h === 0 && m === 0 && s === 0 && authReady.current) {
                        speak("Iniciando nuevo día de operaciones. Reiniciando contadores.");
                        db.collection('operaciones').doc('turno_actual').set({
                            flights: [],
                            loggedFlightsCount: 0,
                            isRaining: false,
                            windDataMap: {}
                        });
                    }
                    
                    // ==========================================
                    // ALARMAS Y AVISOS DE VUELO
                    // ==========================================
                    if (s === 0) {
                        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        
                        if (h === 7 && m === 50) speak("Junta operativa en diez minutos.");
                        else if (h === 12 && m === 0) speak("Hora de elaborar los reportes K P I.");
                        else if ((h === 12 && m === 5) || (h === 0 && m === 5)) speak("Actualización de captura del clima requerida.");

                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current) {
                            flightsRef.current.forEach(flight => {
                                if (flight.wind < 42) {
                                    const parts = flight.time.split(':');
                                    let flightDate = new Date();
                                    flightDate.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    
                                    let w10Str = `${String(warn10.getHours()).padStart(2, '0')}:${String(warn10.getMinutes()).padStart(2, '0')}`;
                                    let w5Str = `${String(warn5.getHours()).padStart(2, '0')}:${String(warn5.getMinutes()).padStart(2, '0')}`;
                                    
                                    if (timeStr === w10Str) speak(`10 minutos para el vuelo de las ${flight.time}.`);
                                    if (timeStr === w5Str) speak(`5 minutos para despegue. Salga a plataforma.`);
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsUploading(true);
                const reader = new FileReader();

                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        
                        let turnosExtraidos = [];
                        let defaultMonth = new Date().getMonth() + 1;
                        let defaultYear = new Date().getFullYear();

                        // 1. Extraer Mes y Año globales del documento por si las dudas
                        const fullText = json.map(row => row.join(' ')).join(' ');
                        const dateRegex = /(?:(\d{2})[\/\-])?(\d{2})[\/\-](\d{4})/;
                        const dateMatch = fullText.match(dateRegex);
                        if (dateMatch) {
                            defaultMonth = parseInt(dateMatch[2]);
                            defaultYear = parseInt(dateMatch[3]);
                        }

                        // 2. MODO TERMINATOR: Analizar cada celda del archivo buscando horarios
                        for (let r = 0; r < json.length; r++) {
                            let row = json[r];
                            if (!row) continue;

                            for (let c = 0; c < row.length; c++) {
                                let cellValue = row[c];
                                if (!cellValue) continue;
                                let cellText = String(cellValue).trim();

                                // Expresión regular Súper Amplia: Encuentra "06:50 - 19:00" o "6:50 a 19:00"
                                let timeMatch = cellText.match(/(\d{1,2}:\d{2})\s*[-aA]\s*(\d{1,2}:\d{2})/);

                                if (timeMatch) {
                                    let start = timeMatch[1];
                                    let end = timeMatch[2];

                                    // ===== EXTRAER EL NOMBRE =====
                                    // Limpiar la hora de la celda para ver qué queda
                                    let rawName = cellText.replace(timeMatch[0], '').trim();
                                    
                                    // Si todo estaba pegado en la misma celda con saltos de línea (típico CSV de Zoho)
                                    let lines = rawName.split(/\r?\n/);
                                    rawName = lines[0].trim(); // Tomar primera linea restante

                                    // Si no hay nombre útil, buscar en las celdas de abajo o de la izquierda
                                    if (!rawName || rawName.match(/Especialista|Audi|OS/i) || rawName.length < 3) {
                                        let foundName = "";
                                        // Buscar abajo hasta 2 filas
                                        for(let i=1; i<=2; i++) {
                                            if (json[r+i] && json[r+i][c]) {
                                                let downText = String(json[r+i][c]).trim();
                                                // Que sea largo, no sea una hora, no sea "Especialista"
                                                if (downText.length > 2 && !downText.match(/\d{2}:\d{2}/) && !downText.match(/Especialista|Audi|OS/i)) {
                                                    foundName = downText; 
                                                    break;
                                                }
                                            }
                                        }
                                        // Si no, buscar izquierda
                                        if(!foundName && c > 0 && json[r][c-1]) {
                                             let leftText = String(json[r][c-1]).trim();
                                             if (leftText.length > 2 && !leftText.match(/\d{2}:\d{2}/) && !leftText.match(/Especialista|Audi|OS/i)) {
                                                 foundName = leftText;
                                             }
                                        }
                                        rawName = foundName;
                                    }

                                    // Super Filtro de Limpieza
                                    let cleanName = rawName
                                        .replace(/Especialista.*/gi, '')
                                        .replace(/Audi.*/gi, '')
                                        .replace(/RPAS.*/gi, '')
                                        .replace(/OS/gi, '')
                                        .replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '') // Quitar números y basuritas
                                        .trim();

                                    // Dejar máximo Nombre y Primer Apellido
                                    let nameParts = cleanName.split(/\s+/).filter(p => p.length > 2);
                                    cleanName = nameParts.slice(0, 2).join(' ') || "Operador";

                                    // ===== EXTRAER LA FECHA =====
                                    let day = null;
                                    
                                    // 1. Mirar hacia ARRIBA en la columna (Modo Calendario)
                                    for (let lookUpRow = r - 1; lookUpRow >= 0; lookUpRow--) {
                                        let upCell = json[lookUpRow] ? json[lookUpRow][c] : null;
                                        if (upCell) {
                                            let upText = String(upCell).trim();
                                            // Match exacto "27"
                                            if (/^\s*0?[1-9]|[12]\d|3[01]\s*$/.test(upText)) { 
                                                day = parseInt(upText); break; 
                                            }
                                            // Match corto "Mon 27" o "27 Lun"
                                            let textMatch = upText.match(/[^\d]*([1-9]|[12]\d|3[01])\b/);
                                            if (textMatch && upText.length < 15) { 
                                                day = parseInt(textMatch[1]); break; 
                                            }
                                            // Match Completo "27/07/2026"
                                            let fullDateMatch = upText.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
                                            if (fullDateMatch) { 
                                                day = parseInt(fullDateMatch[1]); 
                                                defaultMonth = parseInt(fullDateMatch[2]); 
                                                defaultYear = parseInt(fullDateMatch[3]); 
                                                break; 
                                            }
                                        }
                                    }

                                    // 2. Si falló arriba, buscar en la MISMA fila (Modo Lista CSV)
                                    if (!day) {
                                        let rowStr = row.join(' '); // Unir toda la fila en texto
                                        let fullDateMatch = rowStr.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
                                        if (fullDateMatch) {
                                            day = parseInt(fullDateMatch[1]);
                                            defaultMonth = parseInt(fullDateMatch[2]);
                                            defaultYear = parseInt(fullDateMatch[3]);
                                        }
                                    }

                                    // 3. Guardar el turno si encontramos una fecha (día)
                                    if (day) {
                                        let dateStr = `${defaultYear}-${String(defaultMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                        turnosExtraidos.push({ date: dateStr, name: cleanName, start: start, end: end });
                                    }
                                }
                            }
                        }

                        // Filtrar duplicados (Si Zoho fusionó celdas, a veces un turno se lee 2 veces)
                        const uniqueTurnos = [];
                        const seen = new Set();
                        turnosExtraidos.forEach(t => {
                            const id = `${t.date}-${t.name}-${t.start}`;
                            if(!seen.has(id)) {
                                seen.add(id);
                                uniqueTurnos.push(t);
                            }
                        });

                        // Resultado Final
                        if (uniqueTurnos.length > 0) {
                            db.collection('operaciones').doc('turnos_mes').set({ turnos: uniqueTurnos });
                            speak(`Carga de ${uniqueTurnos.length} turnos exitosa.`);
                            setModal({ isOpen: true, title: '✅ Carga Exitosa', message: `El escáner profundo encontró ${uniqueTurnos.length} turnos para este mes.\n\nEl sistema cambiará al operador correspondiente automáticamente.`, type: 'success' });
                        } else {
                            speak("El sistema no logró encontrar turnos.");
                            setModal({ isOpen: true, title: 'Archivo Vacío', message: 'El escáner leyó el archivo pero no pudo encontrar patrones de Hora (ej. 07:00 - 15:00) y Fechas juntos. Revisa tu exportación.', type: 'error' });
                        }

                    } catch (error) {
                        console.error("Error parseando Excel/CSV:", error);
                        setModal({ isOpen: true, title: 'Error Crítico', message: 'El archivo está corrupto o protegido.', type: 'error' });
                    } finally {
                        setIsUploading(false);
                        e.target.value = null; // Reset input
                    }
                };
                
                reader.readAsBinaryString(file);
            };

            const clearDB = () => {
                db.collection('operaciones').doc('turnos_mes').set({ turnos: [] });
                speak("Base de datos de horarios limpiada.");
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    setModal({ isOpen: true, title: 'Falta la Llave', message: 'Abre los ajustes (⚙️) y pega tu llave API.' });
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando clima...");
                
                try {
                    const key = geminiKey.trim();
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLA ESTRICTA 11:00am: Si solo dice 'UV' (ej. 'UV 10', 'Extremo UV 13') ES APTO PARA VOLAR, viento 0. Regla general: Si dice 'Apto para volar', viento 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento 45. Si dice 'Lluvia 64%' o similar, trátalo como viento 0. Devuelve JSON con 'hourlyData' teniendo 'time' (ej. '11:00am') y 'wind' numérico." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error("Error de conexión API.");

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario de trece vuelos generado.");
                    } else throw new Error("Formato incorrecto devuelto por IA.");

                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al analizar el clima.");
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {};
                for(let i=0; i<24; i++) windMap[i] = 0;

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dataPoint => {
                          let hourMatch = dataPoint.time.match(/(\d+):00([ap]m)/i);
                          if (hourMatch) {
                               let hour = parseInt(hourMatch[1]);
                               let ampm = hourMatch[2].toLowerCase();
                               if (ampm === 'pm' && hour < 12) hour += 12;
                               if (ampm === 'am' && hour === 12) hour = 0;
                               windMap[hour] = dataPoint.wind;
                          }
                     });
                }
                
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    let parts = timeStr.split(':');
                    let variance = Math.floor(Math.random() * 31) - 15; 
                    let date = new Date(2026, 0, 1, parseInt(parts[0]), parseInt(parts[1]) + variance);
                    return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                };

                let newSchedule = [];
                const isSuspendedAt11 = windMap[11] >= 40;
                const isSuspendedAt12 = windMap[12] >= 40 && !isSuspendedAt11;
                const isSuspendedAt13 = windMap[13] >= 40 && !isSuspendedAt11 && !isSuspendedAt12;

                if (isSuspendedAt11) {
                    newSchedule.push({ time: applyVariance("06:15"), type: "DINÁMICO", wind: windMap[6] || 0, hour24: 6 }, { time: applyVariance("07:20", true), type: "FORZOSO", wind: windMap[7] || 0, hour24: 7 }, { time: applyVariance("08:30"), type: "DINÁMICO", wind: windMap[8] || 0, hour24: 8 }, { time: applyVariance("09:45"), type: "DINÁMICO", wind: windMap[9] || 0, hour24: 9 });
                } else if (isSuspendedAt12) {
                    newSchedule.push({ time: applyVariance("07:20", true), type: "FORZOSO", wind: windMap[7] || 0, hour24: 7 }, { time: applyVariance("08:20"), type: "DINÁMICO", wind: windMap[8] || 0, hour24: 8 }, { time: applyVariance("09:20"), type: "DINÁMICO", wind: windMap[9] || 0, hour24: 9 }, { time: applyVariance("10:20"), type: "DINÁMICO", wind: windMap[10] || 0, hour24: 10 }, { time: applyVariance("11:20"), type: "DINÁMICO", wind: windMap[11] || 0, hour24: 11 });
                } else if (isSuspendedAt13) {
                    newSchedule.push({ time: applyVariance("07:20", true), type: "FORZOSO", wind: windMap[7] || 0, hour24: 7 }, { time: applyVariance("08:35"), type: "DINÁMICO", wind: windMap[8] || 0, hour24: 8 }, { time: applyVariance("09:50"), type: "DINÁMICO", wind: windMap[9] || 0, hour24: 9 }, { time: applyVariance("11:00"), type: "DINÁMICO", wind: windMap[11] || 0, hour24: 11 }, { time: applyVariance("12:15"), type: "DINÁMICO", wind: windMap[12] || 0, hour24: 12 });
                } else {
                    newSchedule.push({ time: applyVariance("07:20", true), type: "FORZOSO", wind: windMap[7] || 0, hour24: 7 }, { time: applyVariance("08:40"), type: "DINÁMICO", wind: windMap[8] || 0, hour24: 8 }, { time: applyVariance("10:00"), type: "DINÁMICO", wind: windMap[10] || 0, hour24: 10 }, { time: applyVariance("11:30"), type: "DINÁMICO", wind: windMap[11] || 0, hour24: 11 }, { time: applyVariance("12:45"), type: "DINÁMICO", wind: windMap[12] || 0, hour24: 12 });
                }

                newSchedule.push({ time: applyVariance("14:00", true), type: "FORZOSO", wind: windMap[14] || 0, hour24: 14 }, { time: applyVariance("15:30"), type: "DINÁMICO", wind: windMap[15] || 0, hour24: 15 }, { time: applyVariance("17:00", true), type: "FORZOSO", wind: windMap[17] || 0, hour24: 17 }, { time: applyVariance("18:30"), type: "DINÁMICO", wind: windMap[18] || 0, hour24: 18 }, { time: applyVariance("20:00"), type: "DINÁMICO", wind: windMap[20] || 0, hour24: 20 }, { time: applyVariance("21:30", true), type: "FORZOSO", wind: windMap[21] || 0, hour24: 21 }, { time: applyVariance("22:45"), type: "DINÁMICO", wind: windMap[22] || 0, hour24: 22 });
                
                const finalSchedule = newSchedule.map(f => ({ ...f, wind: windMap[f.hour24] >= 40 ? 45 : f.wind }));
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const toggleRainProtocol = () => {
                const newState = !isRaining;
                db.collection('operaciones').doc('turno_actual').set({ isRaining: newState }, { merge: true });
                if (newState) speak("Operaciones suspendidas por lluvia local."); 
                else { speak("Lluvia finalizada. Reprogramando vuelos."); recalculateAfterRain(); }
            };

            const recalculateAfterRain = () => {
                const remaining = totalFlightsTarget - loggedFlightsCountRef.current;
                if (remaining <= 0) return;
                
                const currentSlot = currentTime.getHours() * 60 + currentTime.getMinutes() + 15; 
                const timeWindow = (23 * 60 + 30) - currentSlot; 
                if (timeWindow <= 0) return;

                const interval = Math.floor(timeWindow / remaining);
                let newSchedule = [];
                let slot = currentSlot;

                for (let i = 0; i < remaining; i++) {
                    let h = Math.floor(slot / 60);
                    let m = Math.floor(slot % 60);
                    newSchedule.push({ time: `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`, type: "REPROGRAMADO", wind: windDataMap[h] || 0, hour24: h });
                    slot += interval;
                }
                db.collection('operaciones').doc('turno_actual').set({ flights: newSchedule }, { merge: true });
            };

            const handleLogManualFlight = () => {
                 if (isRaining) return setModal({ isOpen: true, title: 'Lluvia', message: 'No puedes registrar despegues en lluvia.', type: 'error' });
                 if (loggedFlightsCount < totalFlightsTarget) {
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: loggedFlightsCount + 1 }, { merge: true });
                 }
            };

            // Filtrado de visualización en panel admin
            const todayStrUI = `${currentTime.getFullYear()}-${String(currentTime.getMonth() + 1).padStart(2, '0')}-${String(currentTime.getDate()).padStart(2, '0')}`;
            const todayShiftsUI = allMonthShifts.filter(s => s.date === todayStrUI);

            return (
                <div className="min-h-screen p-4 max-w-2xl mx-auto pb-24" onClick={unlockAudio}>
                    
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg md:text-xl font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-emerald-400 mt-1 tracking-widest uppercase">V42 MASTER • 🟢 AUTO ZOHO CSV</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition" title="Administración">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse shadow-md">
                            🔇 Toca la pantalla para activar el Asistente de Voz
                        </div>
                    )}

                    <div className="glass-card p-5 rounded-2xl mb-5 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-2xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-3xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-3 inline-flex items-center gap-1.5 bg-indigo-900/40 text-indigo-200 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs font-bold shadow-inner">
                                    <span className="text-indigo-400">👨‍✈️ OP:</span> {currentOperator}
                                </div>
                            </div>

                            <div className="text-right flex flex-col items-end">
                                <div className={`mb-3 px-4 py-2 rounded-xl border shadow-[0_0_20px_rgba(0,0,0,0.4)] transition-all ${shiftName === 'Turno Diurno' ? 'bg-amber-500/20 border-amber-500/50' : 'bg-fuchsia-600/20 border-fuchsia-500/50'}`}>
                                    <p className={`text-[10px] font-black uppercase tracking-widest ${shiftName === 'Turno Diurno' ? 'text-amber-400' : 'text-fuchsia-400'}`}>
                                        🎯 {shiftName === 'Turno Diurno' ? 'Faltan (Diurno)' : 'Heredados'}
                                    </p>
                                    <div className="text-2xl font-black text-white drop-shadow-md text-right mt-0.5">
                                        {shiftName === 'Turno Diurno' ? Math.max(0, 7 - loggedFlightsCount) : Math.max(0, 13 - loggedFlightsCount)}
                                        <span className="text-sm font-bold text-white/60 ml-1.5 uppercase tracking-wider">vuelos</span>
                                    </div>
                                </div>
                                
                                <div className="flex items-baseline gap-1 bg-[#0f172a] px-4 py-2.5 rounded-xl border border-indigo-500/30 shadow-[0_0_20px_rgba(79,70,229,0.3)] mt-1">
                                    <span className="text-5xl font-black text-white tracking-tighter drop-shadow-lg">{loggedFlightsCount}</span>
                                    <span className="text-2xl font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <input type="file" id="uploadWeather" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button onClick={(e) => { e.stopPropagation(); document.getElementById('uploadWeather').click(); }} disabled={isScanning || isRaining} className={`w-full py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : isRaining ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}>
                                {isScanning ? '⏳ Analizando...' : '📸 ESCANEAR CLIMA'}
                            </button>
                            <button onClick={(e) => { e.stopPropagation(); toggleRainProtocol(); }} className={`w-full py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 ${isRaining ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-rose-900/40 hover:bg-rose-900/60 text-rose-400 border border-rose-900'}`}>
                                {isRaining ? '☀️ REANUDAR' : '🌧️ DECLARAR LLUVIA'}
                            </button>
                        </div>
                    </div>

                    <div className={`glass-card p-5 rounded-2xl mb-6 relative ${isRaining ? 'opacity-50 pointer-events-none' : ''}`}>
                        {isRaining && <div className="absolute inset-0 rain-overlay rounded-2xl z-10 flex items-center justify-center text-center p-4">
                            <span className="text-white font-bold text-lg">Esperando que mejore el clima...</span>
                        </div>}

                        <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-3">🗓️ Plan Restante (Calculado)</p>
                        
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">
                                Sube una captura para generar el itinerario.
                            </div>
                        ) : (
                            <div className="space-y-2.5">
                                {flights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-3 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50 opacity-75' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-lg font-black text-white tracking-wide">{f.time}</div>
                                            <div className={`text-[10px] font-bold mt-0.5 uppercase tracking-wider flex items-center gap-1 ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                {f.wind >= 42 ? `🚫 Suspendido` : `✅ Libre`}
                                            </div>
                                        </div>
                                        <span className={`text-[9px] font-black uppercase px-2.5 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : f.type === 'REPROGRAMADO' ? 'bg-amber-950 text-amber-500 border-amber-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[#0B0F19] via-[#0B0F19] to-transparent flex justify-center z-40 pointer-events-none">
                         <button onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }} disabled={isRaining} className={`pointer-events-auto w-full max-w-xs font-black py-3.5 rounded-xl transition transform hover:scale-105 ${isRaining ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]'}`}>
                             ✈️ REGISTRAR DESPEGUE AHORA
                         </button>
                    </div>

                    {}
                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={() => setAdminOpen(false)}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-black text-white flex items-center gap-2">👨‍💼 Administración</h2>
                                    <button onClick={clearDB} className="text-[9px] bg-rose-900/40 text-rose-400 px-2 py-1 rounded border border-rose-900 uppercase font-bold hover:bg-rose-900/60">Limpiar Nube</button>
                                </div>
                                
                                <div className="bg-indigo-900/20 border border-indigo-500/30 p-4 rounded-xl mb-6 text-center">
                                    <h3 className="text-xs font-black tracking-widest text-indigo-400 uppercase mb-2">
                                        📅 CARGA INTELIGENTE (ZOHO CSV/XLSX)
                                    </h3>
                                    <p className="text-[10px] text-slate-400 mb-4 leading-relaxed">
                                        Sube tu archivo (incluso si se ve desordenado). El Escáner Profundo encontrará fechas, horas y limpiará los nombres automáticamente.
                                    </p>
                                    <input type="file" id="excelUpload" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" className="hidden" onChange={handleExcelUpload} />
                                    <button onClick={() => document.getElementById('excelUpload').click()} disabled={isUploading} className={`w-full font-bold py-3.5 rounded-lg text-sm shadow-[0_0_15px_rgba(79,70,229,0.3)] transition flex justify-center items-center gap-2 ${isUploading ? 'bg-indigo-800 text-indigo-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white transform hover:scale-105'}`}>
                                        {isUploading ? '⏳ Escaneando archivo...' : '📄 Subir Horario Mensual'}
                                    </button>
                                </div>

                                <div className="flex justify-between items-center mb-3">
                                    <p className="text-[10px] font-bold tracking-widest text-emerald-400 uppercase">Turnos de Hoy ({todayStrUI})</p>
                                    <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-bold border border-slate-700">Total en BD: {allMonthShifts.length}</span>
                                </div>

                                <div className="space-y-2 mb-6 max-h-48 overflow-y-auto pr-1">
                                    {todayShiftsUI.length === 0 ? (
                                        <div className="text-center py-6 bg-[#0f172a] rounded-xl border border-slate-800 text-xs text-slate-500">
                                            No hay turnos para la fecha actual.
                                        </div>
                                    ) : (
                                        todayShiftsUI.map((op, i) => (
                                            <div key={i} className="flex justify-between items-center bg-[#0f172a] p-3 rounded-lg border border-slate-800">
                                                <div>
                                                    <p className="font-bold text-white text-sm">{op.name}</p>
                                                    <p className="text-[10px] text-slate-400">{op.start} - {op.end}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl border border-slate-700 transition">
                                    Cerrar Panel
                                </button>
                            </div>
                        </div>
                    )}

                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6">
                                <h2 className="text-lg font-black text-white mb-4">⚙️ Ajustes</h2>
                                <div className="mb-5">
                                    <label className="block text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">Llave Gemini API (Para escaneo de Clima)</label>
                                    <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="AIzaSy..." className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2.5 text-white outline-none font-mono text-xs" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs border border-slate-700">Cerrar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); setSettingsOpen(false); speak("Llave guardada."); }} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6 text-center">
                                <h2 className="text-lg font-black text-white mb-2">{modal.title}</h2>
                                <p className="text-slate-300 text-sm mb-6 whitespace-pre-line">{modal.message}</p>
                                <button onClick={() => setModal({ ...modal, isOpen: false })} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg text-xs">
                                    Aceptar
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
