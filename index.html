<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V43 Final</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        if (localStorage.getItem('gemini_model') === 'gemini-1.5-pro' || localStorage.getItem('gemini_model') === 'gemini-1.5-flash') {
            localStorage.setItem('gemini_model', 'gemini-3.6-flash');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [adminOpen, setAdminOpen] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_model') || 'gemini-3.6-flash');
            const [pilotName, setPilotName] = useState(localStorage.getItem('pilot_name') || 'Piloto en Turno');
            
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const [shiftPeriod, setShiftPeriod] = useState('');
            const totalFlightsTarget = 8; // META ESTRICTA: 8 Vuelos por turno
            
            const [isRaining, setIsRaining] = useState(false);
            const [isFoggy, setIsFoggy] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});
            const [rainProbMap, setRainProbMap] = useState({});

            const [audioUnlocked, setAudioUnlocked] = useState(false);
            
            const audioUnlockedRef = useRef(false);
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const isFoggyRef = useRef(false);
            const windDataMapRef = useRef({});
            const shiftPeriodRef = useRef('');

            const applyAntiCollision = (timeMins) => {
                let time = timeMins % 1440; 
                let offset = Math.floor(timeMins / 1440) * 1440; 
                if (time >= 405 && time <= 435) time = 440; // Junta Cambio AM (06:45 - 07:15) -> 07:20
                else if (time >= 470 && time <= 495) time = 500; // Junta Shopfloor (07:50 - 08:15) -> 08:20
                else if (time >= 1125 && time <= 1155) time = 1165; // Junta Cambio PM (18:45 - 19:15) -> 19:25
                return offset + time;
            };

            useEffect(() => {
                let unsubscribe = () => {};
                firebase.auth().signInAnonymously().then(() => {
                    unsubscribe = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            }
                            if (data.loggedFlightsCount !== undefined) setLoggedFlightsCount(data.loggedFlightsCount);
                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            if (data.isFoggy !== undefined) {
                                setIsFoggy(data.isFoggy);
                                isFoggyRef.current = data.isFoggy;
                            }
                            if (data.windDataMap) {
                                setWindDataMap(data.windDataMap);
                                windDataMapRef.current = data.windDataMap;
                            }
                            if (data.rainProbMap) setRainProbMap(data.rainProbMap);
                            if (data.pilotName) {
                                setPilotName(data.pilotName);
                                localStorage.setItem('pilot_name', data.pilotName);
                            }
                            if (data.shiftPeriod) {
                                setShiftPeriod(data.shiftPeriod);
                                shiftPeriodRef.current = data.shiftPeriod;
                            }
                        }
                    }, (err) => console.error("Error leyendo datos:", err));
                }).catch((error) => console.error("Error Auth:", error));
                return () => unsubscribe();
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    utterance.volume = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema de voz en línea al máximo volumen.");
                    u.lang = 'es-MX'; 
                    u.volume = 1.0;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                    let shiftDate = new Date(now);
                    if (h < 7) { shiftDate.setDate(shiftDate.getDate() - 1); } 
                    
                    const isDayShift = (h >= 7 && h < 19);
                    const shiftType = isDayShift ? 'DIA' : 'NOCHE';
                    const currentShiftPeriod = `${shiftDate.getFullYear()}-${shiftDate.getMonth()}-${shiftDate.getDate()}-${shiftType}`;

                    if (shiftPeriodRef.current && shiftPeriodRef.current !== currentShiftPeriod) {
                        shiftPeriodRef.current = currentShiftPeriod;
                        db.collection('operaciones').doc('turno_actual').set({ 
                            loggedFlightsCount: 0,
                            shiftPeriod: currentShiftPeriod
                        }, { merge: true });
                        speak(`Atención. Cambio de turno detectado. Contador de vuelos reiniciado a cero.`);
                    } else if (!shiftPeriodRef.current) {
                         shiftPeriodRef.current = currentShiftPeriod;
                    }

                    setShiftName(isDayShift ? 'Turno Diurno' : 'Turno Nocturno');
                    
                    if (s === 0) { 
                        if ((h === 7 && m === 0) || (h === 19 && m === 0)) {
                            autoAssignPilot();
                            speak("Iniciando escaneo de plantilla de personal. Asignando nuevo piloto en turno.");
                        }

                        if (h === 7 && m === 50) speak("Atención. Inicio de junta operativa shop floor. Ventana de vuelo bloqueada hasta las 8 15.");
                        else if (h === 12 && m === 0) speak("Atención comandante. Es hora de elaborar los reportes de capé i y actualizar el clima del radar.");
                        else if (h === 0 && m === 5) speak("Alerta de protocolo. Son las 12 con 5 de la madrugada. Es obligatorio actualizar la captura de OK To Fly del radar.");

                        if (m === 0 && (isRainingRef.current || isFoggyRef.current || (windDataMapRef.current[h] >= 40))) {
                            speak("Atención piloto. Es hora de tomar evidencia fotográfica de las condiciones meteorológicas adversas.");
                        }

                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current && !isFoggyRef.current) {
                            let shouldRecalculate = false;
                            let recalcFlights = [...flightsRef.current];
                            let currentMins = h * 60 + m;
                            let adjustedCurrentMins = currentMins;
                            if (h < 7) adjustedCurrentMins += 1440;

                            recalcFlights.forEach((flight, idx) => {
                                const isFlightDay = flight.hour24 >= 7 && flight.hour24 < 19;
                                let fMins = flight.hour24 * 60 + flight.min;
                                if (flight.hour24 < 7) fMins += 1440;

                                // Alertas 10 y 5 min
                                if (isDayShift === isFlightDay && flight.wind < 42) {
                                    if (fMins - adjustedCurrentMins === 10) speak(`Atención piloto. Faltan 10 minutos para el vuelo programado a las ${flight.time}.`);
                                    if (fMins - adjustedCurrentMins === 5) speak(`Faltan 5 minutos para el despegue de las ${flight.time}. Prepárese.`);
                                }

                                // Si el vuelo se pasó por 5 minutos, activar recálculo anti-colisión
                                if (adjustedCurrentMins - fMins === 5 && flight.wind < 42) {
                                    shouldRecalculate = true;
                                }
                            });

                            if (shouldRecalculate) {
                                let nextStart = adjustedCurrentMins + 10;
                                for (let i = 0; i < recalcFlights.length; i++) {
                                    let fMins = recalcFlights[i].hour24 * 60 + recalcFlights[i].min;
                                    if (recalcFlights[i].hour24 < 7) fMins += 1440;

                                    if (fMins < adjustedCurrentMins) continue; // Ya pasaron

                                    if (recalcFlights[i].type !== 'FORZOSO') {
                                        let safeMins = applyAntiCollision(nextStart);
                                        let newH = Math.floor((safeMins % 1440) / 60);
                                        let newM = (safeMins % 1440) % 60;
                                        recalcFlights[i] = { ...recalcFlights[i], time: `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`, hour24: newH, min: newM, type: 'RECALCULADO' };
                                        nextStart = safeMins + 90;
                                    } else {
                                        nextStart = fMins + 90;
                                    }
                                }
                                setFlights(recalcFlights);
                                flightsRef.current = recalcFlights;
                                db.collection('operaciones').doc('turno_actual').set({ flights: recalcFlights }, { merge: true });
                                speak("Alerta. Vuelo retrasado. El sistema anti colisión ha intervenido y recalculado el itinerario.");
                            }
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const autoAssignPilot = (jsonData = null) => {
                try {
                    const rawData = jsonData || localStorage.getItem('zoho_schedule');
                    if (!rawData) return;
                    
                    const json = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                    if (!json || json.length === 0) return;

                    const now = new Date();
                    const h = now.getHours();
                    let targetDate = new Date(now);
                    if (h < 7) { targetDate.setDate(targetDate.getDate() - 1); }

                    const isDayShift = h >= 7 && h < 19;
                    const targetDay = String(targetDate.getDate()); 
                    const dateRegex = new RegExp(`(^|\\D)0?${targetDay}(\\D|$)`, 'i');
                    
                    const shiftKeyword = isDayShift ? "6:50" : "18:50";
                    const shiftLetter = isDayShift ? "d" : "n";
                    const blacklist = ["empleado", "operador", "turno", "descanso", "área", "departamento", "true", "false", "si", "no", "am", "pm", "nombre", "fecha", "piloto", "d", "n", "6:50", "18:50", "7:00", "19:00", "a 7"];
                    
                    const isRealName = (text) => {
                        if (!text || text.length < 3) return false;
                        if (/\d/.test(text)) return false; 
                        if (text.includes(":") || text.includes("/") || text.includes("-")) return false;
                        if (blacklist.some(bad => text.toLowerCase() === bad)) return false;
                        return true;
                    };

                    let foundName = null;
                    let success = false;

                    // ESTRATEGIA 1: Lector de Matriz Clásica
                    let colIndex = -1;
                    for(let r = 0; r < 5 && r < json.length; r++){
                        if(!json[r]) continue;
                        for (let c = 0; c < json[r].length; c++) {
                            if (dateRegex.test(String(json[r][c]))) { colIndex = c; break; }
                        }
                        if(colIndex !== -1) break;
                    }

                    if (colIndex !== -1) {
                        for (let r = 1; r < json.length; r++) {
                            if(!json[r]) continue;
                            const rowStr = json[r].join(" ").toLowerCase();
                            if (rowStr.includes(shiftKeyword) || rowStr.includes(shiftLetter)) {
                                let cell = String(json[r][colIndex] || '').trim();
                                if (isRealName(cell)) {
                                    foundName = cell;
                                    success = true;
                                    break;
                                }
                            }
                        }
                    }

                    // ESTRATEGIA 2: Lector en Reversa (Anti-fantasmas)
                    if (!success) {
                        for (let r = 0; r < json.length; r++) {
                            if (!json[r]) continue;
                            const rowText = json[r].join(" ").toLowerCase();
                            
                            if (dateRegex.test(rowText) && (rowText.includes(shiftKeyword) || rowText.includes(shiftLetter))) {
                                for (let c = json[r].length - 1; c >= 0; c--) {
                                    let cell = String(json[r][c] || '').trim();
                                    if (isRealName(cell)) {
                                        foundName = cell;
                                        success = true;
                                        break;
                                    }
                                }
                            }
                            if (success) break;
                        }
                    }

                    if (foundName) {
                        foundName = foundName.toLowerCase().replace(/\b\w/g, l => l.toUpperCase()).trim();
                        setPilotName(foundName);
                        db.collection('operaciones').doc('turno_actual').set({ pilotName: foundName }, { merge: true });
                        localStorage.setItem('pilot_name', foundName);
                    } else {
                        const fallbackName = isDayShift ? "Piloto AM (Falla en Zoho)" : "Piloto PM (Falla en Zoho)";
                        setPilotName(fallbackName);
                        db.collection('operaciones').doc('turno_actual').set({ pilotName: fallbackName }, { merge: true });
                        localStorage.setItem('pilot_name', fallbackName);
                    }
                } catch (err) {
                    console.error("Error en Zoho Scanner:", err);
                }
            };

            const handleZohoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                speak("Procesando archivo CSV con motor doble núcleo.");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                        
                        localStorage.setItem('zoho_schedule', JSON.stringify(json));
                        autoAssignPilot(json);
                        
                    } catch(err) {
                        speak("Error al leer el archivo de excel.");
                    }
                };
                reader.readAsBinaryString(file);
                setAdminOpen(false);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima avanzado. Detectando vientos y probabilidad de lluvia.");
                
                try {
                    const key = geminiKey.trim();
                    const model = geminiModel.trim() || 'gemini-3.6-flash';
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLAS: Si solo dice 'UV' ES APTO PARA VOLAR, viento es 0. Si dice 'Apto para volar', viento es 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. EXTRAE LA PROBABILIDAD DE PRECIPITACIÓN/LLUVIA. Devuelve JSON ESTRICTO con 'hourlyData' teniendo 'time' (ej. '11:00am'), 'wind' numérico y 'rainProb' numérico (0 a 100)." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error("Error de API");

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario generado exitosamente. 8 vuelos programados para su turno.");
                    } else throw new Error("Formato incorrecto.");
                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al procesar. Intentando modo seguro de vuelos.");
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {}; let rainMap = {};
                for(let i=0; i<24; i++) { windMap[i] = 0; rainMap[i] = 0; }

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dp => {
                          let match = dp.time.match(/(\d+):00([ap]m)/i);
                          if (match) {
                               let h = parseInt(match[1]);
                               let ampm = match[2].toLowerCase();
                               if (ampm === 'pm' && h < 12) h += 12;
                               if (ampm === 'am' && h === 12) h = 0;
                               windMap[h] = dp.wind || 0;
                               rainMap[h] = dp.rainProb || 0;
                          }
                     });
                }

                setWindDataMap(windMap); setRainProbMap(rainMap);
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap, rainProbMap: rainMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    let timeInMins = h * 60 + m;

                    if (!isForzoso) {
                        let variance = Math.floor(Math.random() * 16) + 10; 
                        let sign = Math.random() > 0.5 ? 1 : -1;
                        timeInMins += (variance * sign);
                    }

                    // Pasa por el sistema anti-colisión
                    timeInMins = applyAntiCollision(timeInMins);

                    return `${String(Math.floor((timeInMins % 1440) / 60)).padStart(2, '0')}:${String((timeInMins % 1440) % 60).padStart(2, '0')}`;
                };

                // HORARIOS DEFINITIVOS (8 Día, 8 Noche con Forzosos en Piedra)
                let baseSchedule = [
                    { time: applyVariance("07:20", true), type: "FORZOSO", hour24: 7 }, 
                    { time: applyVariance("08:50"), type: "DINÁMICO", hour24: 8 },
                    { time: applyVariance("10:20"), type: "DINÁMICO", hour24: 10 },
                    { time: applyVariance("11:50"), type: "DINÁMICO", hour24: 11 },
                    { time: applyVariance("14:00", true), type: "FORZOSO", hour24: 14 },
                    { time: applyVariance("15:30"), type: "DINÁMICO", hour24: 15 },
                    { time: applyVariance("17:00", true), type: "FORZOSO", hour24: 17 },
                    { time: applyVariance("17:45"), type: "DINÁMICO", hour24: 17 },

                    { time: applyVariance("19:25", true), type: "FORZOSO", hour24: 19 }, 
                    { time: applyVariance("21:00"), type: "DINÁMICO", hour24: 21 },
                    { time: applyVariance("21:30", true), type: "FORZOSO", hour24: 21 },
                    { time: applyVariance("23:00"), type: "DINÁMICO", hour24: 23 },
                    { time: applyVariance("00:30"), type: "DINÁMICO", hour24: 0 },
                    { time: applyVariance("02:00"), type: "DINÁMICO", hour24: 2 },
                    { time: applyVariance("03:30"), type: "DINÁMICO", hour24: 3 },
                    { time: applyVariance("06:00", true), type: "FORZOSO", hour24: 6 }
                ];

                const finalSchedule = baseSchedule.map(f => {
                    let h24 = parseInt(f.time.split(':')[0]);
                    return { ...f, min: parseInt(f.time.split(':')[1]), hour24: h24, wind: windMap[h24] >= 40 ? 45 : (windMap[h24] || 0), rainProb: rainMap[h24] || 0 };
                });

                // Ordenar cronológicamente
                finalSchedule.sort((a,b) => (a.hour24*60+a.min) - (b.hour24*60+b.min));

                setFlights(finalSchedule); flightsRef.current = finalSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const handleLogManualFlight = () => {
                 if (isRaining || isFoggy) return;
                 if (loggedFlightsCount < totalFlightsTarget) {
                      const newCount = loggedFlightsCount + 1;
                      
                      // SISTEMA DE ARRASTRE (Rolling Deadline)
                      const now = new Date();
                      let currentMins = now.getHours() * 60 + now.getMinutes();
                      let updatedFlights = [...flights];
                      
                      let nextFlightIdx = updatedFlights.findIndex(f => {
                          let fm = f.hour24 * 60 + f.min;
                          if (now.getHours() >= 19 && f.hour24 < 7) fm += 1440;
                          let cm = currentMins;
                          if (now.getHours() >= 19 && now.getHours() < 7) cm += 1440; 
                          return fm > cm;
                      });

                      if (nextFlightIdx !== -1) {
                          let nextStartMins = now.getHours() * 60 + now.getMinutes() + 90; // Exigir max 90 mins
                          
                          for (let i = nextFlightIdx; i < updatedFlights.length; i++) {
                              if (updatedFlights[i].type === 'FORZOSO') {
                                  let fm = updatedFlights[i].hour24 * 60 + updatedFlights[i].min;
                                  if (updatedFlights[i].hour24 < 7) fm += 1440;
                                  nextStartMins = fm + 90; // Resetear contador desde el forzoso
                                  continue; 
                              }
                              let safeMins = applyAntiCollision(nextStartMins);
                              let h = Math.floor((safeMins % 1440) / 60);
                              let m = (safeMins % 1440) % 60;
                              updatedFlights[i] = { ...updatedFlights[i], time: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`, hour24: h, min: m, type: 'DINÁMICO' };
                              nextStartMins = safeMins + 90;
                          }
                      }

                      setLoggedFlightsCount(newCount);
                      setFlights(updatedFlights);
                      flightsRef.current = updatedFlights;

                      db.collection('operaciones').doc('turno_actual').set({ 
                          loggedFlightsCount: newCount,
                          flights: updatedFlights 
                      }, { merge: true });
                      
                      speak(`Vuelo registrado. ${newCount} de ${totalFlightsTarget}. Itinerario ajustado.`);
                 }
            };

            const undoLastFlight = () => {
                if (loggedFlightsCount > 0) {
                    const newCount = loggedFlightsCount - 1;
                    setLoggedFlightsCount(newCount);
                    db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                }
            };

            const currentMins = currentTime.getHours() * 60 + currentTime.getMinutes();
            const currentH = currentTime.getHours();
            const isCurrentlyDayShift = currentH >= 7 && currentH < 19;

            const futureFlights = flights.filter(f => {
                const isFlightDay = f.hour24 >= 7 && f.hour24 < 19;
                if (isCurrentlyDayShift !== isFlightDay) return false; 

                let flightMins = f.hour24 * 60 + f.min;
                let nowMins = currentMins;
                
                if (!isCurrentlyDayShift) {
                    if (f.hour24 < 7) flightMins += (24 * 60);
                    if (currentH < 7) nowMins += (24 * 60);
                }
                return flightMins >= (nowMins - 15);
            });

            return (
                <div className="min-h-screen p-4 w-full max-w-[400px] mx-auto pb-32" onClick={unlockAudio}>
                    
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-indigo-400 mt-1 tracking-widest uppercase">V43 FINAL • COMPACTO</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse">
                            🔇 Toca cualquier parte para activar Voz
                        </div>
                    )}

                    <div className="glass-card p-4 rounded-2xl mb-4 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-2xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-2 inline-flex items-center bg-indigo-900/50 border border-indigo-700 text-indigo-300 text-[9px] font-black px-2 py-1 rounded uppercase tracking-widest max-w-[150px] truncate">
                                    👨‍✈️ {pilotName}
                                </div>
                            </div>
                            <div className="text-right flex flex-col items-end">
                                <div className="mb-2 px-3 py-1.5 rounded-xl border bg-[#0f172a] shadow-lg">
                                    <p className="text-[9px] font-black uppercase text-slate-400">Faltan</p>
                                    <div className="text-xl font-black text-white text-right">
                                        {Math.max(0, totalFlightsTarget - loggedFlightsCount)}
                                    </div>
                                </div>
                                <div className="flex items-baseline gap-1 bg-indigo-900/30 px-3 py-2 rounded-xl border border-indigo-500/30">
                                    <span className="text-3xl font-black text-white">{loggedFlightsCount}</span>
                                    <span className="text-sm font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex flex-col gap-2 mt-4 border-t border-slate-800 pt-4">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }} disabled={isScanning || isRaining || isFoggy} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}>
                                {isScanning ? '⏳ Analizando...' : '📸 CLIMA'}
                            </button>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={(e) => { e.stopPropagation(); setIsRaining(!isRaining); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isRaining ? 'bg-emerald-600 text-white' : 'bg-rose-900/40 text-rose-400 border border-rose-900'}`}>
                                    {isRaining ? '☀️ REANUDAR' : '🌧️ LLUVIA'}
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); setIsFoggy(!isFoggy); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isFoggy ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 border border-slate-500'}`}>
                                    {isFoggy ? '☀️ DESPEJADO' : '🌫️ NEBLINA'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {isRaining && <div className="bg-rose-600 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">⚠️ SUSPENDIDO POR LLUVIA</div>}
                    {isFoggy && !isRaining && <div className="bg-slate-500 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">🌫️ VISIBILIDAD NULA</div>}

                    <div className={`glass-card p-4 rounded-2xl mb-6 relative ${(isRaining || isFoggy) ? 'opacity-50 pointer-events-none' : ''}`}>
                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-3">🗓️ PLAN RESTANTE ({futureFlights.length} VUELOS)</p>
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">Sube captura para generar.</div>
                        ) : futureFlights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-emerald-500">✅ Vuelos de tu turno concluidos.</div>
                        ) : (
                            <div className="space-y-2">
                                {futureFlights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-2.5 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-base font-black text-white">{f.time}</div>
                                            <div className="flex gap-2 items-center mt-0.5">
                                                <div className={`text-[9px] font-bold uppercase ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                    {f.wind >= 42 ? `🚫 Susp. (${f.wind}k)` : `✅ Libre (${f.wind}k)`}
                                                </div>
                                                {f.rainProb > 0 && <div className="text-[9px] font-bold uppercase text-cyan-400">☔ {f.rainProb}% Lluvia</div>}
                                            </div>
                                        </div>
                                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : f.type === 'RECALCULADO' ? 'bg-amber-900 text-amber-400 border-amber-700' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-[#0B0F19] flex justify-center items-center gap-2 z-40 border-t border-slate-800">
                        <div className="w-full max-w-[400px] mx-auto flex gap-2">
                             <button onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }} disabled={isRaining || isFoggy} className={`flex-1 font-black py-4 rounded-xl text-sm ${isRaining || isFoggy ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                 ✈️ REGISTRAR
                             </button>
                             <button onClick={(e) => { e.stopPropagation(); undoLastFlight(); }} className="bg-rose-900/50 hover:bg-rose-900 text-rose-300 font-black py-4 px-5 rounded-xl border border-rose-800 text-sm">
                                 -1
                             </button>
                        </div>
                    </div>

                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5">
                                <h2 className="text-base font-black text-white mb-4">⚙️ Ajustes</h2>
                                <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="API Key" className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white mb-4 text-xs" />
                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 text-white font-bold py-2 rounded-lg text-xs">Cerrar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); setSettingsOpen(false); }} className="flex-1 bg-indigo-600 text-white font-bold py-2 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5">
                                <h2 className="text-base font-black text-indigo-400 mb-2">👨‍💼 Admin (Pilotos)</h2>
                                <p className="text-[10px] text-slate-400 mb-4">Motor "Doble Núcleo" (Matriz/Lista) Activo.</p>
                                <input type="file" id="zohoUpload" accept=".csv, .xlsx" className="hidden" onChange={handleZohoUpload} />
                                <button onClick={() => document.getElementById('zohoUpload').click()} className="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg text-xs mb-4">📗 SUBIR NUEVO ZOHO (CSV)</button>
                                
                                <div className="mb-4 pt-4 border-t border-slate-800">
                                    <label className="block text-[10px] text-slate-400 uppercase mb-1">Corrección Manual (Opcional)</label>
                                    <input type="text" value={pilotName} onChange={(e) => { setPilotName(e.target.value); db.collection('operaciones').doc('turno_actual').set({ pilotName: e.target.value }, { merge: true }); localStorage.setItem('pilot_name', e.target.value); }} className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2 text-white text-sm" />
                                </div>
                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs">Cerrar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
