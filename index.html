<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V42 Master</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librería SheetJS para leer Zoho (CSV/XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase V10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .rain-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%); backdrop-filter: blur(8px); }
        .fog-overlay { background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(100,116,139,0.9) 100%); backdrop-filter: blur(14px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            
            // Autocorrección del modelo (borra el 1.5 si existe y fuerza el 3.6)
            const [geminiModel, setGeminiModel] = useState(() => {
                const savedModel = localStorage.getItem('gemini_model');
                if (!savedModel || savedModel.includes('1.5')) {
                    localStorage.setItem('gemini_model', 'gemini-3.6-flash');
                    return 'gemini-3.6-flash';
                }
                return savedModel;
            });
            
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'error' });
            
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const totalFlightsTarget = 13;

            const [isRaining, setIsRaining] = useState(false);
            const [isFoggy, setIsFoggy] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});
            const [rainDataMap, setRainDataMap] = useState({});

            const [audioUnlocked, setAudioUnlocked] = useState(false);
            const audioUnlockedRef = useRef(false);
            
            const [adminOpen, setAdminOpen] = useState(false);
            const [allMonthShifts, setAllMonthShifts] = useState([]);
            const [currentOperator, setCurrentOperator] = useState('Sin asignar');
            const [isUploading, setIsUploading] = useState(false);
            
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const isFoggyRef = useRef(false);
            const windDataMapRef = useRef({});
            const rainDataMapRef = useRef({});
            const allMonthShiftsRef = useRef([]);
            const loggedFlightsCountRef = useRef(0);
            const authReady = useRef(false);

            useEffect(() => {
                let unsubscribeTurno = () => {};
                let unsubscribeMes = () => {};

                firebase.auth().signInAnonymously().then(() => {
                    authReady.current = true;
                    
                    unsubscribeTurno = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) { setFlights(data.flights); flightsRef.current = data.flights; }
                            if (data.loggedFlightsCount !== undefined) { setLoggedFlightsCount(data.loggedFlightsCount); loggedFlightsCountRef.current = data.loggedFlightsCount; }
                            if (data.isRaining !== undefined) { setIsRaining(data.isRaining); isRainingRef.current = data.isRaining; }
                            if (data.isFoggy !== undefined) { setIsFoggy(data.isFoggy); isFoggyRef.current = data.isFoggy; }
                            if (data.windDataMap) { setWindDataMap(data.windDataMap); windDataMapRef.current = data.windDataMap; }
                            if (data.rainDataMap) { setRainDataMap(data.rainDataMap); rainDataMapRef.current = data.rainDataMap; }
                        }
                    }, (err) => console.error("Error leyendo turno:", err));
                    
                    unsubscribeMes = db.collection('operaciones').doc('turnos_mes').onSnapshot((doc) => {
                        if (doc.exists && doc.data().turnos) {
                            setAllMonthShifts(doc.data().turnos);
                            allMonthShiftsRef.current = doc.data().turnos;
                        } else {
                            setAllMonthShifts([]);
                            allMonthShiftsRef.current = [];
                        }
                    });

                }).catch((error) => console.error("Error Auth:", error));

                return () => { unsubscribeTurno(); unsubscribeMes(); };
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema de voz activado.");
                    u.lang = 'es-MX';
                    u.volume = 0.3;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();

                    if (h >= 7 && h < 19) { setShiftName('Turno Diurno'); } 
                    else { setShiftName('Turno Nocturno'); }
                    
                    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                    let yesterday = new Date(now);
                    yesterday.setDate(yesterday.getDate() - 1);
                    const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;

                    const currentMins = h * 60 + m;
                    let foundOp = 'Sin asignar';

                    if (allMonthShiftsRef.current.length > 0) {
                        for (let shift of allMonthShiftsRef.current) {
                            if (shift.date !== todayStr && shift.date !== yesterdayStr) continue;

                            let startParts = shift.start.split(':');
                            let endParts = shift.end.split(':');
                            let startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                            let endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

                            if (startMins <= endMins) {
                                if (shift.date === todayStr && currentMins >= startMins && currentMins < endMins) { foundOp = shift.name; }
                            } else {
                                if (shift.date === todayStr && currentMins >= startMins) { foundOp = shift.name; } 
                                else if (shift.date === yesterdayStr && currentMins < endMins) { foundOp = shift.name; }
                            }
                        }
                    }
                    setCurrentOperator(prevOp => prevOp !== foundOp ? foundOp : prevOp);

                    if (h === 0 && m === 0 && s === 0 && authReady.current) {
                        speak("Iniciando nuevo día operativo. Reiniciando contadores.");
                        db.collection('operaciones').doc('turno_actual').set({
                            flights: [], loggedFlightsCount: 0, isRaining: false, isFoggy: false, windDataMap: {}, rainDataMap: {}
                        });
                    }

                    if (s === 0) {
                        const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        
                        // Alarmas Estáticas Requeridas
                        if (h === 7 && m === 50) {
                            speak("Atención comandante. Es hora de la junta operativa de shopfloor. Las operaciones de vuelo quedan en pausa hasta las ocho quince.");
                            setModal({ isOpen: true, title: '⏰ JUNTA OPERATIVA', message: 'Reunión Shopfloor de 07:50 AM a 08:15 AM. Vuelos en pausa.', type: 'error' });
                        }
                        else if (h === 12 && m === 0) {
                            speak("Atención comandante. Es hora de elaborar los reportes K P I y actualizar la captura del clima de ou kei to flai en la plataforma.");
                            setModal({ isOpen: true, title: '📊 KPIs y CLIMA', message: 'Hora de elaborar KPIs y actualizar captura OK To Fly (12:00 PM).', type: 'error' });
                        }
                        else if (h === 0 && m === 5) {
                            speak("Atención. Actualización de captura del clima requerida. Por favor confirme el ou kei to flai para garantizar condiciones adecuadas.");
                            setModal({ isOpen: true, title: '🌙 ACTUALIZAR CLIMA', message: 'Obligatorio validar condiciones seguras OK To Fly (12:05 AM).', type: 'error' });
                        }

                        // Alarma de toma de evidencia por mal clima (Cada hora exacta)
                        if (m === 0) {
                            const currentWind = windDataMapRef.current[h] || 0;
                            const isAdverseWeather = isRainingRef.current || isFoggyRef.current || currentWind >= 40;
                            if (isAdverseWeather) {
                                speak("Atención piloto. Es hora de tomar evidencia fotográfica de las condiciones meteorológicas adversas.");
                            }
                        }

                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current && !isFoggyRef.current) {
                            flightsRef.current.forEach(flight => {
                                if (flight.wind < 42) {
                                    const parts = flight.time.split(':');
                                    let fh = parseInt(parts[0]);
                                    let fm = parseInt(parts[1]);
                                    
                                    let flightDate = new Date();
                                    flightDate.setHours(fh, fm, 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let w10H = String(warn10.getHours()).padStart(2, '0');
                                    let w10M = String(warn10.getMinutes()).padStart(2, '0');

                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    let w5H = String(warn5.getHours()).padStart(2, '0');
                                    let w5M = String(warn5.getMinutes()).padStart(2, '0');
                                    
                                    if (timeStr === `${w10H}:${w10M}`) {
                                        speak(`Atención piloto. Faltan 10 minutos para el vuelo programado a las ${flight.time}.`);
                                    }
                                    if (timeStr === `${w5H}:${w5M}`) {
                                        speak(`Atención piloto. Faltan 5 minutos para el despegue de las ${flight.time}. Prepárese.`);
                                    }
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    setModal({ isOpen: true, title: 'Falta la Llave', message: 'Abre los ajustes (⚙️) y pega tu llave API.' });
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
                e.target.value = null; 
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima, ráfagas y probabilidad de lluvia...");
                
                try {
                    const key = geminiKey.trim();
                    const modelName = geminiModel.trim() || 'gemini-3.6-flash';
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima de la imagen. REGLA ESTRICTA 11:00am: Si solo dice 'UV', viento es 0, lluvia 0. Regla general: Si dice 'Apto para volar', viento 0, lluvia 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. Si dice 'Lluvia X%', extrae ese porcentaje numérico. Devuelve un JSON estricto con un arreglo 'hourlyData' teniendo 'time' (ej. '11:00am'), 'wind' (número) y 'rainProb' (probabilidad de lluvia numérica de 0 a 100)." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(`Detalle de IA: \n${JSON.stringify(err, null, 2)}\n\nAsegúrate de que tu Llave sea válida.`);
                    }

                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("La IA no devolvió contenido.");

                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) {
                         aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    }
                    
                    let parsedData;
                    try {
                        parsedData = JSON.parse(aiResponseText);
                    } catch(e) {
                        throw new Error("Formato JSON incorrecto. Reintenta la captura.");
                    }

                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario calculado con base en vientos y condiciones operativas.");
                    } else {
                         throw new Error("La IA no incluyó el arreglo hourlyData.");
                    }

                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al analizar el clima.");
                    setModal({ isOpen: true, title: 'Diagnóstico IA', message: `No se pudo procesar.\n\nError: ${error.message}` });
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {};
                let rainMap = {};
                for(let i=0; i<24; i++) {
                    windMap[i] = 0;
                    rainMap[i] = 0;
                }

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dataPoint => {
                          let hourMatch = dataPoint.time.match(/(\d+):00([ap]m)/i);
                          if (hourMatch) {
                               let hour = parseInt(hourMatch[1]);
                               let ampm = hourMatch[2].toLowerCase();
                               if (ampm === 'pm' && hour < 12) hour += 12;
                               if (ampm === 'am' && hour === 12) hour = 0;
                               windMap[hour] = dataPoint.wind || 0;
                               rainMap[hour] = dataPoint.rainProb || 0;
                          }
                     });
                }

                setWindDataMap(windMap);
                setRainDataMap(rainMap);
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap, rainDataMap: rainMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    let variance = Math.floor(Math.random() * 31) - 15; 
                    let date = new Date(2026, 0, 1, h, m + variance);
                    let newH = String(date.getHours()).padStart(2, '0');
                    let newM = String(date.getMinutes()).padStart(2, '0');
                    return `${newH}:${newM}`;
                };

                const isSuspendedAt11 = windMap[11] >= 40;
                const isSuspendedAt12 = (windMap[12] >= 40 || windMap[13] >= 40) && !isSuspendedAt11;

                let baseSchedule = [];

                // REGLAS ESTRICTAS DE COMPRESIÓN
                if (isSuspendedAt11) {
                    baseSchedule = [
                        { time: "06:00", type: "FORZOSO", isForzoso: true },
                        { time: "07:20", type: "FORZOSO", isForzoso: true },
                        { time: "08:30", type: "DINÁMICO", isForzoso: false },
                        { time: "09:20", type: "DINÁMICO", isForzoso: false },
                        { time: "10:15", type: "DINÁMICO", isForzoso: false },
                        { time: "14:00", type: "FORZOSO", isForzoso: true },
                        { time: "15:30", type: "DINÁMICO", isForzoso: false },
                        { time: "17:00", type: "FORZOSO", isForzoso: true },
                        { time: "18:15", type: "DINÁMICO", isForzoso: false },
                        { time: "19:30", type: "DINÁMICO", isForzoso: false },
                        { time: "20:30", type: "DINÁMICO", isForzoso: false },
                        { time: "21:30", type: "FORZOSO", isForzoso: true },
                        { time: "22:45", type: "DINÁMICO", isForzoso: false }
                    ];
                } else if (isSuspendedAt12) {
                    baseSchedule = [
                        { time: "06:00", type: "FORZOSO", isForzoso: true },
                        { time: "07:20", type: "FORZOSO", isForzoso: true },
                        { time: "08:30", type: "DINÁMICO", isForzoso: false },
                        { time: "09:30", type: "DINÁMICO", isForzoso: false },
                        { time: "10:30", type: "DINÁMICO", isForzoso: false },
                        { time: "11:30", type: "DINÁMICO", isForzoso: false },
                        { time: "12:45", type: "DINÁMICO", isForzoso: false },
                        { time: "14:00", type: "FORZOSO", isForzoso: true },
                        { time: "15:30", type: "DINÁMICO", isForzoso: false },
                        { time: "17:00", type: "FORZOSO", isForzoso: true },
                        { time: "19:00", type: "DINÁMICO", isForzoso: false },
                        { time: "21:30", type: "FORZOSO", isForzoso: true },
                        { time: "22:45", type: "DINÁMICO", isForzoso: false }
                    ];
                } else {
                    // DÍA NORMAL
                    baseSchedule = [
                        { time: "06:00", type: "FORZOSO", isForzoso: true },
                        { time: "07:20", type: "FORZOSO", isForzoso: true },
                        { time: "08:45", type: "DINÁMICO", isForzoso: false },
                        { time: "10:15", type: "DINÁMICO", isForzoso: false },
                        { time: "11:45", type: "DINÁMICO", isForzoso: false },
                        { time: "13:00", type: "DINÁMICO", isForzoso: false },
                        { time: "14:00", type: "FORZOSO", isForzoso: true },
                        { time: "15:30", type: "DINÁMICO", isForzoso: false },
                        { time: "17:00", type: "FORZOSO", isForzoso: true },
                        { time: "18:30", type: "DINÁMICO", isForzoso: false },
                        { time: "20:00", type: "DINÁMICO", isForzoso: false },
                        { time: "21:30", type: "FORZOSO", isForzoso: true },
                        { time: "22:45", type: "DINÁMICO", isForzoso: false }
                    ];
                }
                
                const finalSchedule = baseSchedule.map(item => {
                    let calculatedTime = applyVariance(item.time, item.isForzoso);
                    let hour24 = parseInt(calculatedTime.split(':')[0]);
                    return {
                        time: calculatedTime, 
                        type: item.type, 
                        wind: windMap[hour24] >= 40 ? 45 : (windMap[hour24] || 0), 
                        rainProb: rainMap[hour24] || 0, 
                        hour24: hour24 
                    };
                });

                setFlights(finalSchedule);
                flightsRef.current = finalSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const toggleRainProtocol = () => {
                const newState = !isRaining;
                setIsRaining(newState);
                isRainingRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isRaining: newState }, { merge: true });

                if (newState) {
                    speak("Alerta. Operaciones suspendidas por lluvia local.");
                } else {
                    if (isFoggy) speak("Lluvia finalizada, pero se mantiene la suspensión por baja visibilidad.");
                    else { speak("Lluvia finalizada. Calculando itinerario extendido."); recalculateAfterWeather(); }
                }
            };

            const toggleFogProtocol = () => {
                const newState = !isFoggy;
                setIsFoggy(newState);
                isFoggyRef.current = newState;
                db.collection('operaciones').doc('turno_actual').set({ isFoggy: newState }, { merge: true });
                
                if (newState) {
                    speak("Operaciones suspendidas por baja visibilidad. Despegues bloqueados.");
                } else {
                    if (isRaining) speak("Visibilidad restablecida, pero se mantiene la suspensión por lluvia.");
                    else { speak("Visibilidad restablecida. Reprogramando vuelos faltantes."); recalculateAfterWeather(); }
                }
            };

            const recalculateAfterWeather = () => {
                const currentHour = currentTime.getHours();
                const currentMinute = currentTime.getMinutes();
                const remaining = totalFlightsTarget - loggedFlightsCount;

                if (remaining <= 0) return;

                const endTime = 23 * 60 + 30; 
                const currentTimeInMins = currentHour * 60 + currentMinute + 15;
                const timeWindow = endTime - currentTimeInMins;
                
                if (timeWindow <= 0) return;

                const interval = Math.floor(timeWindow / remaining);
                let newSchedule = [];
                let currentSlot = currentTimeInMins;

                for (let i = 0; i < remaining; i++) {
                    let h = Math.floor(currentSlot / 60);
                    let m = Math.floor(currentSlot % 60);
                    let timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                    let windAtHour = windDataMap[h] || 0;
                    let rainAtHour = rainDataMap[h] || 0;

                    newSchedule.push({ time: timeStr, type: "REPROGRAMADO", wind: windAtHour, rainProb: rainAtHour, hour24: h });
                    currentSlot += interval;
                }
                
                setFlights(newSchedule);
                flightsRef.current = newSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: newSchedule }, { merge: true });
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsUploading(true);
                const reader = new FileReader();

                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        
                        let json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                        let turnosExtraidos = [];
                        let parseados = 0;

                        const cleanName = (text) => {
                            if(!text || typeof text !== 'string') return null;
                            let primerRenglon = text.split('\n')[0];
                            let c = primerRenglon.replace(/Especialista|RPAS|OS|Audi|M[eé]xico|Turno|lun|mar|mi[eé]|jue|vie|s[aá]b|dom/gi, '').trim();
                            if(c.length > 3 && !/\d/.test(c)) return c;
                            return null;
                        };

                        const extractDate = (text) => {
                            let match = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
                            if(match) {
                                let y = match[3].length === 2 ? `20${match[3]}` : match[3];
                                let m = match[2]; let d = match[1];
                                if(parseInt(m) > 12) { let temp = m; m = d; d = temp; }
                                return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                            }
                            return null;
                        };

                        const formatTime = (tStr) => {
                            if(!tStr) return null;
                            let match = tStr.match(/(\d{1,2})[:.](\d{2})\s*([ap]m)?/i);
                            if(!match) return null;
                            let h = parseInt(match[1]);
                            let m = match[2];
                            let ampm = match[3] ? match[3].toLowerCase() : null;
                            if(ampm === 'pm' && h < 12) h += 12;
                            if(ampm === 'am' && h === 12) h = 0;
                            return `${String(h).padStart(2, '0')}:${m}`;
                        };

                        // 1. MODO CUADRÍCULA (PDF/Excel normal)
                        for(let r=0; r<json.length; r++) {
                            let row = json[r];
                            let combinedText = row.join(" | ");
                            let timeMatches = combinedText.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)(?:\s*[aApP][mM])?\b/g);
                            
                            if (timeMatches && timeMatches.length >= 2) {
                                let start = formatTime(timeMatches[0]);
                                let end = formatTime(timeMatches[1]);
                                let dateStr = null;
                                let name = null;

                                for(let i = Math.max(0, r - 5); i <= Math.min(json.length - 1, r + 2); i++) {
                                    let probeText = json[i].join(" | ");
                                    if(!dateStr) dateStr = extractDate(probeText);
                                    if(!name) {
                                        for(let cell of json[i]) {
                                            let n = cleanName(String(cell));
                                            if(n) { name = n; break; }
                                        }
                                    }
                                    if(dateStr && name) break;
                                }

                                if(start && end && dateStr && name) {
                                    turnosExtraidos.push({ date: dateStr, name: name, start: start, end: end });
                                    parseados++;
                                }
                            }
                        }

                        // 2. MODO LISTA (El "Falso CSV" de Zoho)
                        if (turnosExtraidos.length === 0) {
                            for(let r=0; r<json.length; r++) {
                                let row = json[r];
                                let rowText = row.join(" ");
                                
                                let times = [];
                                for (let cell of row) {
                                    let t = formatTime(String(cell));
                                    if (t) times.push(t);
                                }
                                
                                if (times.length >= 2) {
                                    let start = times[0];
                                    let end = times[1];
                                    let dateStr = extractDate(rowText);
                                    let name = null;
                                    
                                    for(let cell of row) {
                                        let n = cleanName(String(cell));
                                        if (n) { name = n; break; }
                                    }
                                    
                                    if(start && end && dateStr && name) {
                                        turnosExtraidos.push({ date: dateStr, name: name, start: start, end: end });
                                        parseados++;
                                    }
                                }
                            }
                        }

                        const uniqueTurnos = [];
                        const seen = new Set();
                        turnosExtraidos.forEach(t => {
                            const id = `${t.date}-${t.name}-${t.start}`;
                            if(!seen.has(id)) { seen.add(id); uniqueTurnos.push(t); }
                        });

                        if (uniqueTurnos.length > 0) {
                            db.collection('operaciones').doc('turnos_mes').set({ turnos: uniqueTurnos });
                            speak(`Carga exitosa. ${uniqueTurnos.length} turnos guardados.`);
                            setModal({ isOpen: true, title: '✅ Carga Exitosa', message: `Turnos detectados: ${uniqueTurnos.length}`, type: 'success' });
                        } else {
                            setModal({ isOpen: true, title: 'Diagnóstico de Archivo', message: `Filas analizadas: ${json.length}\nHorarios detectados: ${parseados}\nTurnos formados: ${uniqueTurnos.length}\n\nEl sistema encontró 0 horarios, revisa que el archivo original no esté en blanco.` });
                        }

                    } catch (error) {
                        setModal({ isOpen: true, title: 'Error Crítico', message: 'El archivo está corrupto o protegido.', type: 'error' });
                    } finally {
                        setIsUploading(false);
                        e.target.value = null;
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const clearDB = () => {
                db.collection('operaciones').doc('turnos_mes').set({ turnos: [] });
                speak("Base de datos de operadores limpiada.");
            };

            const todayStrUI = `${currentTime.getFullYear()}-${String(currentTime.getMonth() + 1).padStart(2, '0')}-${String(currentTime.getDate()).padStart(2, '0')}`;
            const todayShiftsUI = allMonthShifts.filter(s => s.date === todayStrUI);

            const currentTotalMins = currentTime.getHours() * 60 + currentTime.getMinutes();
            // Filtrar vuelos para que solo muestre los futuros (con 15 min de gracia)
            const futureFlights = flights.filter(f => {
                const [h, m] = f.time.split(':').map(Number);
                const flightMins = h * 60 + m;
                return flightMins >= currentTotalMins - 15;
            });

            const getOverlayContent = () => {
                if (isRaining && isFoggy) return { text: "Suspendido: Lluvia y Neblina", style: "rain-overlay" };
                if (isRaining) return { text: "Esperando que mejore el clima (Lluvia)...", style: "rain-overlay" };
                if (isFoggy) return { text: "Esperando visibilidad (Neblina)...", style: "fog-overlay" };
                return null;
            };
            const activeOverlay = getOverlayContent();

            const handleLogManualFlight = () => {
                 if (isRaining || isFoggy) {
                     setModal({ isOpen: true, title: 'Bloqueo Activo', message: 'No puedes registrar despegues durante condiciones meteorológicas adversas.', type: 'error' });
                     return;
                 }
                 if (loggedFlightsCount < totalFlightsTarget) {
                      const newCount = loggedFlightsCount + 1;
                      setLoggedFlightsCount(newCount);
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                      speak(`Vuelo registrado. Total del día, ${newCount} de 13.`);
                 } else {
                      speak("Meta diaria de vuelos completada.");
                 }
            };

            const handleUndoFlight = () => {
                 if (loggedFlightsCount > 0) {
                      const newCount = loggedFlightsCount - 1;
                      setLoggedFlightsCount(newCount);
                      db.collection('operaciones').doc('turno_actual').set({ loggedFlightsCount: newCount }, { merge: true });
                      speak("Registro eliminado exitosamente.");
                 }
            };

            return (
                <div className="min-h-screen p-4 max-w-2xl mx-auto pb-32" onClick={unlockAudio}>
                    
                    <div className="flex justify-between items-center mb-5">
                        <div>
                            <h1 className="text-lg md:text-xl font-black tracking-tight flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-xs">DP</span>
                                DISPATCHER PRO
                            </h1>
                            <p className="text-[10px] font-bold text-indigo-400 mt-1 tracking-widest uppercase">V42 MASTER • 🟢 OMNI SCANNER</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition" title="Administración">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2.5 rounded-lg border border-slate-700 transition">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse shadow-md">
                            🔇 Toca la pantalla para activar el Asistente de Voz y Alertas
                        </div>
                    )}

                    <div className="glass-card p-5 rounded-2xl mb-5 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-2xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-3xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-3 inline-flex items-center gap-1.5 bg-indigo-900/40 text-indigo-200 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs font-bold shadow-inner truncate max-w-[250px]">
                                    <span className="text-indigo-400 font-black">👨‍✈️ PILOTO:</span> {currentOperator}
                                </div>
                            </div>

                            <div className="text-right flex flex-col items-end">
                                <div className={`mb-3 px-4 py-2 rounded-xl border shadow-[0_0_20px_rgba(0,0,0,0.4)] transition-all ${shiftName === 'Turno Diurno' ? 'bg-amber-500/20 border-amber-500/50' : 'bg-fuchsia-600/20 border-fuchsia-500/50'}`}>
                                    <p className={`text-[10px] font-black uppercase tracking-widest ${shiftName === 'Turno Diurno' ? 'text-amber-400' : 'text-fuchsia-400'}`}>
                                        {shiftName === 'Turno Diurno' ? '🎯 Faltan (Diurno)' : '🔄 Heredados (Noct.)'}
                                    </p>
                                    <div className="text-2xl font-black text-white drop-shadow-md text-right mt-0.5">
                                        {shiftName === 'Turno Diurno' ? Math.max(0, 7 - loggedFlightsCount) : Math.max(0, 13 - loggedFlightsCount)}
                                        <span className="text-sm font-bold text-white/60 ml-1.5 uppercase tracking-wider">vuelos</span>
                                    </div>
                                </div>
                                
                                <div className="flex items-baseline gap-1 bg-[#0f172a] px-4 py-2.5 rounded-xl border border-indigo-500/30 shadow-[0_0_20px_rgba(79,70,229,0.3)] mt-1">
                                    <span className="text-5xl font-black text-white tracking-tighter drop-shadow-lg">{loggedFlightsCount}</span>
                                    <span className="text-2xl font-bold text-indigo-500/70">/{totalFlightsTarget}</span>
                                </div>
                                <p className="text-[11px] text-indigo-300 font-black uppercase tracking-widest mt-2">📍 Avance Global</p>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button 
                                onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }}
                                disabled={isScanning || isRaining || isFoggy}
                                className={`col-span-2 py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : (isRaining || isFoggy) ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}
                            >
                                {isScanning ? '⏳ Analizando...' : '📸 ESCANEAR CLIMA (13 VUELOS)'}
                            </button>
                            
                            <button 
                                onClick={(e) => { e.stopPropagation(); toggleRainProtocol(); }}
                                className={`py-3 rounded-xl font-bold text-[11px] transition flex justify-center items-center gap-1 ${isRaining ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-rose-900/40 hover:bg-rose-900/60 text-rose-400 border border-rose-900'}`}
                            >
                                {isRaining ? '☀️ QUITAR LLUVIA' : '🌧️ DECLARAR LLUVIA'}
                            </button>

                            <button onClick={(e) => { e.stopPropagation(); toggleFogProtocol(); }} className={`py-3 rounded-xl font-bold text-[11px] transition flex justify-center items-center gap-1 ${isFoggy ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]' : 'bg-slate-700/50 hover:bg-slate-600 text-slate-300 border border-slate-600'}`}>
                                {isFoggy ? '☀️ QUITAR NEBLINA' : '🌫️ DECLARAR NEBLINA'}
                            </button>
                        </div>
                    </div>

                    <div className={`glass-card p-5 rounded-2xl mb-6 relative ${(isRaining || isFoggy) ? 'opacity-50 pointer-events-none' : ''}`}>
                        {activeOverlay && (
                            <div className={`absolute inset-0 ${activeOverlay.style} rounded-2xl z-10 flex items-center justify-center text-center p-4`}>
                                <span className="text-white font-bold text-lg">{activeOverlay.text}</span>
                            </div>
                        )}

                        <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-3">🗓️ Plan Restante del Día</p>
                        
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">
                                Sube una captura para generar el itinerario de vuelos.
                            </div>
                        ) : futureFlights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-emerald-500">
                                ¡Plan del día completado! Ya no hay vuelos programados.
                            </div>
                        ) : (
                            <div className="space-y-2.5">
                                {futureFlights.map((f, i) => (
                                    <div key={i} className={`flex flex-col p-3 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50 opacity-75' : 'border-slate-800'}`}>
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <div className="text-lg font-black text-white tracking-wide">{f.time}</div>
                                                <div className={`text-[10px] font-bold mt-0.5 uppercase tracking-wider flex items-center gap-1 ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                    {f.wind >= 42 ? `🚫 Suspendido (${f.wind} km/h)` : `✅ Libre (${f.wind} km/h)`}
                                                </div>
                                            </div>
                                            <span className={`text-[9px] font-black uppercase px-2.5 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : f.type === 'REPROGRAMADO' ? 'bg-amber-950 text-amber-500 border-amber-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                                {f.type}
                                            </span>
                                        </div>
                                        {/* Advertencia visual si hay probabilidad de lluvia (No bloquea el vuelo) */}
                                        {f.rainProb > 0 && f.wind < 42 && (
                                            <div className="mt-2 bg-blue-900/30 border border-blue-500/30 text-blue-300 text-[10px] font-bold px-2 py-1 rounded w-fit uppercase tracking-wider flex items-center gap-1">
                                                ☔ {f.rainProb}% Prob. Lluvia (Precaución)
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[#0B0F19] via-[#0B0F19] to-transparent flex flex-col items-center justify-end z-40 pointer-events-none">
                         <div className="w-full max-w-xs space-y-2">
                             <button 
                                 onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }}
                                 disabled={isRaining || isFoggy}
                                 className={`pointer-events-auto w-full font-black py-3.5 rounded-xl transition transform hover:scale-105 ${(isRaining || isFoggy) ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.4)]'}`}
                             >
                                 ✈️ REGISTRAR DESPEGUE AHORA
                             </button>
                             {loggedFlightsCount > 0 && (
                                 <button 
                                     onClick={(e) => { e.stopPropagation(); handleUndoFlight(); }}
                                     className="pointer-events-auto w-full text-center text-[10px] font-bold text-slate-500 hover:text-slate-300 transition underline underline-offset-2"
                                 >
                                     ¿Registraste por error? Deshacer (-1)
                                 </button>
                             )}
                         </div>
                    </div>

                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={() => setAdminOpen(false)}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-md shadow-2xl p-6" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-black text-white flex items-center gap-2">👨‍💼 Administración</h2>
                                    <button onClick={clearDB} className="text-[9px] bg-rose-900/40 text-rose-400 px-2 py-1 rounded border border-rose-900 uppercase font-bold hover:bg-rose-900/60">Limpiar Nube</button>
                                </div>
                                
                                <div className="bg-indigo-900/20 border border-indigo-500/30 p-4 rounded-xl mb-6 text-center">
                                    <h3 className="text-xs font-black tracking-widest text-indigo-400 uppercase mb-2">📅 Carga Zoho (Mes)</h3>
                                    <input type="file" id="excelUpload" accept=".csv, .xlsx" className="hidden" onChange={handleExcelUpload} />
                                    <button onClick={() => document.getElementById('excelUpload').click()} disabled={isUploading} className={`w-full font-bold py-3.5 rounded-lg text-sm shadow-[0_0_15px_rgba(79,70,229,0.3)] transition flex justify-center items-center gap-2 ${isUploading ? 'bg-indigo-800 text-indigo-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white transform hover:scale-105'}`}>
                                        {isUploading ? '⏳ Procesando Archivo...' : '📄 Subir Horario Zoho'}
                                    </button>
                                </div>

                                <div className="flex justify-between items-center mb-3">
                                    <p className="text-[10px] font-bold tracking-widest text-emerald-400 uppercase">Turnos de Hoy ({todayStrUI})</p>
                                </div>

                                <div className="space-y-2 mb-6 max-h-48 overflow-y-auto pr-1">
                                    {todayShiftsUI.length === 0 ? (
                                        <div className="text-center py-6 bg-[#0f172a] rounded-xl border border-slate-800 text-xs text-slate-500">
                                            No hay turnos registrados para hoy. Sube el archivo del mes.
                                        </div>
                                    ) : (
                                        todayShiftsUI.map((op, i) => (
                                            <div key={i} className="flex justify-between items-center bg-[#0f172a] p-3 rounded-lg border border-slate-800">
                                                <div>
                                                    <p className="font-bold text-white text-sm truncate max-w-[200px]">{op.name}</p>
                                                    <p className="text-[10px] text-slate-400">{op.start} - {op.end}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl border border-slate-700 transition">
                                    Cerrar Panel
                                </button>
                            </div>
                        </div>
                    )}

                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6">
                                <h2 className="text-lg font-black text-white mb-4">⚙️ Ajustes</h2>
                                
                                <div className="mb-3">
                                    <label className="block text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">Llave Gemini API</label>
                                    <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="AQ. o AIzaSy..." className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-2.5 text-white outline-none font-mono text-xs" />
                                </div>
                                <div className="mb-5">
                                    <label className="block text-[10px] font-bold tracking-widest text-emerald-400 uppercase mb-2">Modelo IA</label>
                                    <input type="text" value={geminiModel} onChange={e => setGeminiModel(e.target.value)} className="w-full bg-[#1e293b] border border-emerald-900/50 rounded-lg p-2.5 text-emerald-300 outline-none font-mono text-xs" />
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs">Cerrar</button>
                                    <button onClick={() => { 
                                        localStorage.setItem('gemini_key', geminiKey); 
                                        localStorage.setItem('gemini_model', geminiModel); 
                                        setSettingsOpen(false); 
                                        speak("Ajustes guardados."); 
                                    }} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {modal.isOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl p-6">
                                <h2 className="text-lg font-black text-white mb-2">{modal.title}</h2>
                                <p className="text-slate-300 text-sm mb-6 whitespace-pre-line">{modal.message}</p>
                                <button onClick={() => setModal({ ...modal, isOpen: false })} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-xs">Entendido</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
