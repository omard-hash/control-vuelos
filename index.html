<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        body { background-color: #0B0F19; color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; }
        .glass-card { background-color: #131826; border: 1px solid #1f2937; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        if (localStorage.getItem('gemini_model') === 'gemini-1.5-pro' || localStorage.getItem('gemini_model') === 'gemini-1.5-flash') {
            localStorage.setItem('gemini_model', 'gemini-3.6-flash');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDXjwv133-dIKyprCktTUkjx_adAz1DhAY",
            authDomain: "control-vuelos.firebaseapp.com",
            projectId: "control-vuelos",
            storageBucket: "control-vuelos.firebasestorage.app",
            messagingSenderId: "756032981781",
            appId: "1:756032981781:web:451641e72abe3692c0771c"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [shiftName, setShiftName] = useState('Turno Diurno');
            const [isScanning, setIsScanning] = useState(false);
            const [flights, setFlights] = useState([]);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [adminOpen, setAdminOpen] = useState(false);
            
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_model') || 'gemini-3.6-flash');
            const [pilotName, setPilotName] = useState(localStorage.getItem('pilot_name') || 'No Asignado');
            
            const [loggedFlightsCount, setLoggedFlightsCount] = useState(0);
            const [dailyLoggedFlightsCount, setDailyLoggedFlightsCount] = useState(0);
            const [shiftPeriod, setShiftPeriod] = useState('');
            const totalFlightsTarget = 8; 
            
            const [isRaining, setIsRaining] = useState(false);
            const [isFoggy, setIsFoggy] = useState(false);
            const [windDataMap, setWindDataMap] = useState({});
            const [rainProbMap, setRainProbMap] = useState({});

            const [audioUnlocked, setAudioUnlocked] = useState(false);
            
            const audioUnlockedRef = useRef(false);
            const flightsRef = useRef([]);
            const isRainingRef = useRef(false);
            const isFoggyRef = useRef(false);
            const windDataMapRef = useRef({});
            const shiftPeriodRef = useRef('');
            const dailyPeriodRef = useRef('');

            useEffect(() => {
                let unsubscribe = () => {};
                firebase.auth().signInAnonymously().then(() => {
                    unsubscribe = db.collection('operaciones').doc('turno_actual').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.flights) {
                                setFlights(data.flights);
                                flightsRef.current = data.flights;
                            }
                            if (data.loggedFlightsCount !== undefined) setLoggedFlightsCount(data.loggedFlightsCount);
                            
                            if (data.dailyLoggedFlightsCount !== undefined) {
                                setDailyLoggedFlightsCount(data.dailyLoggedFlightsCount);
                            } else if (data.loggedFlightsCount !== undefined) {
                                setDailyLoggedFlightsCount(data.loggedFlightsCount);
                            }

                            if (data.isRaining !== undefined) {
                                setIsRaining(data.isRaining);
                                isRainingRef.current = data.isRaining;
                            }
                            if (data.isFoggy !== undefined) {
                                setIsFoggy(data.isFoggy);
                                isFoggyRef.current = data.isFoggy;
                            }
                            if (data.windDataMap) {
                                setWindDataMap(data.windDataMap);
                                windDataMapRef.current = data.windDataMap;
                            }
                            if (data.rainProbMap) setRainProbMap(data.rainProbMap);
                            if (data.pilotName) {
                                setPilotName(data.pilotName);
                                localStorage.setItem('pilot_name', data.pilotName);
                            }
                            if (data.shiftPeriod) {
                                setShiftPeriod(data.shiftPeriod);
                                shiftPeriodRef.current = data.shiftPeriod;
                            }
                            if (data.dailyPeriod) {
                                dailyPeriodRef.current = data.dailyPeriod;
                            }
                        }
                    }, (err) => console.error("Error leyendo datos:", err));
                }).catch((error) => console.error("Error Auth:", error));
                return () => unsubscribe();
            }, []);

            useEffect(() => { audioUnlockedRef.current = audioUnlocked; }, [audioUnlocked]);

            const speak = (text) => {
                if (audioUnlockedRef.current && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    utterance.volume = 1.0; 
                    window.speechSynthesis.speak(utterance);
                }
            };

            const unlockAudio = () => {
                if (!audioUnlocked) {
                    setAudioUnlocked(true);
                    audioUnlockedRef.current = true;
                    const u = new SpeechSynthesisUtterance("Sistema de voz en línea al máximo volumen.");
                    u.lang = 'es-MX'; 
                    u.volume = 1.0;
                    window.speechSynthesis.speak(u);
                }
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                    // Máquina del tiempo
                    let shiftDate = new Date(now);
                    if (h < 7) { shiftDate.setDate(shiftDate.getDate() - 1); } 
                    
                    const isDayShift = (h >= 7 && h < 19);
                    const shiftType = isDayShift ? 'DIA' : 'NOCHE';
                    
                    const currentShiftPeriod = `${shiftDate.getFullYear()}-${shiftDate.getMonth()}-${shiftDate.getDate()}-${shiftType}`;
                    const strictCalendarDayPeriod = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`; // Esto cambia exacto a las 12:00 AM

                    let updates = {};
                    let needsUpdate = false;

                    // Reinicio de TURNO (7 AM y 7 PM)
                    if (shiftPeriodRef.current && shiftPeriodRef.current !== currentShiftPeriod) {
                        shiftPeriodRef.current = currentShiftPeriod;
                        updates.loggedFlightsCount = 0;
                        updates.shiftPeriod = currentShiftPeriod;
                        needsUpdate = true;
                        speak(`Atención. Cambio de turno detectado. Contador de turno reiniciado a cero.`);
                    } else if (!shiftPeriodRef.current) {
                         shiftPeriodRef.current = currentShiftPeriod;
                    }

                    // Reinicio GLOBAL (12:00 AM Medianoche estricta)
                    if (dailyPeriodRef.current && dailyPeriodRef.current !== strictCalendarDayPeriod) {
                        dailyPeriodRef.current = strictCalendarDayPeriod;
                        updates.dailyLoggedFlightsCount = 0;
                        updates.dailyPeriod = strictCalendarDayPeriod;
                        needsUpdate = true;
                        if (h === 0 && m === 0) {
                            speak(`Atención. Inicio de nuevo día operativo. Contador global reiniciado a cero.`);
                        }
                    } else if (!dailyPeriodRef.current) {
                         dailyPeriodRef.current = strictCalendarDayPeriod;
                    }

                    if (needsUpdate) {
                        db.collection('operaciones').doc('turno_actual').set(updates, { merge: true });
                    }

                    setShiftName(isDayShift ? 'Turno Diurno' : 'Turno Nocturno');
                    
                    // Alertas habladas
                    if (s === 0) { 
                        if ((h === 7 && m === 0) || (h === 19 && m === 0)) {
                            autoAssignPilot();
                            speak("Iniciando escaneo de plantilla de personal. Asignando nuevo piloto en turno.");
                        }

                        if (h === 7 && m === 50) {
                            speak("Atención. Inicio de junta operativa shop floor. Ventana de vuelo bloqueada hasta las 8 15.");
                        }
                        else if (h === 12 && m === 0) {
                            speak("Atención comandante. Es hora de elaborar los reportes de capé i y actualizar el clima.");
                        }

                        if (m === 0 && (isRainingRef.current || isFoggyRef.current || (windDataMapRef.current[h] >= 40))) {
                            speak("Atención piloto. Es hora de tomar evidencia fotográfica de las condiciones meteorológicas adversas.");
                        }

                        if (flightsRef.current && flightsRef.current.length > 0 && !isRainingRef.current && !isFoggyRef.current) {
                            flightsRef.current.forEach(flight => {
                                // Alarmas operativas a los 10min, 5min y hora del despegue exacto sin restringir por turno
                                if (flight.wind < 42) {
                                    let flightDate = new Date();
                                    flightDate.setHours(flight.hour24, flight.min, 0, 0);
                                    
                                    let warn10 = new Date(flightDate.getTime() - 10 * 60000);
                                    let warn5 = new Date(flightDate.getTime() - 5 * 60000);
                                    
                                    let w10Str = `${String(warn10.getHours()).padStart(2, '0')}:${String(warn10.getMinutes()).padStart(2, '0')}`;
                                    let w5Str = `${String(warn5.getHours()).padStart(2, '0')}:${String(warn5.getMinutes()).padStart(2, '0')}`;
                                    let takeoffStr = `${String(flightDate.getHours()).padStart(2, '0')}:${String(flightDate.getMinutes()).padStart(2, '0')}`;
                                    
                                    if (timeStr === w10Str) speak(`Atención piloto. Faltan 10 minutos para el vuelo programado a las ${flight.time}.`);
                                    if (timeStr === w5Str) speak(`Faltan 5 minutos para el despegue de las ${flight.time}. Prepárese.`);
                                    if (timeStr === takeoffStr) speak(`Atención. Es la hora exacta del despegue programado a las ${flight.time}. Buen vuelo.`);
                                }
                            });
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const autoAssignPilot = (jsonData = null) => {
                try {
                    const rawData = jsonData || localStorage.getItem('zoho_schedule');
                    if (!rawData) return;
                    
                    const json = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                    if (!json || json.length === 0) return;

                    const now = new Date();
                    const h = now.getHours();
                    
                    let targetDate = new Date(now);
                    if (h < 7) { targetDate.setDate(targetDate.getDate() - 1); }

                    const isDayShift = h >= 7 && h < 19;
                    const targetDay = String(targetDate.getDate()); 
                    
                    let foundName = null;
                    const dateRegex = new RegExp(`(^|\\D)0?${targetDay}(\\D|$)`, 'i');

                    let dateColIdx = -1;
                    
                    for(let r=0; r < Math.min(json.length, 30); r++) {
                        if(!json[r]) continue;
                        for(let c=0; c < json[r].length; c++) {
                            const cellVal = String(json[r][c] || '').trim();
                            if(dateRegex.test(cellVal) && cellVal.length <= 15) {
                                dateColIdx = c;
                                break;
                            }
                        }
                        if(dateColIdx !== -1) break;
                    }

                    if(dateColIdx !== -1) {
                        for(let r=0; r < json.length; r++) {
                            const cellVal = String(json[r][dateColIdx] || '').toLowerCase().trim();
                            
                            const isDay = cellVal.includes("6:50") || cellVal.includes("06:50") || cellVal.includes("7:00") || cellVal === "d";
                            const isNight = cellVal.includes("18:50") || cellVal.includes("19:00") || cellVal === "n" || cellVal.includes("a 7");
                            
                            if((isDayShift && isDay) || (!isDayShift && isNight)) {
                                for(let c=0; c < json[r].length; c++) {
                                    if(c === dateColIdx) continue; 
                                    
                                    let cellStr = String(json[r][c] || '').trim();
                                    cellStr = cellStr.replace(/^[0-9\s-]+/, ''); 
                                    
                                    if(cellStr.length >= 3 && /[a-zA-Z]{3,}/.test(cellStr)) {
                                        const lower = cellStr.toLowerCase();
                                        // LISTA NEGRA ACTUALIZADA (Sin la palabra "piloto")
                                        const blacklist = ["turno", "empleado", "departamento", "puesto", "operador", "nombre", "descanso", "ausente", "fecha", "6:50", "18:50", "19:00", "7:00", "a 7", "am", "pm", "published", "draft", "scheduled", "approved"];
                                        
                                        if(!blacklist.some(b => lower.includes(b))) {
                                            foundName = cellStr;
                                            break;
                                        }
                                    }
                                }
                            }
                            if(foundName) break;
                        }
                    }

                    if (!foundName) {
                        for (let r = 0; r < json.length; r++) {
                            if (!json[r]) continue;
                            
                            let hasDate = false;
                            let hasShift = false;
                            
                            for (let c = 0; c < json[r].length; c++) {
                                const cellStr = String(json[r][c] || '').toLowerCase().trim();
                                if (dateRegex.test(cellStr)) hasDate = true;
                                if (isDayShift && (cellStr.includes("6:50") || cellStr.includes("7:00"))) hasShift = true;
                                if (!isDayShift && (cellStr.includes("18:50") || cellStr.includes("19:00") || cellStr.includes("a 7"))) hasShift = true;
                            }
                            
                            if (hasDate && hasShift) {
                                for (let c = 0; c < json[r].length; c++) {
                                    let nameCandidate = String(json[r][c] || '').trim();
                                    nameCandidate = nameCandidate.replace(/^[0-9\s-]+/, ''); 
                                    
                                    if (nameCandidate.length >= 3 && /[a-zA-Z]{3,}/.test(nameCandidate)) {
                                        const lower = nameCandidate.toLowerCase();
                                        // LISTA NEGRA ACTUALIZADA
                                        const blacklist = ["turno", "empleado", "departamento", "puesto", "operador", "nombre", "descanso", "ausente", "fecha", "6:50", "18:50", "19:00", "7:00", "a 7", "published", "draft", "scheduled", "approved"];
                                        
                                        if (!blacklist.some(b => lower.includes(b)) && !dateRegex.test(lower)) {
                                            foundName = nameCandidate;
                                            break;
                                        }
                                    }
                                }
                            }
                            if (foundName) break;
                        }
                    }

                    if (foundName) {
                        foundName = foundName.toLowerCase().replace(/\b\w/g, l => l.toUpperCase()).trim();
                        setPilotName(foundName);
                        db.collection('operaciones').doc('turno_actual').set({ pilotName: foundName }, { merge: true });
                        localStorage.setItem('pilot_name', foundName);
                    } else {
                        const fallbackName = isDayShift ? "No Asignado" : "No Asignado";
                        setPilotName(fallbackName);
                        db.collection('operaciones').doc('turno_actual').set({ pilotName: fallbackName }, { merge: true });
                        localStorage.setItem('pilot_name', fallbackName);
                    }
                } catch (err) {
                    console.error("Error en Zoho Scanner:", err);
                }
            };

            const handleZohoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                speak("Procesando archivo CSV con motor doble núcleo.");
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                        
                        localStorage.setItem('zoho_schedule', JSON.stringify(json));
                        autoAssignPilot(json);
                        
                    } catch(err) {
                        speak("Error al leer el archivo de excel.");
                    }
                };
                reader.readAsBinaryString(file);
                setAdminOpen(false);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!geminiKey || geminiKey.trim() === '') {
                    speak("Falta la llave de la inteligencia artificial.");
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    analyzeImageWithAI(base64Data);
                };
                reader.readAsDataURL(file);
            };

            const analyzeImageWithAI = async (base64Image) => {
                setIsScanning(true);
                speak("Analizando el clima avanzado. Detectando vientos y probabilidad de lluvia.");
                
                try {
                    const key = geminiKey.trim();
                    const model = geminiModel.trim() || 'gemini-3.6-flash';
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                    
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Analiza el clima. REGLAS: Si solo dice 'UV' ES APTO PARA VOLAR, viento es 0. Si dice 'Apto para volar', viento es 0. Si dice 'Ráfagas fuertes' o vientos > 40, viento es 45. EXTRAE LA PROBABILIDAD DE PRECIPITACIÓN/LLUVIA. Devuelve JSON ESTRICTO con 'hourlyData' teniendo 'time' (ej. '11:00am'), 'wind' numérico y 'rainProb' numérico (0 a 100)." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    };

                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error("Error de API");

                    const data = await response.json();
                    let aiResponseText = data.candidates[0].content.parts[0].text;
                    if (aiResponseText.startsWith('```json')) aiResponseText = aiResponseText.replace(/```json\n?/, '').replace(/```\n?$/, '');
                    
                    const parsedData = JSON.parse(aiResponseText);
                    if (parsedData && parsedData.hourlyData) {
                         generateIntelligentSchedule(parsedData.hourlyData);
                         speak("Itinerario generado exitosamente. 16 vuelos programados para las 24 horas.");
                    } else throw new Error("Formato incorrecto.");
                } catch (error) {
                    console.error("AI Error:", error);
                    speak("Error al procesar. Intentando modo seguro de vuelos.");
                    generateIntelligentSchedule([]); 
                } finally {
                    setIsScanning(false);
                }
            };

            const generateIntelligentSchedule = (hourlyWeatherData) => {
                let windMap = {}; let rainMap = {};
                for(let i=0; i<24; i++) { windMap[i] = 0; rainMap[i] = 0; }

                if (hourlyWeatherData && hourlyWeatherData.length > 0) {
                     hourlyWeatherData.forEach(dp => {
                          let match = dp.time.match(/(\d+):00([ap]m)/i);
                          if (match) {
                               let h = parseInt(match[1]);
                               let ampm = match[2].toLowerCase();
                               if (ampm === 'pm' && h < 12) h += 12;
                               if (ampm === 'am' && h === 12) h = 0;
                               windMap[h] = dp.wind || 0;
                               rainMap[h] = dp.rainProb || 0;
                          }
                     });
                }

                setWindDataMap(windMap); setRainProbMap(rainMap);
                db.collection('operaciones').doc('turno_actual').set({ windDataMap: windMap, rainProbMap: rainMap }, { merge: true });

                const applyVariance = (timeStr, isForzoso = false) => {
                    if (isForzoso) return timeStr; 
                    let parts = timeStr.split(':');
                    let h = parseInt(parts[0]);
                    let m = parseInt(parts[1]);
                    
                    let variance = Math.floor(Math.random() * 16) + 10; 
                    let timeInMins = h * 60 + m + variance;

                    const blocks = [
                        { start: 6*60 + 45, end: 7*60 + 15 },   
                        { start: 7*60 + 50, end: 8*60 + 15 },   
                        { start: 18*60 + 45, end: 19*60 + 15 }  
                    ];

                    for (let b of blocks) {
                        if (timeInMins >= b.start && timeInMins <= b.end) timeInMins = b.end + 15;
                    }

                    return `${String(Math.floor(timeInMins / 60) % 24).padStart(2, '0')}:${String(timeInMins % 60).padStart(2, '0')}`;
                };

                // REGLAS FORZOSAS DEFINITIVAS ACTUALIZADAS (14:00, 17:00, etc)
                let baseSchedule = [
                    // TURNO DIURNO (7:00 am - 7:00 pm) 
                    { time: applyVariance("07:20", true), type: "FORZOSO", hour24: 7 }, 
                    { time: applyVariance("08:45"), type: "DINÁMICO", hour24: 8 },
                    { time: applyVariance("10:15"), type: "DINÁMICO", hour24: 10 },
                    { time: applyVariance("11:45"), type: "DINÁMICO", hour24: 11 },
                    { time: applyVariance("13:15"), type: "DINÁMICO", hour24: 13 },
                    { time: applyVariance("14:00", true), type: "FORZOSO", hour24: 14 },
                    { time: applyVariance("15:30"), type: "DINÁMICO", hour24: 15 },
                    { time: applyVariance("17:00", true), type: "FORZOSO", hour24: 17 },

                    // TURNO NOCTURNO (7:00 pm - 7:00 am) 
                    { time: applyVariance("19:25", true), type: "FORZOSO", hour24: 19 }, 
                    { time: applyVariance("21:30", true), type: "FORZOSO", hour24: 21 },
                    { time: applyVariance("23:15"), type: "DINÁMICO", hour24: 23 },
                    { time: applyVariance("00:45"), type: "DINÁMICO", hour24: 0 },
                    { time: applyVariance("02:15"), type: "DINÁMICO", hour24: 2 },
                    { time: applyVariance("03:45"), type: "DINÁMICO", hour24: 3 },
                    { time: applyVariance("05:00"), type: "DINÁMICO", hour24: 5 },
                    { time: applyVariance("06:00", true), type: "FORZOSO", hour24: 6 }
                ];

                const finalSchedule = baseSchedule.map(f => {
                    let h24 = parseInt(f.time.split(':')[0]);
                    return { ...f, min: parseInt(f.time.split(':')[1]), hour24: h24, wind: windMap[h24] >= 40 ? 45 : (windMap[h24] || 0), rainProb: rainMap[h24] || 0 };
                });

                setFlights(finalSchedule); flightsRef.current = finalSchedule;
                db.collection('operaciones').doc('turno_actual').set({ flights: finalSchedule }, { merge: true });
            };

            const handleLogManualFlight = () => {
                 if (isRaining || isFoggy) return;
                 const newCount = Math.min(loggedFlightsCount + 1, 8);
                 const newDailyCount = dailyLoggedFlightsCount + 1;
                 
                 setLoggedFlightsCount(newCount);
                 setDailyLoggedFlightsCount(newDailyCount);
                 
                 db.collection('operaciones').doc('turno_actual').set({ 
                     loggedFlightsCount: newCount,
                     dailyLoggedFlightsCount: newDailyCount
                 }, { merge: true });
                 
                 if(newCount <= totalFlightsTarget) {
                    speak(`Vuelo registrado. ${newCount} de ${totalFlightsTarget}.`);
                 }
            };

            const undoLastFlight = () => {
                if (dailyLoggedFlightsCount > 0) {
                    const newCount = Math.max(0, loggedFlightsCount - 1);
                    const newDailyCount = Math.max(0, dailyLoggedFlightsCount - 1);
                    setLoggedFlightsCount(newCount);
                    setDailyLoggedFlightsCount(newDailyCount);
                    db.collection('operaciones').doc('turno_actual').set({ 
                        loggedFlightsCount: newCount,
                        dailyLoggedFlightsCount: newDailyCount
                    }, { merge: true });
                }
            };

            const currentH = currentTime.getHours();
            const currentM = currentTime.getMinutes();
            let elapsedNowMins = (currentH >= 7 ? (currentH - 7) : (currentH + 17)) * 60 + currentM;

            // Filtro Maestro: Muestra TODOS los vuelos futuros en el bloque operativo de 24h
            const futureFlights = flights.filter(f => {
                let flightElapsedMins = (f.hour24 >= 7 ? (f.hour24 - 7) : (f.hour24 + 17)) * 60 + f.min;
                return flightElapsedMins >= (elapsedNowMins - 15);
            });

            return (
                <div className="min-h-screen p-4 w-full max-w-[400px] mx-auto pb-32" onClick={unlockAudio}>
                    
                    <div className="flex justify-between items-center mb-5">
                        <div className="flex items-center gap-2">
                            <img src="Walross_Rojo_B (1).png" alt="Logo" className="h-8 object-contain bg-white rounded p-1" />
                            <h1 className="text-lg font-black tracking-tight">
                                DISPATCHER
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); setAdminOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">👨‍💼</button>
                            <button onClick={(e) => { e.stopPropagation(); setSettingsOpen(true); }} className="bg-[#1f2937] hover:bg-[#374151] p-2 rounded-lg border border-slate-700">⚙️</button>
                        </div>
                    </div>

                    {!audioUnlocked && (
                        <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 text-xs font-bold text-center p-2 rounded-lg mb-4 animate-pulse">
                            🔇 Toca cualquier parte para activar Voz
                        </div>
                    )}

                    <div className="glass-card p-4 rounded-2xl mb-4 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1">{shiftName}</p>
                                <h2 className="text-xl font-black text-white">{shiftName === 'Turno Diurno' ? '☀️ Día' : '🌙 Noche'}</h2>
                                <div className="mt-1 text-2xl font-mono font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className="mt-2 inline-flex items-center bg-[#1e1b4b] border border-indigo-500/50 text-indigo-300 text-[10px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest truncate max-w-[200px]">
                                    👨‍✈️ PILOTO: {pilotName}
                                </div>
                            </div>
                            
                            <div className="flex flex-col gap-2 items-end">
                                {/* Medidor TURNO XL */}
                                <div className="flex items-center bg-[#0f172a] border border-indigo-900/50 rounded-xl overflow-hidden shadow-lg w-[140px]">
                                    <div className="px-2 py-2 bg-indigo-900/20 flex items-center justify-center border-r border-indigo-900/50 w-14">
                                        <span className="text-[9px] font-black text-indigo-400 uppercase tracking-wider">Turno</span>
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center text-center py-2">
                                        <p className="text-[7px] font-black uppercase text-slate-500 leading-none mb-1">Faltan</p>
                                        <div className="text-lg font-black text-white leading-none">{Math.max(0, 8 - loggedFlightsCount)}</div>
                                    </div>
                                    <div className="flex items-baseline justify-center gap-0.5 bg-indigo-900/40 px-2 py-2 border-l border-indigo-900/50 w-16">
                                        <span className="text-2xl font-black text-white leading-none">{loggedFlightsCount}</span>
                                        <span className="text-xs font-bold text-indigo-400">/8</span>
                                    </div>
                                </div>

                                {/* Medidor DÍA GLOBAL XL */}
                                <div className="flex items-center bg-[#0f172a] border border-emerald-900/40 rounded-xl overflow-hidden shadow-lg w-[140px]">
                                    <div className="px-2 py-2 bg-emerald-900/10 flex items-center justify-center border-r border-emerald-900/40 w-14">
                                        <span className="text-[9px] font-black text-emerald-500 uppercase tracking-wider">Día</span>
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center text-center py-2">
                                        <p className="text-[7px] font-black uppercase text-slate-500 leading-none mb-1">Faltan</p>
                                        <div className="text-lg font-black text-white leading-none">{Math.max(0, 16 - dailyLoggedFlightsCount)}</div>
                                    </div>
                                    <div className="flex items-baseline justify-center gap-0.5 bg-emerald-900/20 px-2 py-2 border-l border-emerald-900/40 w-16">
                                        <span className="text-2xl font-black text-emerald-400 leading-none">{dailyLoggedFlightsCount}</span>
                                        <span className="text-xs font-bold text-emerald-600">/16</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex flex-col gap-2 mt-4 border-t border-slate-800 pt-4">
                            <input type="file" id="upload" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            <button onClick={(e) => { e.stopPropagation(); document.getElementById('upload').click(); }} disabled={isScanning || isRaining || isFoggy} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-2 ${isScanning ? 'bg-indigo-900/50 text-indigo-300 animate-pulse' : 'bg-[#1e293b] hover:bg-[#334155] text-white border border-slate-700'}`}>
                                {isScanning ? '⏳ Analizando...' : '📸 CLIMA'}
                            </button>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={(e) => { e.stopPropagation(); setIsRaining(!isRaining); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isRaining ? 'bg-emerald-600 text-white' : 'bg-rose-900/40 text-rose-400 border border-rose-900'}`}>
                                    {isRaining ? '☀️ REANUDAR' : '🌧️ LLUVIA'}
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); setIsFoggy(!isFoggy); }} className={`w-full py-3 rounded-xl font-bold text-xs flex justify-center items-center gap-1 ${isFoggy ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 border border-slate-500'}`}>
                                    {isFoggy ? '☀️ DESPEJADO' : '🌫️ NEBLINA'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {isRaining && <div className="bg-rose-600 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">⚠️ SUSPENDIDO POR LLUVIA</div>}
                    {isFoggy && !isRaining && <div className="bg-slate-500 text-white text-center p-2.5 rounded-xl mb-4 font-black uppercase text-xs animate-pulse">🌫️ VISIBILIDAD NULA</div>}

                    <div className={`glass-card p-4 rounded-2xl mb-6 relative ${(isRaining || isFoggy) ? 'opacity-50 pointer-events-none' : ''}`}>
                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-3 flex justify-between">
                            <span>🗓️ PLAN RESTANTE DEL DÍA</span>
                            <span className="text-indigo-400">({futureFlights.length} VUELOS)</span>
                        </p>
                        {flights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-slate-500">Sube captura para generar.</div>
                        ) : futureFlights.length === 0 ? (
                            <div className="text-center py-6 text-xs font-bold text-emerald-500">✅ Todos los vuelos del día completados.</div>
                        ) : (
                            <div className="space-y-2">
                                {futureFlights.map((f, i) => (
                                    <div key={i} className={`flex justify-between items-center p-2.5 bg-[#0f172a] border rounded-xl ${f.wind >= 42 ? 'border-rose-900/50' : 'border-slate-800'}`}>
                                        <div>
                                            <div className="text-base font-black text-white flex items-center gap-2">
                                                {f.time}
                                                <span className="text-[9px] font-normal text-slate-500">
                                                    {f.hour24 >= 7 && f.hour24 < 19 ? '(Día)' : '(Noche)'}
                                                </span>
                                            </div>
                                            <div className="flex gap-2 items-center mt-0.5">
                                                <div className={`text-[9px] font-bold uppercase ${f.wind >= 42 ? 'text-rose-500' : 'text-emerald-400'}`}>
                                                    {f.wind >= 42 ? `🚫 Susp. (${f.wind}k)` : `✅ Libre (${f.wind}k)`}
                                                </div>
                                                {f.rainProb > 0 && <div className="text-[9px] font-bold uppercase text-cyan-400">☔ {f.rainProb}% Lluvia</div>}
                                            </div>
                                        </div>
                                        <span className={`text-[8px] font-black uppercase px-2 py-1 rounded border ${f.type === 'FORZOSO' ? 'bg-indigo-950 text-indigo-400 border-indigo-900' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                                            {f.type}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {}
                    <div className="fixed bottom-0 left-0 w-full p-4 bg-[#0B0F19] flex justify-center items-center gap-2 z-40 border-t border-slate-800">
                        <div className="w-full max-w-[400px] mx-auto flex gap-2">
                             <button onClick={(e) => { e.stopPropagation(); handleLogManualFlight(); }} disabled={isRaining || isFoggy} className={`flex-1 font-black py-4 rounded-xl text-sm ${isRaining || isFoggy ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_15px_rgba(79,70,229,0.3)]'}`}>
                                 🚀 REGISTRAR VUELO
                             </button>
                             <button onClick={(e) => { e.stopPropagation(); undoLastFlight(); }} className="bg-rose-950 hover:bg-rose-900 text-rose-400 font-black py-4 px-5 rounded-xl border border-rose-900 text-sm">
                                 -1
                             </button>
                        </div>
                    </div>

                    {settingsOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5 shadow-2xl">
                                <h2 className="text-base font-black text-white mb-4">⚙️ Ajustes de IA</h2>
                                <input type="password" value={geminiKey} onChange={e => setGeminiKey(e.target.value)} placeholder="Llave Secreta API" className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-3 text-white mb-4 text-sm" />
                                <div className="flex gap-2">
                                    <button onClick={() => setSettingsOpen(false)} className="flex-1 bg-slate-800 text-white font-bold py-3 rounded-lg text-xs">Cancelar</button>
                                    <button onClick={() => { localStorage.setItem('gemini_key', geminiKey); setSettingsOpen(false); }} className="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg text-xs">Guardar Llave</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {adminOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={(e) => e.stopPropagation()}>
                            <div className="bg-[#131826] border border-slate-800 rounded-2xl w-full max-w-[320px] p-5 shadow-2xl">
                                <h2 className="text-base font-black text-indigo-400 mb-2 flex items-center gap-2">👨‍💼 Administrador</h2>
                                <p className="text-[10px] text-slate-400 mb-5 leading-relaxed">Sube el reporte semanal de Zoho Shifts. El sistema auto-asignará al piloto correcto cada turno.</p>
                                <input type="file" id="zohoUpload" accept=".csv, .xlsx" className="hidden" onChange={handleZohoUpload} />
                                <button onClick={() => document.getElementById('zohoUpload').click()} className="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-lg text-xs mb-5 shadow-[0_0_10px_rgba(4,120,87,0.3)]">
                                    📗 SUBIR REPORTE ZOHO
                                </button>
                                
                                <div className="mb-5 pt-5 border-t border-slate-800">
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-2">Corrección Manual de Piloto</label>
                                    <input type="text" value={pilotName} onChange={(e) => { setPilotName(e.target.value); db.collection('operaciones').doc('turno_actual').set({ pilotName: e.target.value }, { merge: true }); localStorage.setItem('pilot_name', e.target.value); }} placeholder="Ej. Miguel, Ricardo..." className="w-full bg-[#1e293b] border border-slate-700 rounded-lg p-3 text-white text-sm" />
                                </div>
                                <button onClick={() => setAdminOpen(false)} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg text-xs">Cerrar Panel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
