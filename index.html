<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Pro - V44 Final AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F111A; color: white; margin: 0; padding: 0; }
        .glass-panel { background: rgba(30, 33, 43, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; backdrop-filter: blur(10px); }
        .neon-text { text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .zone-alert { border-left: 4px solid #f59e0b; }
        .ai-glow { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [pilotName, setPilotName] = useState("Cargando...");
            const [dailyFlightCount, setDailyFlightCount] = useState(0); 
            const [flights, setFlights] = useState([]);
            const flightsRef = useRef([]);
            const [showAdmin, setShowAdmin] = useState(false);
            
            // Estados Tácticos y Climáticos
            const [weather, setWeather] = useState({ wind: 0, rainProb: 0, willCompress: false, compressHour: 0 });
            const [isEmergency, setIsEmergency] = useState(false);
            const [emergencyType, setEmergencyType] = useState("");
            const [isLoadingWeather, setIsLoadingWeather] = useState(false);
            
            // Nagging Alert (Insistencia Nocturna)
            const [needsOkToFly, setNeedsOkToFly] = useState(false);

            const maxDailyFlights = 16;
            const maxShiftFlights = 8;
            const isNightShift = currentTime.getHours() >= 19 || currentTime.getHours() < 7;
            
            const speak = (text) => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.volume = 1;
                    utterance.rate = 1.05;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const applyAntiCollision = (timeMins) => {
                let time = timeMins % 1440; // Minutos del día (0 - 1439)
                let offset = Math.floor(timeMins / 1440) * 1440; 
                
                // ZONAS PROHIBIDAS
                // 1. Cambio de Turno AM: 06:45 a 07:15 (405 - 435) -> Empuja a 07:20
                if (time >= 405 && time <= 435) time = 440; 
                // 2. Junta Shopfloor: 07:50 a 08:15 (470 - 495) -> Empuja a 08:20
                else if (time >= 470 && time <= 495) time = 500; 
                // 3. Cambio de Turno PM: 18:45 a 19:15 (1125 - 1155) -> Empuja a 19:25
                else if (time >= 1125 && time <= 1155) time = 1165; 

                return offset + time;
            };

            const generateIntelligentSchedule = (isCompressing = false, compHour = 0, rain = 0) => {
                const now = new Date();
                const activeIsNight = now.getHours() >= 19 || now.getHours() < 7;
                let activeSchedule = [];

                // MOTOR DE VARIANZA ALEATORIA (+/- 10 a 25 mins)
                const applyVariance = (baseTimeStr) => {
                    let [h, m] = baseTimeStr.split(':').map(Number);
                    let totalMins = h * 60 + m;
                    
                    let variance = Math.floor(Math.random() * 16) + 10; // 10 a 25 mins
                    let sign = Math.random() > 0.5 ? 1 : -1;
                    totalMins += (variance * sign);

                    // Pasa por el filtro anti-colisión antes de asignarse
                    let safeMins = applyAntiCollision(totalMins);

                    let newH = Math.floor((safeMins % 1440) / 60);
                    let newM = (safeMins % 1440) % 60;
                    return `${newH.toString().padStart(2, '0')}:${newM.toString().padStart(2, '0')}`;
                };

                if (!activeIsNight) {
                    if (isCompressing && compHour <= 11) {
                        // Compresión Matutina Fuerte (5 vuelos antes de mal clima)
                        activeSchedule = [
                            { time: "07:20", type: "FORZOSO" },
                            { time: "08:20", type: "COMPRIMIDO" }, // Post-shopfloor
                            { time: "09:05", type: "COMPRIMIDO" },
                            { time: "09:50", type: "COMPRIMIDO" },
                            { time: "10:35", type: "COMPRIMIDO" },
                            { time: "14:00", type: "FORZOSO" },
                            { time: applyVariance("15:30"), type: "DINÁMICO" },
                            { time: "17:00", type: "FORZOSO" }
                        ];
                    } else if (isCompressing && compHour > 11) {
                        // Compresión Extendida
                        activeSchedule = [
                            { time: "07:20", type: "FORZOSO" },
                            { time: "08:20", type: "COMPRIMIDO" },
                            { time: "09:10", type: "COMPRIMIDO" },
                            { time: "10:00", type: "COMPRIMIDO" },
                            { time: "10:50", type: "COMPRIMIDO" },
                            { time: "11:40", type: "COMPRIMIDO" },
                            { time: "14:00", type: "FORZOSO" },
                            { time: "17:00", type: "FORZOSO" }
                        ];
                    } else {
                        // Normal Diurno (Varianza aleatoria)
                        activeSchedule = [
                            { time: "07:20", type: "FORZOSO" },
                            { time: applyVariance("09:00"), type: "DINÁMICO" },
                            { time: applyVariance("10:30"), type: "DINÁMICO" },
                            { time: applyVariance("12:00"), type: "DINÁMICO" },
                            { time: "14:00", type: "FORZOSO" },
                            { time: applyVariance("15:30"), type: "DINÁMICO" },
                            { time: "17:00", type: "FORZOSO" },
                            { time: applyVariance("18:20"), type: "DINÁMICO" } // Antes de 18:45
                        ];
                    }
                } else {
                    // Turno Nocturno
                    activeSchedule = [
                        { time: "19:25", type: "FORZOSO" },
                        { time: "21:30", type: "FORZOSO" },
                        { time: applyVariance("23:00"), type: "DINÁMICO" },
                        { time: applyVariance("00:30"), type: "DINÁMICO" },
                        { time: applyVariance("02:00"), type: "DINÁMICO" },
                        { time: applyVariance("03:30"), type: "DINÁMICO" },
                        { time: applyVariance("04:45"), type: "DINÁMICO" },
                        { time: "06:00", type: "FORZOSO" }
                    ];
                }

                const finalSchedule = activeSchedule.map(f => {
                    let [h, m] = f.time.split(':').map(Number);
                    return { ...f, hour24: h, min: m, status: 'PENDIENTE', probLluvia: rain };
                });

                setFlights(finalSchedule);
                flightsRef.current = finalSchedule;
            };

            const handleWeatherAIUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setNeedsOkToFly(false); // Apaga la alarma insistente
                setIsLoadingWeather(true);
                setShowAdmin(false);
                speak("Procesando imagen de radar con Inteligencia Artificial Gemini. Por favor espere.");

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const base64Data = evt.target.result.split(',')[1];

                    const payload = {
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: "Analiza esta imagen del pronóstico del clima (radar/OK To Fly). Extrae: 1) La ráfaga de viento máxima pronosticada (en km/h). 2) La probabilidad máxima de lluvia (en porcentaje). 3) A qué hora (en formato 24h, solo el número, ej. 11 o 14) empieza el viento mayor a 40km/h si lo hay, de lo contrario devuelve 0. Devuelve un JSON exacto con las llaves: maxWind, maxRainProb, badWeatherHour." },
                                    {
                                        inlineData: { mimeType: file.type, data: base64Data }
                                    }
                                ]
                            }
                        ],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    maxWind: { type: "INTEGER" },
                                    maxRainProb: { type: "INTEGER" },
                                    badWeatherHour: { type: "INTEGER" }
                                }
                            }
                        }
                    };

                    try {
                        const apiKey = ""; // API Key proveída por el entorno Canvas
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const result = await response.json();
                        
                        if (result.candidates && result.candidates[0].content.parts[0].text) {
                            const data = JSON.parse(result.candidates[0].content.parts[0].text);
                            const willCompress = data.maxWind >= 40;
                            
                            setWeather({ wind: data.maxWind, rainProb: data.maxRainProb, willCompress: willCompress, compressHour: data.badWeatherHour });
                            
                            speak(`Análisis de Inteligencia Artificial completado. Viento máximo ${data.maxWind} kilómetros por hora. Probabilidad de lluvia ${data.maxRainProb} por ciento.`);
                            
                            if(willCompress) speak("Condiciones tácticas detectadas. Recalculando y comprimiendo itinerario de vuelos.");
                            
                            generateIntelligentSchedule(willCompress, data.badWeatherHour, data.maxRainProb);
                        }
                    } catch (error) {
                        console.error("Error AI:", error);
                        speak("Ocurrió un error al procesar la imagen del radar. Manteniendo itinerario actual.");
                    }
                    setIsLoadingWeather(false);
                };
                reader.readAsDataURL(file);
            };

            const autoAssignPilot = (csvText) => {
                if (!csvText) return;
                const rows = csvText.split('\n').map(row => row.split(',').map(c => c.replace(/["']/g, "").trim()));
                const today = new Date();
                let isNight = today.getHours() >= 19 || today.getHours() < 7;
                
                // Lógica de fechas
                let targetDate = new Date(today);
                if (today.getHours() >= 0 && today.getHours() < 7) {
                    targetDate.setDate(targetDate.getDate() - 1); // La madrugada pertenece al día anterior
                }
                let dayStr = targetDate.getDate().toString();
                
                // NUEVO ESCÁNER ZOHO MATRIZ/LISTA 3D
                const shiftKeyword = isNight ? "18:50" : "6:50"; 
                const blacklist = ["empleado", "operador", "turno", "descanso", "área", "departamento", "true", "false", "si", "no", "am", "pm", "nombre", "fecha", "piloto", "d", "n"];

                const isRealName = (text) => {
                    if (!text || text.length < 3) return false;
                    if (/\d/.test(text)) return false; 
                    if (text.includes(":") || text.includes("/") || text.includes("-")) return false;
                    if (blacklist.some(bad => text.toLowerCase() === bad)) return false;
                    return true;
                };

                // RegEx Inteligente "Anti-Gringo" (Encuentra 28-Jul, 7/28, etc)
                const dateRegex = new RegExp(`\\b0?${dayStr}\\b`);
                let foundName = "Piloto (Falla en Zoho)";
                let success = false;

                // ESTRATEGIA 1: LECTURA DE MATRIZ CLÁSICA (Fechas arriba, cruce hacia abajo)
                if (rows.length > 0) {
                    let colIndex = -1;
                    // Buscar la columna de hoy en las primeras dos filas
                    for(let r = 0; r < 2 && r < rows.length; r++){
                        for (let c = 0; c < rows[r].length; c++) {
                            if (dateRegex.test(rows[r][c])) { colIndex = c; break; }
                        }
                        if(colIndex !== -1) break;
                    }

                    if (colIndex !== -1) {
                        for (let r = 1; r < rows.length; r++) {
                            const rowStr = rows[r].join(" ").toLowerCase();
                            // Si en la fila cruzada encuentro el turno (6:50 o 18:50) o la D/N de respaldo
                            if (rowStr.includes(shiftKeyword) || (isNight ? rowStr.includes("n") : rowStr.includes("d"))) {
                                let cell = rows[r][colIndex];
                                if (isRealName(cell)) {
                                    foundName = cell.toUpperCase();
                                    success = true;
                                    break;
                                }
                            }
                        }
                    }
                }

                // ESTRATEGIA 2: LECTURA DE LISTA (Doble Check si la matriz falla)
                if (!success) {
                    for (let r = 0; r < rows.length; r++) {
                        const rowText = rows[r].join(" ").toLowerCase();
                        if (dateRegex.test(rowText) && rowText.includes(shiftKeyword)) {
                            // Leer en reversa ignorando basura
                            for (let c = rows[r].length - 1; c >= 0; c--) {
                                let cell = rows[r][c];
                                if (isRealName(cell)) {
                                    foundName = cell.toUpperCase();
                                    success = true;
                                    break;
                                }
                            }
                        }
                        if (success) break;
                    }
                }

                setPilotName(foundName);
            };

            useEffect(() => {
                // Recuperar estado al iniciar
                const savedOpDate = localStorage.getItem('dp_op_date');
                const getOpDate = () => {
                    const d = new Date();
                    if (d.getHours() < 7) d.setDate(d.getDate() - 1); 
                    return d.toDateString();
                };
                if (savedOpDate === getOpDate()) {
                    setDailyFlightCount(parseInt(localStorage.getItem('dp_daily_count') || "0"));
                } else {
                    localStorage.setItem('dp_op_date', getOpDate());
                    localStorage.setItem('dp_daily_count', 0);
                    setDailyFlightCount(0);
                }

                generateIntelligentSchedule();
                const savedCSV = localStorage.getItem('zoho_csv');
                if (savedCSV) autoAssignPilot(savedCSV);

                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    const h = now.getHours();
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    
                    const inEmergency = isEmergency || weather.wind > 40;

                    // REINICIO DE DÍA (7:00 AM) - Resetea el contador a 0/16
                    if (h === 7 && m === 0 && s === 0) {
                        setDailyFlightCount(0);
                        localStorage.setItem('dp_daily_count', 0);
                        localStorage.setItem('dp_op_date', now.toDateString());
                        generateIntelligentSchedule();
                        const csv = localStorage.getItem('zoho_csv');
                        if (csv) autoAssignPilot(csv);
                        speak("Iniciando operaciones del día. Contador general reiniciado a cero.");
                    }

                    // CAMBIO DE TURNO NOCTURNO (7:00 PM) - Mantiene el contador general
                    if (h === 19 && m === 0 && s === 0) {
                        generateIntelligentSchedule();
                        const csv = localStorage.getItem('zoho_csv');
                        if (csv) autoAssignPilot(csv);
                        speak("Cambio a turno nocturno. Iniciando escaneo de plantilla de personal. Asignando nuevo piloto en turno.");
                    }

                    // ALERTAS ADMINISTRATIVAS
                    if (h === 12 && m === 0 && s === 0 && !isEmergency) {
                        speak("Aviso administrativo. Son las 12 del día. Es estrictamente necesario generar los KPIs y actualizar la captura de pantalla de Ok To Fly.");
                    }

                    // NAGGING ALERT (Insistencia 12:05 AM para OK To Fly)
                    if (h === 0 && m === 5 && s === 0 && !isEmergency) {
                        setNeedsOkToFly(true);
                        speak("Alerta de protocolo. Son las 12:05 de la madrugada. Es obligatorio actualizar la captura de OK To Fly del radar y subirla al asistente.");
                    }
                    if (needsOkToFly && m % 5 === 0 && m !== 5 && s === 0) {
                        speak("Aviso reiterado. Actualización de radar pendiente. Por favor suba la captura de pantalla de Ok To Fly al sistema inmediatamente.");
                    }

                    if (m === 0 && s === 0 && inEmergency) {
                        speak("Atención piloto, debido a las condiciones adversas, es hora de tomar y subir la evidencia fotográfica del clima.");
                    }

                    // ALERTAS PRE-VUELO Y RECÁLCULO DINÁMICO
                    if (!isEmergency) {
                        let needsRecalculation = false;
                        let cMins = h * 60 + m;

                        flightsRef.current.forEach(f => {
                            if (f.status === 'COMPLETADO') return;

                            let fMins = f.hour24 * 60 + f.min;
                            let diff = fMins - cMins;
                            
                            if (now.getHours() >= 19 || now.getHours() < 7) {
                                if (diff < -12 * 60) diff += 24 * 60;
                                else if (diff > 12 * 60) diff -= 24 * 60;
                            }

                            if (diff === 10 && s === 0) speak(`Atención piloto, prevuelo en 10 minutos.`);
                            if (diff === 5 && s === 0) speak(`Atención, vuelo programado en 5 minutos. Preparar despegue.`);
                            
                            if (diff <= -5) needsRecalculation = true;
                        });

                        if (needsRecalculation) recalculateSchedule(h, m);
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, [isEmergency, weather, needsOkToFly]);

            const recalculateSchedule = (currentHour, currentMin) => {
                let currentList = [...flightsRef.current];
                let uncompleted = currentList.filter(f => f.status !== 'COMPLETADO');
                let completed = currentList.filter(f => f.status === 'COMPLETADO');

                if (uncompleted.length === 0) return;

                let nextStartMins = currentHour * 60 + currentMin + 10; // Empujar 10 mins desde ahora

                uncompleted = uncompleted.map((f, idx) => {
                    let safeMins = applyAntiCollision(nextStartMins);
                    let h = Math.floor((safeMins % 1440) / 60);
                    let m = (safeMins % 1440) % 60;
                    
                    nextStartMins = safeMins + 90; // Separación estricta de 90 mins a los siguientes
                    return { ...f, time: `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`, hour24: h, min: m, type: "RECALCULADO" };
                });

                const finalList = [...completed, ...uncompleted];
                setFlights(finalList);
                flightsRef.current = finalList;
                speak("Alerta. Vuelo retrasado. El sistema anti colisión ha intervenido y recalculado el itinerario esquivando zonas prohibidas.");
            };

            const handleZohoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    localStorage.setItem('zoho_csv', text);
                    autoAssignPilot(text);
                    setShowAdmin(false);
                    speak("Matriz de personal actualizada correctamente.");
                };
                reader.readAsText(file);
            };

            const handleLogFlight = () => {
                if (isEmergency) {
                    speak("Acción denegada. Las operaciones están suspendidas por protocolo de emergencia.");
                    return;
                }

                const remainingInShift = flights.filter(f => f.status !== 'COMPLETADO').length;
                if (remainingInShift === 0) return;

                const newDailyTotal = dailyFlightCount + 1;
                setDailyFlightCount(newDailyTotal);
                localStorage.setItem('dp_daily_count', newDailyTotal);
                
                const now = new Date();
                let currentMins = now.getHours() * 60 + now.getMinutes();
                let marked = false;
                let nextStartMins = currentMins; 

                const updatedFlights = flights.map(f => {
                    if (f.status === 'COMPLETADO') return f;
                    if (!marked) {
                        marked = true;
                        let realTimeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                        return { ...f, status: 'COMPLETADO', realTime: realTimeStr };
                    }

                    // Arrastre Dinámico - Reasigna a máx 90 mins desde la hora en que registraste
                    let safeMins = applyAntiCollision(nextStartMins + 90);
                    let h = Math.floor((safeMins % 1440) / 60);
                    let m = (safeMins % 1440) % 60;
                    nextStartMins = safeMins;

                    return { ...f, time: `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`, hour24: h, min: m, type: "DINÁMICO (ARRASTRE)" };
                });
                
                setFlights(updatedFlights);
                flightsRef.current = updatedFlights;
                speak("Vuelo registrado exitosamente. Arrastre de itinerario completado.");
            };

            const toggleEmergency = (type) => {
                if (isEmergency && emergencyType === type) {
                    setIsEmergency(false);
                    setEmergencyType("");
                    speak("Protocolo de emergencia desactivado. Condiciones óptimas restauradas. Retomando operaciones.");
                } else {
                    setIsEmergency(true);
                    setEmergencyType(type);
                    speak(`Alerta roja. Protocolo de emergencia por ${type} activado. Operaciones suspendidas. Todos los pilotos a zona segura de inmediato.`);
                }
            };

            const remainingFlightsShift = flights.filter(f => f.status !== 'COMPLETADO').length;

            return (
                <div className={`min-h-screen flex flex-col items-center p-4 pb-40 transition-colors duration-700 ${isEmergency ? 'bg-red-950' : 'bg-[#0F111A]'}`}>
                    
                    {isEmergency && (
                        <div className="w-full max-w-md bg-red-600 text-white font-black text-center p-3 rounded-lg mb-4 mt-2 animate-pulse shadow-[0_0_20px_rgba(220,38,38,0.8)] border border-red-400">
                            🚨 OPERACIONES SUSPENDIDAS: {emergencyType} 🚨
                        </div>
                    )}

                    <div className="w-full max-w-md flex justify-between items-center mb-4 mt-2">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-wider text-indigo-400 flex items-center gap-2">
                                <span className="bg-indigo-600 text-white px-2 py-0.5 rounded text-sm">DP</span> 
                                DISPATCHER PRO
                            </h1>
                            <p className="text-xs text-slate-500 tracking-widest font-semibold mt-1">
                                V44 IA TÁCTICA • <span className="text-emerald-500">MÓDULO GEMINI ON</span>
                            </p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setShowAdmin(!showAdmin)} className="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-colors">⚙️</button>
                        </div>
                    </div>

                    <div className="w-full max-w-md flex gap-2 mb-4">
                        <button onClick={() => toggleEmergency("LLUVIA")} className={`flex-1 p-2 rounded-lg font-bold text-sm transition-all border ${isEmergency && emergencyType === 'LLUVIA' ? 'bg-blue-600 text-white border-blue-400 shadow-[0_0_15px_rgba(37,99,235,0.6)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>
                            🌧️ ALERTA LLUVIA
                        </button>
                        <button onClick={() => toggleEmergency("NEBLINA")} className={`flex-1 p-2 rounded-lg font-bold text-sm transition-all border ${isEmergency && emergencyType === 'NEBLINA' ? 'bg-gray-400 text-gray-900 border-white shadow-[0_0_15px_rgba(156,163,175,0.6)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>
                            🌫️ ALERTA NEBLINA
                        </button>
                    </div>

                    {showAdmin && (
                        <div className="w-full max-w-md bg-slate-800 p-4 rounded-xl mb-4 border border-slate-600 shadow-2xl relative z-50">
                            <h3 className="font-bold text-white mb-2">Panel de Control AI</h3>
                            
                            <label className="block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded text-center cursor-pointer mb-2 transition-colors ai-glow">
                                {isLoadingWeather ? "🧠 PROCESANDO CON GEMINI IA..." : "☁️ SUBIR CLIMA OK TO FLY (IA)"}
                                <input type="file" accept="image/*" className="hidden" onChange={handleWeatherAIUpload} disabled={isLoadingWeather} />
                            </label>

                            <label className="block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded text-center cursor-pointer mb-4 transition-colors">
                                👨‍💼 SUBIR NUEVO ZOHO (CSV)
                                <input type="file" accept=".csv" className="hidden" onChange={handleZohoUpload} />
                            </label>
                            
                            <button onClick={() => setShowAdmin(false)} className="w-full bg-slate-700 py-2 rounded text-sm text-slate-300 hover:bg-slate-600">Cerrar</button>
                        </div>
                    )}

                    <div className="w-full max-w-md glass-panel p-5 mb-4 shadow-2xl relative overflow-hidden">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <p className="text-xs font-bold text-slate-400 tracking-widest uppercase mb-1 flex items-center gap-1">
                                    {isNightShift ? "🌙 TURNO NOCTURNO" : "☀️ TURNO DIURNO"}
                                </p>
                                <div className="text-4xl font-black tracking-tighter neon-text">
                                    {currentTime.toLocaleTimeString('en-US', { hour12: false })}
                                </div>
                                <div className={`mt-2 text-xs font-bold px-2 py-1 rounded inline-block border ${pilotName.includes("Falla") ? "bg-red-900/50 text-red-300 border-red-500/30" : "bg-indigo-900/50 text-indigo-300 border-indigo-500/30"}`}>
                                    👨‍✈️ PILOTO: {pilotName}
                                </div>
                                {needsOkToFly && (
                                    <div className="mt-2 text-[10px] font-bold px-2 py-1 rounded inline-block border bg-red-900/50 text-red-300 border-red-500 ml-2 animate-pulse">
                                        ⚠️ REQUIERE OK TO FLY
                                    </div>
                                )}
                            </div>
                            
                            <div className="text-right flex flex-col items-end">
                                <div className="border border-slate-700 rounded-lg px-3 py-1 mb-2 bg-slate-800/50 shadow-inner">
                                    <p className="text-[10px] text-slate-400 text-center uppercase tracking-widest">Faltan (Turno)</p>
                                    <p className="text-2xl font-bold text-white text-center">{remainingFlightsShift}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 text-right uppercase tracking-widest mb-[-5px]">Total Día</p>
                                    <div className="text-4xl font-black text-emerald-400">
                                        {dailyFlightCount}<span className="text-xl text-slate-600">/{maxDailyFlights}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="w-full max-w-md glass-panel p-4 mb-8 overflow-y-auto max-h-[50vh]">
                        <p className="text-xs font-bold text-slate-400 tracking-widest uppercase mb-4 flex justify-between">
                            <span>📅 Itinerario (8 Vuelos por Turno)</span>
                        </p>
                        
                        <div className="space-y-3">
                            {flights.map((flight, idx) => (
                                <div key={idx} className={`p-3 rounded-lg border flex justify-between items-center transition-all ${flight.status === 'COMPLETADO' ? 'bg-emerald-900/20 border-emerald-900/50 opacity-50' : flight.type === 'RECALCULADO' ? 'bg-amber-900/20 border-amber-500/30 zone-alert' : flight.type === 'COMPRIMIDO' ? 'bg-purple-900/30 border-purple-500/50' : 'bg-slate-800/50 border-slate-700'}`}>
                                    <div>
                                        <h4 className={`text-xl font-black ${flight.status === 'COMPLETADO' ? 'line-through text-slate-500' : 'text-white'}`}>{flight.time}</h4>
                                        <p className={`text-xs mt-1 font-bold ${flight.status === 'COMPLETADO' ? 'text-emerald-500' : 'text-emerald-400'}`}>
                                            {flight.status === 'COMPLETADO' ? `✅ REGISTRADO (${flight.realTime || flight.time})` : '🟩 PENDIENTE'}
                                        </p>
                                        {flight.probLluvia > 0 && flight.status !== 'COMPLETADO' && (
                                            <p className="text-[10px] text-blue-400 font-bold mt-1">☔ {flight.probLluvia}% Prob. Lluvia</p>
                                        )}
                                    </div>
                                    <div className="text-right">
                                        <span className={`text-[10px] px-2 py-1 rounded font-bold ${flight.type === 'FORZOSO' ? 'bg-indigo-600 text-white' : flight.type === 'COMPRIMIDO' ? 'bg-purple-600 text-white' : flight.type === 'RECALCULADO' ? 'bg-amber-600 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                            {flight.type}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`fixed bottom-0 left-0 w-full p-4 backdrop-blur-md border-t flex gap-2 justify-center z-40 transition-colors duration-500 ${isEmergency ? 'bg-red-950/90 border-red-800' : 'bg-[#0F111A]/90 border-slate-800'}`}>
                        <div className="w-full max-w-md flex gap-2">
                            <button onClick={handleLogFlight} disabled={isEmergency} className={`flex-1 py-4 rounded-xl font-black text-lg shadow-[0_0_20px_rgba(79,70,229,0.4)] active:scale-95 transition-all ${isEmergency ? 'bg-slate-700 text-slate-500 shadow-none cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                {isEmergency ? '⛔ BLOQUEADO' : '🚀 REGISTRAR VUELO'}
                            </button>
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
